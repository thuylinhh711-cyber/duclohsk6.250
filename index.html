}, {"q": "图书馆新到了一批书，其中有不少____中国古代丝绸之路的专著，读者们可以免费借阅，也可以预约后带回家阅读。", "a": "关于", "why": "Làm định ngữ nêu đề tài của sách (关于……的专著) → 关于; 对于 không dùng để bổ nghĩa cho danh từ như vậy."}]}, {"id": "bs-157", "tip": "多亏 = nhờ có (ai/điều gì giúp đỡ, thường kèm 了 + người, hàm ý cảm ơn); 幸亏 = may mà (một điều kiện thuận lợi tránh được rủi ro, hơi trang trọng); 幸好 = may thay (giống 幸亏, khẩu ngữ hơn).", "table": true, "words": [{"w": "多亏", "py": "duōkuī", "vi": "nhờ có (người giúp), cảm ơn", "use": "多亏了你；多亏有；多亏……才"}, {"w": "幸亏", "py": "xìngkuī", "vi": "may mà (tránh được rủi ro)", "use": "幸亏及时；幸亏……否则；幸亏带了"}, {"w": "幸好", "py": "xìnghǎo", "vi": "may thay, may là", "use": "幸好没事；幸好来得早；幸好……不然"}], "quiz": [{"q": "这个项目能够按时完成，____了各位同事这几个月来的无私帮助，我在这里向大家表示最衷心的感谢。", "a": "多亏", "why": "Biết ơn sự giúp đỡ của người khác, đi với 了 → 多亏; 幸亏/幸好 chỉ sự may mắn, không cảm ơn ai."}, {"q": "昨天出门时我____带了一把伞，因为下午突然下起了倾盆大雨，没带伞的同事们都被淋成了落汤鸡。", "a": "幸亏", "why": "Điều may mắn giúp tránh rủi ro → 幸亏; 多亏 cần nêu người giúp (幸好 gần nghĩa, nhưng khẩu ngữ hơn)."}, {"q": "他的伤势不算严重，____送医院送得及时，医生说如果再晚半个小时，后果就不堪设想了，家人这才松了一口气。", "a": "幸好", "why": "Nhấn may mắn tránh được hậu quả → 幸好 (幸亏 cùng nghĩa); 多亏 phải kèm đối tượng được cảm ơn."}]}, {"id": "bs-158", "tip": "仿佛 = phảng phất, như thể (văn viết, hình ảnh, so sánh sinh động); 好像 = giống như/hình như (khẩu ngữ, so sánh hoặc đoán không chắc); 似的 = trợ từ đặt cuối (像……似的); 似乎 = dường như (suy đoán, ấn tượng khách quan).", "table": true, "words": [{"w": "仿佛", "py": "fǎngfú", "vi": "phảng phất, như thể", "use": "仿佛……一般；仿佛置身；仿佛昨天"}, {"w": "好像", "py": "hǎoxiàng", "vi": "giống như; hình như", "use": "好像……一样；好像在哪见过；看上去好像"}, {"w": "似的", "py": "shìde", "vi": "như thể (trợ từ cuối cụm)", "use": "像……似的；跟……似的；疯了似的"}, {"w": "似乎", "py": "sìhū", "vi": "dường như (suy đoán)", "use": "似乎有；似乎没有；似乎已经"}], "quiz": [{"q": "站在古老的城墙上远眺，夕阳把整座城市染成了金色，耳边的风声____穿越了千年的时光，把人带回到那个战火纷飞的年代。", "a": "仿佛", "why": "Hình ảnh so sánh giàu chất văn → 仿佛; 似的 là trợ từ cuối cụm, 似乎 chỉ suy đoán."}, {"q": "孩子刚拿到新玩具，就高兴得像过年____，抱着它在客厅里转了好几圈，怎么也不愿意放手让别人碰一下。", "a": "似的", "why": "Cấu trúc 像……似的, đặt cuối cụm → 似的; ba từ còn lại không đứng cuối cụm như vậy."}, {"q": "他今天开会时一直心不在焉，____有什么心事，不管同事们怎么询问，他都只是摇摇头，什么也不肯说。", "a": "似乎", "why": "Suy đoán dựa trên biểu hiện bên ngoài → 似乎; 似的 không đứng đầu vế, 仿佛 thiên về so sánh hình tượng."}, {"q": "我____在哪里见过这位先生，可是不管怎么回忆，都想不起他的名字，也想不起我们是在什么场合认识的。", "a": "好像", "why": "Nhớ mang máng, giọng khẩu ngữ → 好像; 似的 sai vị trí, 仿佛 mang sắc thái văn vẻ không hợp lời nói thường."}]}, {"id": "bs-159", "tip": "否则 = nếu không thì (văn viết, trang trọng, luôn đi kèm vế sau); 不然 = nếu không (khẩu ngữ, có thể đứng riêng thành câu hỏi 不然呢).", "table": true, "words": [{"w": "否则", "py": "fǒuzé", "vi": "nếu không thì (trang trọng)", "use": "否则……将；必须……否则；否则后果"}, {"w": "不然", "py": "bùrán", "vi": "nếu không (khẩu ngữ); không thì sao", "use": "不然的话；不然呢；不然就"}], "quiz": [{"q": "根据合同规定，乙方必须在本月底之前完成全部设备的安装调试，____将按照每天一定比例向甲方支付违约金。", "a": "否则", "why": "Văn bản hợp đồng trang trọng nêu hậu quả → 否则; 不然 mang sắc thái khẩu ngữ."}, {"q": "他想了很久才答应参加这次比赛，我问他为什么改变主意，他苦笑着说：“____呢？队里实在凑不够人，我不上场谁上场？”", "a": "不然", "why": "Dùng đứng riêng như câu hỏi tu từ 'chứ còn sao' → 不然; 否则 không đứng riêng được như thế."}]}, {"id": "bs-160", "tip": "赶快 = mau lên (nhấn tốc độ, thường dùng thúc giục, mệnh lệnh); 赶紧 = tranh thủ ngay (nhấn nắm bắt thời cơ, dùng cả khi kể chuyện quá khứ).", "table": true, "words": [{"w": "赶快", "py": "gǎnkuài", "vi": "mau lên, nhanh lên", "use": "赶快走；赶快回来；赶快把……"}, {"w": "赶紧", "py": "gǎnjǐn", "vi": "tranh thủ, vội vàng ngay", "use": "赶紧跑；赶紧通知；赶紧处理"}], "quiz": [{"q": "听到楼上传来异常的响动，邻居们意识到可能出了事，____放下手中的活儿冲了上去，用力撞开了那扇紧锁的房门。", "a": "赶紧", "why": "Kể lại hành động đã xảy ra, phản ứng ngay lập tức → 赶紧; 赶快 thiên về thúc giục, ít dùng khi tường thuật quá khứ."}, {"q": "比赛马上就要开始了，你还在这里慢吞吞地整理东西，____把运动鞋换上，教练在门口已经等了你好几分钟了。", "a": "赶快", "why": "Câu thúc giục nhấn tốc độ → 赶快; 赶紧 hợp khi tường thuật hành động đã xảy ra."}]}, {"id": "bs-161", "tip": "无从 = không có cách nào để (+ động từ: 无从判断); 无非 = chẳng qua, không ngoài (thường 无非是); 无论 = bất kể (đi với 都/也, thường có 还是/或).", "table": true, "words": [{"w": "无从", "py": "wúcóng", "vi": "không có cách nào, không từ đâu", "use": "无从下手；无从谈起；无从判断"}, {"w": "无非", "py": "wúfēi", "vi": "chẳng qua, không ngoài", "use": "无非是；无非就是；无非想"}, {"w": "无论", "py": "wúlùn", "vi": "bất kể, dù thế nào", "use": "无论……都；无论如何；无论是……还是"}], "quiz": [{"q": "这份报告的原始记录已经在火灾中全部被烧毁，调查人员____判断它究竟是真是假，只能凭现有的间接证据进行分析。", "a": "无从", "why": "Không có điều kiện/phương tiện để làm → 无从; 无非 và 无论 không đi trước động từ với nghĩa này."}, {"q": "大家争论了半天，其实____是在为经费分配的问题互相推诿，谁也不愿意多承担一点责任，会议也因此毫无进展。", "a": "无非", "why": "Nói 'chẳng qua chỉ là' → 无非; 无从 là không có cách, 无论 là bất kể."}, {"q": "这位老教授____刮风还是下雨，每天清晨六点都会准时出现在操场上，带领学生们打一套太极拳，从未间断过。", "a": "无论", "why": "Đi với 还是 nêu mọi điều kiện đều như nhau → 无论; 无从 và 无非 không có nghĩa này."}]}, {"id": "bs-162", "tip": "务必 = nhất thiết phải (yêu cầu, dặn dò người khác, ý chí chủ quan); 势必 = tất sẽ (suy đoán xu thế khách quan, kết quả tất yếu).", "table": true, "words": [{"w": "务必", "py": "wùbì", "vi": "nhất thiết phải (dặn dò)", "use": "务必注意；务必准时；务必保证"}, {"w": "势必", "py": "shìbì", "vi": "tất sẽ, tất yếu", "use": "势必会；势必导致；势必引起"}], "quiz": [{"q": "明天的会议关系到公司全年的战略部署，请各部门负责人____准时出席，不得无故缺席，也不要安排其他活动。", "a": "务必", "why": "Yêu cầu, dặn dò người khác phải làm → 务必; 势必 là suy đoán kết quả, không dùng để ra yêu cầu."}, {"q": "如果企业只追求短期利润而忽视产品质量，长此以往，消费者对它的信任____会逐渐流失，品牌也将慢慢失去市场。", "a": "势必", "why": "Suy đoán kết quả tất yếu theo xu thế → 势必; 务必 dùng để yêu cầu, không dùng để dự đoán."}]}, {"id": "bs-163", "tip": "要是 = nếu (giả thiết, khẩu ngữ); 要不 = hay là (gợi ý) hoặc nếu không (khẩu ngữ); 要不然 = nếu không thì (nêu hậu quả của điều vừa nói).", "table": true, "words": [{"w": "要是", "py": "yàoshi", "vi": "nếu (giả thiết)", "use": "要是……就；要是有；要是没有"}, {"w": "要不", "py": "yàobù", "vi": "hay là; nếu không", "use": "要不咱们；要不就；要不……吧"}, {"w": "要不然", "py": "yàobùrán", "vi": "nếu không thì (hậu quả)", "use": "要不然就；要不然会；要不然……"}], "quiz": [{"q": "____明天天气晴朗，我们就带着孩子去郊外的湿地公园野餐，让他们好好亲近一下大自然，顺便观察各种鸟类。", "a": "要是", "why": "Nêu giả thiết kèm 就 → 要是; 要不 và 要不然 không mở vế giả thiết."}, {"q": "这个周末你如果没有别的安排，____咱们一起去爬山吧，天气预报说这两天都是晴天，正适合户外活动。", "a": "要不", "why": "Đưa ra gợi ý 'hay là…' → 要不; 要是 là giả thiết, 要不然 nêu hậu quả chứ không gợi ý."}, {"q": "你一定要把这份合同仔细核对一遍，____一旦出现错误，后果由谁来承担？到时候公司和客户都会追究责任的。", "a": "要不然", "why": "Nêu hậu quả nếu không làm điều vừa nói → 要不然; 要是 là giả thiết, 要不 thiên về gợi ý."}]}, {"id": "bs-164", "tip": "一贯 = nhất quán (tác phong, chủ trương, thường làm định ngữ); 一向 = từ trước đến nay (thói quen, tình trạng); 一直 = luôn/suốt (thời gian liên tục, cả hướng đi thẳng); 始终 = từ đầu đến cuối (thái độ, lập trường không đổi).", "table": true, "words": [{"w": "一贯", "py": "yíguàn", "vi": "nhất quán (tác phong, chủ trương)", "use": "一贯作风；一贯主张；一贯如此"}, {"w": "一向", "py": "yíxiàng", "vi": "từ trước đến nay (thói quen)", "use": "一向如此；一向很；一向不"}, {"w": "一直", "py": "yìzhí", "vi": "luôn, suốt; thẳng một mạch", "use": "一直走；一直在；一直以来"}, {"w": "始终", "py": "shǐzhōng", "vi": "từ đầu đến cuối, trước sau như một", "use": "始终如一；始终坚持；始终不"}], "quiz": [{"q": "他的____作风，在公司里是出了名的，面对再大的压力，他也能迅速拿出解决方案，从不拖泥带水，更不会推卸责任。", "a": "一贯", "why": "Làm định ngữ cho 作风, chỉ tác phong ổn định lâu dài → 一贯; 一向/一直/始终 không đứng trước 作风 như vậy."}, {"q": "我____睡得很早，晚上十点一过就困得睁不开眼睛，所以朋友们邀请我去吃夜宵，我从来都是婉言谢绝。", "a": "一向", "why": "Thói quen từ trước đến nay → 一向; 始终 nhấn thái độ không đổi, 一直 nhấn liên tục theo thời gian."}, {"q": "请沿着这条主干道____往前走，大约五百米之后你会看到一座红色的天桥，银行就在天桥右侧的拐角处。", "a": "一直", "why": "Chỉ hướng đi thẳng → 一直; 一贯, 一向, 始终 không chỉ phương hướng."}, {"q": "面对外界的各种质疑和压力，这位科学家____坚信自己的研究方向是正确的，从实验设计到数据分析从未动摇过。", "a": "始终", "why": "Nhấn thái độ từ đầu đến cuối không dao động → 始终; 一向 chỉ thói quen, 一直 chỉ sự liên tục."}]}, {"id": "bs-165", "tip": "一再 = hết lần này đến lần khác (lặp lại, đứng trước động từ, hay đi với 强调/要求/违反); 再三 = ba lần bốn lượt (thường 考虑再三, 再三叮嘱, có thể đứng sau động từ).", "table": true, "words": [{"w": "一再", "py": "yízài", "vi": "hết lần này đến lần khác", "use": "一再强调；一再要求；一再违反"}, {"w": "再三", "py": "zàisān", "vi": "nhiều lần, đi đi lại lại", "use": "再三叮嘱；考虑再三；再三推辞"}], "quiz": [{"q": "这个决定关系到公司的前途，董事会成员们反复讨论，思考____，最终才做出了谨慎的选择，并要求各部门全力配合。", "a": "再三", "why": "Đứng sau động từ (思考再三) → 再三; 一再 chỉ đứng trước động từ."}, {"q": "这名司机____违反交通法规，在一个月内先后闯了三次红灯，终于被吊销了驾驶证，受到了应有的处罚。", "a": "一再", "why": "Lặp lại hành vi vi phạm nhiều lần, đứng trước động từ → 一再; 再三 không đi tự nhiên với 违反."}]}, {"id": "bs-166", "tip": "以便 = để tiện (liên từ, mở vế mục đích, có thể có chủ ngữ mới); 便于 = dễ dàng cho (động từ, đi với cụm động từ, không có chủ ngữ riêng).", "table": true, "words": [{"w": "以便", "py": "yǐbiàn", "vi": "để tiện, để có thể", "use": "以便于；以便及时；以便……"}, {"w": "便于", "py": "biànyú", "vi": "thuận tiện cho, dễ dàng cho", "use": "便于携带；便于管理；便于操作"}], "quiz": [{"q": "请各位同学提前把实验报告发到我的邮箱里，____我在课前统一检查，并挑选出有代表性的作业在课堂上进行讲评。", "a": "以便", "why": "Mở vế mục đích có chủ ngữ mới (我) → 以便; 便于 không mang chủ ngữ riêng như vậy."}, {"q": "这款折叠婴儿车的整体重量很轻，收起后体积也很小，____携带和存放，非常适合经常出差旅行的家庭使用。", "a": "便于", "why": "Theo sau là cụm động từ 携带和存放, không có chủ ngữ mới → 便于; 以便 cần mở vế câu riêng."}]}, {"id": "bs-167", "tip": "以致 = dẫn đến (kết quả thường xấu, không mong muốn); 以至 = đến nỗi/cho đến (chỉ mức độ, phạm vi, thời gian kéo dài tới).", "table": true, "words": [{"w": "以致", "py": "yǐzhì", "vi": "dẫn đến (kết quả xấu)", "use": "以致发生；以致造成；以致失败"}, {"w": "以至", "py": "yǐzhì", "vi": "đến nỗi; cho đến (mức độ/phạm vi)", "use": "以至于；以至连；从……以至……"}], "quiz": [{"q": "由于施工单位没有严格执行安全规程，____发生了严重的坍塌事故，造成多名工人受伤，公司也被责令停工整顿。", "a": "以致", "why": "Nêu hậu quả xấu do nguyên nhân ở vế trước → 以致; 以至 chủ yếu chỉ mức độ hoặc phạm vi."}, {"q": "这种移动支付方式近年来发展迅速，从一线城市到二线城市，____偏远的乡村，几乎每家商店都可以扫码付款。", "a": "以至", "why": "Nối phạm vi mở rộng dần (từ…cho đến…) → 以至; 以致 chỉ kết quả xấu nên không hợp."}]}, {"id": "bs-168", "tip": "预先 = làm sẵn từ trước theo kế hoạch (设定, 安排); 原先 = ban đầu, trước kia (so với hiện tại đã đổi); 事先 = trước khi sự việc xảy ra (通知, 打招呼).", "table": true, "words": [{"w": "预先", "py": "yùxiān", "vi": "trước, từ trước (có chuẩn bị)", "use": "预先设定；预先安排；预先准备"}, {"w": "原先", "py": "yuánxiān", "vi": "ban đầu, vốn dĩ (so với nay)", "use": "原先的计划；原先是；比原先"}, {"w": "事先", "py": "shìxiān", "vi": "trước khi việc xảy ra", "use": "事先通知；事先打招呼；事先了解"}], "quiz": [{"q": "这套软件会按照用户____设定好的时间，自动在每天凌晨清理缓存文件，不需要人工操作，也不会影响白天的正常使用。", "a": "预先", "why": "Cài đặt sẵn theo kế hoạch → 预先; 原先 chỉ trạng thái ban đầu, 事先 gần nghĩa nhưng thiên về trước sự cố."}, {"q": "这条街____只是一条狭窄的小路，如今已经被拓宽成了双向六车道的大马路，两旁还新建了许多高楼和商场。", "a": "原先", "why": "So sánh trạng thái ban đầu với hiện nay → 原先; 预先 và 事先 chỉ 'trước một việc'."}, {"q": "他没有____通知任何人就突然辞职离开了公司，让同事们措手不及，许多正在进行的项目也一时无人接手。", "a": "事先", "why": "Chưa báo trước khi sự việc xảy ra → 事先; 原先 chỉ trạng thái cũ, 预先 thiên về chuẩn bị theo kế hoạch."}]}, {"id": "bs-169", "tip": "专门 = chuyên (dành riêng cho một mục đích; còn làm tính từ 专门机构); 特意 = cố ý, đặc biệt (làm riêng vì ai đó, thể hiện tình cảm).", "table": true, "words": [{"w": "专门", "py": "zhuānmén", "vi": "chuyên, dành riêng", "use": "专门负责；专门机构；专门研究"}, {"w": "特意", "py": "tèyì", "vi": "cố ý, đặc biệt (vì ai)", "use": "特意准备；特意赶来；特意为……"}], "quiz": [{"q": "为了保护濒危物种，政府成立了一个____负责野生动物救助和栖息地修复的机构，并配备了经验丰富的兽医和研究人员。", "a": "专门", "why": "Mô tả cơ quan chuyên trách một nhiệm vụ → 专门; 特意 chỉ ý đặc biệt vì ai đó."}, {"q": "听说我来北京出差，多年不见的老同学____请了半天假，开车到高铁站接我，还订好了我最爱吃的那家烤鸭店。", "a": "特意", "why": "Thể hiện tấm lòng làm riêng vì người khác → 特意; 专门 nhấn chuyên dụng, ít mang sắc thái tình cảm."}]}, {"id": "bs-170", "tip": "自从 = từ khi (giới từ, đi với mốc thời gian, mở đầu câu); 从此 = từ đó (phó từ, đứng sau sự việc, nối với kết quả về sau).", "table": true, "words": [{"w": "自从", "py": "zìcóng", "vi": "từ khi, kể từ", "use": "自从……以来；自从……以后；自从那时"}, {"w": "从此", "py": "cóngcǐ", "vi": "từ đó, từ nay", "use": "从此以后；从此再也；从此之后"}], "quiz": [{"q": "____搬到新家以后，他每天上班的路程缩短了将近一个小时，早晨不用再匆匆忙忙赶地铁，生活节奏明显轻松了许多。", "a": "自从", "why": "Nêu mốc thời gian bắt đầu (搬到新家以后) → 自从; 从此 phải đứng sau sự việc đã nêu."}, {"q": "那次惨痛的失败让他明白了准备不足的代价，____以后，他每次出发前都要把计划反复检查好几遍，再也不敢掉以轻心。", "a": "从此", "why": "Nối sự việc trước với kết quả kéo dài về sau → 从此; 自从 phải kèm mốc thời gian cụ thể, không đứng trước 以后 như vậy."}]}]);
const MG=[{"id": "yuan", "add_words": [{"w": "指责", "py": "zhǐzé", "vi": "chỉ trích, phê phán công khai", "use": "公开指责；严厉指责"}], "add_quiz": [{"q": "面对媒体的____，这家公司没有推卸责任，而是公开道歉并宣布了一系列整改措施，努力挽回声誉。", "a": "指责", "why": "Bị người ngoài phê phán công khai lỗi → 指责; 抱怨 là than phiền riêng, 牢骚 là càu nhàu."}], "tip_append": "指责 = chỉ trích, phê phán công khai lỗi lầm của người khác (mức độ mạnh, trang trọng hơn 抱怨)."}, {"id": "bian", "add_words": [{"w": "反驳", "py": "fǎnbó", "vi": "phản bác (bằng lý lẽ)", "use": "据理反驳；无力反驳"}, {"w": "反对", "py": "fǎnduì", "vi": "phản đối", "use": "强烈反对；反对意见"}], "add_quiz": [{"q": "对方辩手提出的数据明显有误，我方立刻拿出权威报告逐条加以____，赢得了评委们的一致认可。", "a": "反驳", "why": "Dùng lý lẽ chứng cứ bác bỏ lập luận → 反驳; 辩护 là bênh vực mình."}, {"q": "虽然不少家长强烈____取消课外辅导班，但政策还是顺利推行了，因为大多数家庭其实是支持减负的。", "a": "反对", "why": "Thái độ không đồng ý với một chủ trương → 反对; 反驳 cần có lý lẽ cụ thể."}], "tip_append": "反驳 = phản bác bằng lý lẽ, chứng cứ; 反对 = phản đối ý kiến, hành động (không nhất thiết phải đưa lý lẽ)."}, {"id": "hxl-cai", "add_words": [{"w": "采用", "py": "cǎiyòng", "vi": "sử dụng, chọn dùng", "use": "采用新技术；采用方案"}], "add_quiz": [{"q": "这座大桥的建设____了国际领先的抗震技术，即使遇到八级地震也能保持结构稳定，不会发生严重坍塌。", "a": "采用", "why": "Chọn dùng kỹ thuật → 采用; 采取 đi với biện pháp, 采纳 với ý kiến."}], "tip_append": "采用 = sử dụng, chọn dùng (phương pháp, kỹ thuật, vật liệu), khác 采取 (biện pháp, thái độ)."}, {"id": "shi", "add_words": [{"w": "蔑视", "py": "mièshì", "vi": "khinh miệt, coi người khác thấp kém", "use": "蔑视的眼神；蔑视对手；充满蔑视"}, {"w": "鄙视", "py": "bǐshì", "vi": "khinh bỉ, coi thường về mặt đạo đức", "use": "鄙视这种行为；遭人鄙视；被鄙视"}, {"w": "藐视", "py": "miǎoshì", "vi": "coi thường, xem nhẹ (nhiều khi kiêu ngạo, thách thức)", "use": "藐视法庭；藐视困难；藐视权威"}], "add_quiz": [{"q": "那位年轻选手刚出道时没人看好，对手们常常投来____的眼神，他却不动声色，用连续三场漂亮的胜利让所有人都闭上了嘴。", "a": "蔑视", "why": "Ánh mắt khinh miệt người bị cho là yếu kém → 蔑视; 歧视 là đối xử phân biệt, 忽视 là bỏ sót vô ý."}, {"q": "大家都很____那些背后捏造谣言、陷害同事来换取升职机会的人，认为这种行为不仅十分卑鄙，还严重破坏了整个团队的信任。", "a": "鄙视", "why": "Khinh bỉ về mặt đạo đức, coi hành vi là đê tiện → 鄙视; 歧视 là phân biệt đối xử theo nhóm, 轻视 chỉ là coi nhẹ."}, {"q": "被告在法庭上大声咆哮，拒绝回答法官的任何提问，法官当场指出他的行为已经____法庭，并依法对他处以了罚款和拘留的处罚。", "a": "藐视", "why": "Cụm pháp lý 藐视法庭, coi thường quyền uy một cách ngang nhiên → 藐视; 无视/忽视 không dùng với 法庭 theo nghĩa này."}], "tip_append": "蔑视 = khinh miệt, nhìn người khác thấp kém (thường qua ánh mắt, thái độ); 鄙视 = khinh bỉ về mặt đạo đức; 藐视 = coi thường ngang nhiên, thách thức quyền uy hay khó khăn (藐视法庭, 藐视困难)."}, {"id": "hxg-3", "add_words": [], "add_quiz": [{"q": "经过多方调查，专家组最终____这起事故是由设备老化引起的，并要求相关部门限期整改。", "a": "认定", "why": "认定 = đưa ra kết luận chắc chắn sau điều tra. 承认 là chính người trong cuộc thừa nhận, không hợp với chủ thể là nhóm chuyên gia."}, {"q": "面对记者的连续追问，那位官员终于____了自己在工作中存在失误，并向公众公开道歉。", "a": "承认", "why": "承认 = thừa nhận lỗi/sự thật của chính mình. 认定 là kết luận về người hoặc việc khác, không đi với việc tự nhận lỗi."}], "tip_append": "Khi cơ quan điều tra hoặc chuyên gia đưa ra kết luận chắc chắn thì dùng 认定; khi chính người nói nhận lỗi, nhận sự thật của mình thì dùng 承认."}, {"id": "wei", "add_words": [], "add_quiz": [{"q": "这样的做法完全____了大家当初共同追求的理想，让许多一直支持他的人感到失望和痛心。", "a": "违背", "why": "违背 đi với 理想, 初衷, 原则 (điều mình từng tin theo). 违反 dành cho quy định, luật lệ cụ thể."}, {"q": "那名司机在明知前方限速的情况下仍然高速行驶，严重____了交通规则，最终被交警依法处罚。", "a": "违反", "why": "违反 + 规则/规定 = vi phạm quy định cụ thể. 违背 dành cho ý nguyện, nguyên tắc, không đi với 交通规则."}], "tip_append": "Khi nói đến lý tưởng, mong ước chung của một nhóm người thì dùng 违背; khi nói đến luật lệ, quy tắc giao thông thì dùng 违反."}, {"id": "hxg-26", "add_words": [{"w": "维护", "py": "wéihù", "vi": "bảo vệ, gìn giữ (quyền lợi, trật tự)", "use": "维护权益；维护秩序；维护和平"}], "add_quiz": [{"q": "消费者协会表示，将依法____每一位消费者的合法权益，并对恶意欺诈的商家予以严厉处罚。", "a": "维护", "why": "维护 + 权益 = bảo vệ quyền lợi khỏi bị xâm phạm. 维持 chỉ giữ nguyên hiện trạng, 保持 là giữ trạng thái, không có nghĩa bảo vệ."}], "tip_append": "维护 = bảo vệ, gìn giữ cho khỏi bị tổn hại (quyền lợi, trật tự, hoà bình); khác với 维持 là giữ nguyên hiện trạng."}, {"id": "zhang", "add_words": [{"w": "阻挠", "py": "zǔnáo", "vi": "cố ý ngăn cản, cản trở", "use": "百般阻挠；阻挠改革；受到阻挠"}, {"w": "阻拦", "py": "zǔlán", "vi": "chặn lại, ngăn lại", "use": "阻拦去路；拼命阻拦；无法阻拦"}, {"w": "故障", "py": "gùzhàng", "vi": "sự cố, trục trặc (máy móc)", "use": "发生故障；排除故障；机械故障"}], "add_quiz": [{"q": "一些利益相关者百般____这项环保法规的出台，因为它会让他们的生产成本明显提高。", "a": "阻挠", "why": "阻挠 = cố ý ngăn cản để việc không thành, thường vì lợi ích riêng. 阻拦 là chặn bằng hành động cụ thể, 阻碍 trung tính hơn."}, {"q": "保安拼命____那些想要冲进会场的人群，场面一度十分混乱，直到警察赶来才恢复秩序。", "a": "阻拦", "why": "阻拦 = chặn lại trực tiếp người hoặc vật đang di chuyển. 阻挠 là cản trở việc làm, không dùng cho đám đông xông vào."}, {"q": "地铁因信号系统出现____，导致几条线路延误了近一个小时，数万名乘客上班迟到。", "a": "故障", "why": "故障 = sự cố, hỏng hóc của thiết bị. 障碍 là chướng ngại, rào cản, không đi với 出现…导致延误 trong nghĩa hỏng hóc máy móc."}], "tip_append": "阻挠 = cố ý ngăn cản để việc không thành; 阻拦 = chặn lại bằng hành động cụ thể; 故障 = sự cố, trục trặc của máy móc, thiết bị (khác nhóm nghĩa với các từ còn lại)."}, {"id": "zu", "add_words": [{"w": "制约", "py": "zhìyuē", "vi": "ràng buộc, kiềm chế", "use": "制约发展；相互制约；受到制约"}, {"w": "终止", "py": "zhōngzhǐ", "vi": "chấm dứt, kết thúc", "use": "终止合同；终止谈判；被迫终止"}], "add_quiz": [{"q": "资金不足和技术落后一直____着这家小企业的发展，管理层必须想办法尽快突破这些限制。", "a": "制约", "why": "制约着 = các nhân tố hạn chế sự phát triển. 阻止 là ngăn một hành động, 控制 là kiểm soát, đều không diễn tả nhân tố ràng buộc."}, {"q": "由于双方在价格问题上始终无法达成一致，谈判不得不被迫____，合作计划也随之搁浅。", "a": "终止", "why": "被迫终止 = bị buộc chấm dứt hẳn. 制约 không có nghĩa dừng; 阻止 cần chủ thể ngăn một hành động đang hoặc sắp xảy ra."}], "tip_append": "制约 = ràng buộc, hạn chế lẫn nhau (nhân tố, điều kiện); 终止 = chấm dứt, dừng hẳn (quá trình, hợp đồng, đàm phán)."}, {"id": "hxg-14", "add_words": [{"w": "造成", "py": "zàochéng", "vi": "gây ra, tạo thành", "use": "造成损失；造成影响；造成伤亡"}, {"w": "引起", "py": "yǐnqǐ", "vi": "gây ra, khơi dậy", "use": "引起重视；引起关注；引起争论"}], "add_quiz": [{"q": "暴雨____了严重的城市内涝，部分地区的直接经济损失已超过两亿元，救援工作仍在进行中。", "a": "造成", "why": "造成 + danh từ kết quả (内涝, 损失, 伤亡) = gây ra hậu quả. 引起 thiên về sự chú ý, phản ứng; 形成 là hình thành dần."}, {"q": "他在会上的那番言论____了与会者的强烈关注，会后许多人围住他，希望了解更多细节。", "a": "引起", "why": "引起 + 关注/重视/争论 = khơi dậy sự chú ý, tranh luận. 造成 thiên về hậu quả, tổn thất, không đi với 关注."}], "tip_append": "造成 = gây ra, tạo thành (hậu quả, tổn thất, ảnh hưởng, thường đi với danh từ); 引起 = gây ra, khơi dậy (chú ý, tranh luận, phản ứng); khác với 导致 đi sau với mệnh đề kết quả."}, {"id": "hxg-8", "add_words": [], "add_quiz": [{"q": "这部纪录片播出之后，社会各界的____十分热烈，有人写信，有人捐款，还有人主动报名当志愿者。", "a": "反响", "why": "Phản ứng của dư luận sau khi một thứ được công bố → 反响. 反馈 là thông tin gửi ngược về, không nói về tiếng vang."}, {"q": "学生通过问卷把对课程的意见传回给老师，老师根据这些____调整教学进度和方式。", "a": "反馈", "why": "Thông tin truyền ngược về để điều chỉnh → 反馈. 反响 là dư luận rộng, không dùng cho kênh ý kiến cụ thể."}], "tip_append": "Thêm: 反响 nhấn vào tiếng vang của dư luận ra bên ngoài, còn 反馈 là thông tin từ phía nhận quay ngược về nguồn."}, {"id": "qi", "add_words": [], "add_quiz": [{"q": "这位登山者的经历给我们带来了深刻的____：只要不放弃，再艰难的处境也会出现转机。", "a": "启示", "why": "Bài học gợi mở rút ra từ trải nghiệm → 启示. 启事 là thông báo dán công khai."}, {"q": "他的钱包在公交车上丢了，只好在小区的公告栏里贴了一则寻物____，希望拾到的人能够联系他。", "a": "启事", "why": "Thông báo tìm đồ → 启事. 启示 là gợi mở, không phải thông báo."}], "tip_append": "Thêm: 启示 (qǐshì, gợi mở, bài học rút ra) và 启事 (qǐshì, thông báo, cáo thị) đồng âm nhưng khác chữ, dễ nhầm khi viết."}, {"id": "hxg-28", "add_words": [], "add_quiz": [{"q": "受疫情影响，医院的护理人员出现了较大的____，不少科室只能让医生轮流兼顾夜班。", "a": "缺口", "why": "Chỗ thiếu hụt về nhân lực → 缺口. 缺点 là nhược điểm, không chỉ số lượng thiếu."}, {"q": "检测发现，这批汽车的刹车系统存在设计____，厂家随即宣布召回全部问题车辆。", "a": "缺陷", "why": "Lỗi thiết kế của sản phẩm → 缺陷. 缺点 nhẹ hơn, thiên về tính cách, ý kiến."}], "tip_append": "Thêm: 缺陷 thường chỉ lỗi nghiêm trọng của sản phẩm, thiết kế; 缺口 là chỗ thiếu hụt về số lượng; 缺点 là nhược điểm của người hay ý kiến."}, {"id": "mian", "add_words": [{"w": "省得", "py": "shěngde", "vi": "đỡ phải, khỏi tốn công", "use": "省得麻烦；省得再跑一趟；省得花钱"}, {"w": "免得", "py": "miǎnde", "vi": "để khỏi, kẻo", "use": "免得误事；免得担心；免得错过"}], "add_quiz": [{"q": "我已经把资料整理好发到了你的邮箱，你在家里直接打印就行，____你再专程跑一趟公司，来回折腾大半天。", "a": "省得", "why": "Nhấn đỡ tốn công đi lại → 省得; 未免/不免 không nối vế mục đích thế này (免得 và 以免 cũng gần nghĩa nhưng 省得 nhấn tiết kiệm công sức)."}, {"q": "明天一早的航班不能误点，我们今晚就把行李收拾好，并且提前订好出租车，____到时候手忙脚乱，错过登机时间。", "a": "免得", "why": "Dẫn vế tránh hậu quả xấu (lỡ giờ bay) → 免得; 未免 là chê quá mức, 不免 là khó tránh khỏi, không dùng được."}], "tip_append": "省得 = đỡ phải (nhấn tiết kiệm công sức, khẩu ngữ); 免得 = để khỏi (nhấn tránh hậu quả không mong muốn), hai từ này gần như dùng thay được."}, {"id": "con", "add_words": [{"w": "时而", "py": "shí'ér", "vi": "thỉnh thoảng, lúc thì", "use": "时而……时而……；时而传来；时而出现"}, {"w": "反倒", "py": "fǎndào", "vi": "trái lại, ngược lại (khẩu ngữ)", "use": "反倒更；反倒不如；反倒添乱"}, {"w": "反之", "py": "fǎnzhī", "vi": "ngược lại thì (mở vế đối lập)", "use": "反之亦然；反之则；反之，……"}], "add_quiz": [{"q": "山路两侧的景色美不胜收，汽车在盘山公路上缓缓行驶，窗外____传来几声清脆的鸟鸣，让人感到格外心旷神怡。", "a": "时而", "why": "Chỉ sự việc thỉnh thoảng xuất hiện xen kẽ → 时而; 反倒 và 反之 không có nghĩa tần suất."}, {"q": "他本以为提前出发就能避开早高峰，没想到路上的车辆比平时更多，结果____比平常晚到了半个小时，还错过了开场。", "a": "反倒", "why": "Kết quả trái ngược mong đợi, giọng khẩu ngữ → 反倒; 时而 chỉ luân phiên, 反之 mở vế đối lập (反而 cũng gần nghĩa)."}, {"q": "如果企业重视员工培训，员工的能力就会不断提升；____，如果长期忽视培训，企业就会逐渐失去市场竞争力。", "a": "反之", "why": "Mở vế đối lập với điều kiện trước → 反之; 时而 và 反倒 không dùng để nối hai vế điều kiện đối nhau."}], "tip_append": "时而 = lúc thì (thường lặp 时而……时而……, miêu tả thay đổi luân phiên); 反倒 = trái lại (khẩu ngữ, gần 反而); 反之 = ngược lại thì (mở vế đối lập, văn viết)."}, {"id": "kuang", "add_words": [{"w": "暂且", "py": "zànqiě", "vi": "tạm thời, trước mắt", "use": "暂且搁置；暂且不谈；暂且如此"}, {"w": "姑且", "py": "gūqiě", "vi": "cứ tạm, đành", "use": "姑且一试；姑且不论；姑且相信"}], "add_quiz": [{"q": "由于新校区还没有建成，一年级的新生们____在老校区上课，等明年九月份校舍竣工后再统一搬迁过去。", "a": "暂且", "why": "Sắp xếp tạm thời đến khi có điều kiện mới → 暂且; 尚且/况且 là liên từ, 姑且 nghiêng về 'cứ đành thử'."}, {"q": "这个偏方虽然没有得到科学证实，但既然常规治疗效果不明显，患者家属决定____试一试，看看能否缓解症状。", "a": "姑且", "why": "Đành thử dù chưa chắc → 姑且; 暂且 nhấn tạm thời về thời gian, 况且 là 'vả lại'."}], "tip_append": "暂且 = tạm thời (trước mắt, sau sẽ tính lại); 姑且 = cứ tạm, đành thử/đành cho là vậy (chưa thật hài lòng)."}];
MG.forEach(m=>{const g=G.find(x=>x.id===m.id);if(!g)return;const have=new Set(g.words.map(w=>w.w));(m.add_words||[]).forEach(w=>{if(!have.has(w.w))g.words.push(w)});(m.add_quiz||[]).forEach(q=>g.quiz.push(q));if(m.tip_append)g.tip=(g.tip||'')+' '+m.tip_append;});
})();

{ id:'t9-68', src:'HSK 6 Advanced test 9 · câu 68', gid:'zu', official:true,
  q:'空调使用一段时间后，过滤网上往往会____大量灰尘。这些灰尘使气流循环受阻，____冷空气吹出，降温的效果就差多了。在这种情况下要将室内的温度降下来，空调就要____工作时间，耗费更多的电能。因此，如果能定期____隔尘网，我们就可以节省大约30%的电力。',

  note:'Dòng đáp án trong ảnh bị cắt, ảnh ghi "đúng:C". Phần giải thích từng cột là suy luận của mình.',
  vocab:[{w:'过滤网',py:'guòlǜwǎng',vi:'lưới lọc'},{w:'灰尘',py:'huīchén',vi:'bụi'},{w:'气流',py:'qìliú',vi:'luồng khí'},{w:'循环',py:'xúnhuán',vi:'tuần hoàn'},{w:'耗费',py:'hàofèi',vi:'tiêu tốn'},{w:'电能',py:'diànnéng',vi:'điện năng'},{w:'定期',py:'dìngqī',vi:'định kỳ'}],

  {sec:'Cột 2: ngăn, cản',w:'阻止',py:'zǔzhǐ',vi:'ngăn cản có chủ ý',use:'阻止犯罪',ex:'警察阻止了他。'},

{ id:'t9-70', src:'HSK 6 Advanced test 9 · câu 70', gid:'zhiyi', official:true,
  q:'近年来，不少学校开展的感恩教育活动都要求学生给父母洗一次脚。这引发了有关人士的____。中华民族是一个有着数千年文明史的伟大民族，____是我们的传统美德。学校对学生进行感恩教育____是正确的，但是，如果不考虑学生的具体情况，只是____地采取“一刀切”的模式，恐怕不但达不到预期的教育效果，反而会使学生产生抵触____。',

{ id:'hx1-61', src:'Hexin đề 1 · câu 61', gid:'hxg-1', official:true,

{ id:'hx4-68', src:'Hexin đề 4 · câu 68', gid:'yun', official:true,

{ id:'hx4-69', src:'Hexin đề 4 · câu 69', gid:'hxg-51', official:true,

  q:'人们也往往乐于接受新鲜的消息，而不愿____。所以，在人际交往中，人们总是对新闻感兴趣，老友相____总是先把自己的新情况和新消息告诉对方。而且，人们也容易接受具有____性的信息，以及乐于知道____社会和他人的禁锢的信息。',

const DET = {
'd1-61': `① 盲从 (mù quáng theo): câu trước nói 不要被信条所惑, nên "theo tín điều" ở đây là việc bị phê phán. 听从 / 服从 / 遵从 đều trung tính hoặc tích cực (nghe theo, phục tùng, tuân theo) nên không có ý "mù quáng".
② 淹没 (nhấn chìm): ý kiến người khác lấn át "tiếng nói bên trong", giống nước ngập mất vật. 掩盖 là che giấu sự thật, 遮住 là che một vật cụ thể, 淡化 là làm nhạt đi, đều lệch nghĩa.
③ 勇气: 拥有跟随内心的勇气 = có dũng khí sống theo trái tim. 决心 là quyết tâm, 才华 là tài năng, 胆量 là gan dạ (thiên về dám làm việc mạo hiểm).
④ 多少: 已经 + 多少 = "ít nhiều đã biết rồi". 早晚 / 迟早 nói về tương lai ("sớm muộn gì") nên mâu thuẫn với 已经. 左右 là "khoảng", không dùng ở vị trí này.
Mẹo: chốt chỗ ④ trước, loại ngay 听从 và 服从 (vì 早晚, 迟早), còn lại C và D, rồi chỗ ① chọn 盲从.`,
'd1-62': `① 不由得: phản xạ không kìm được (嗅嗅鼻子 là động tác vô thức). 巴不得 là mong sao, 舍不得 là tiếc không nỡ, 不见得 là chưa chắc, đều không hợp một động tác phản xạ.
② 购买: cần mua mấy cuốn sách, 急需购买的几本书. 检索 là tra cứu, 出卖 là bán, 征订 là đặt mua theo đợt do cơ quan tổ chức (không phải cá nhân tự đi mua).
③ 慌忙: vội vàng rút chân lại, đứng trước 把 làm trạng từ. 尴尬, 紧张, 混乱 là tính từ, không đứng ở vị trí trạng từ này.
Mẹo: chỗ ② chỉ có 购买 hợp nghĩa, chốt luôn đáp án D.`,
'd1-63': `① 宗旨: 以…为宗旨 là cách nói của tổ chức, cơ quan (教委). 以…为目的 cũng nghe được nên chỗ này chưa chốt được.
② 解放: 从课业压力中解放出来 (được giải phóng khỏi). 放松 là thư giãn, 解救 là cứu thoát khỏi nguy hiểm, 救助 là cứu trợ, đều không hợp.
③ 彻底: 彻底放下心理包袱 (hoàn toàn buông). 根本 hay dùng với phủ định, 干脆 / 索性 là "dứt khoát", nghĩa khác.
④ 未免: 未免有些天真 = hơi ngây thơ quá, nhận xét phê bình nhẹ. 难免 / 不免 là "khó tránh khỏi", 以免 là "để khỏi", nối hai vế.
Mẹo: chốt chỗ ④ 未免 (nhận xét "hơi quá") và chỗ ② 解放 là xong, đáp án D.`,
'd1-64': `① 系列: 系列活动 là cụm cố định (chuỗi hoạt động liên quan). 连串 hay đi với vấn đề, 连续 là liên tục theo thời gian, 并列 là xếp song song.
② 共同: do nhiều đơn vị cùng nhau tạo ra (共同打造). 一并 / 携手 / 联合 cũng nghe được, nên chỗ này không dùng để chốt.
③ 于: 献演于上海大剧院, 于 + địa điểm là văn viết. 到 và 给 không đi với 献演.
④ 体验: 初体验 (lần trải nghiệm đầu), gắn với việc đi thực địa. 感受 gần nghĩa, nhưng 领悟 và 理解 thiên về hiểu ra nên không hợp.
Mẹo: chỗ ① 系列 và chỗ ③ 于 là hai chỗ chốt chắc, đáp án C.`,
'd1-65': `① 作用: 维持生存的作用, tức vai trò duy trì sự sống. 地位, 性质, 性能 không hợp với "vượt qua cái … của việc duy trì sinh tồn".
② 对于: 对于…快感的需求. 至于 (còn về), 在于 (nằm ở), 关于 (về) không ghép được vào đây. Câu gốc hơi lủng củng nên chỗ này chỉ cần chọn cái đọc xuôi nhất.
③ 充实: 充实的人生 (cuộc đời đầy đặn, có ý nghĩa). 充分 dùng với lý do, điều kiện. 充满 phải có tân ngữ (充满希望). 充足 dùng với ánh sáng, tiền bạc.
Mẹo: chỗ ③ chỉ có 充实 đi được với 人生, đáp án B.`,
'd2-61': `① 严厉: 过于严厉 + 粗暴惩罚 = hà khắc, gay gắt. 严肃 là nghiêm trang, 严格 là chặt theo quy định, 严谨 là chặt chẽ kiểu học thuật, đều không có sắc thái "hà khắc".
② 愤怒: người mẹ hay nổi giận và thất vọng với con. 悲哀 là buồn thảm, 沮丧 là ủ rũ, 灰心 là nản lòng, ba từ này không hợp với kiểu thô bạo.
③ 缺乏: 缺乏对…的照顾和同情 (thiếu, động từ trừu tượng). 缺口 và 缺陷 là danh từ nên loại. 缺少 cũng là động từ nhưng đã bị loại ở chỗ ①.
④ 温和: cách giáo dục ôn hòa, đối lập với 严厉. 温暖 và 温情 là cảm giác, 温柔 thường tả người dịu dàng.
⑤ 维持: có lợi cho việc duy trì sự quan tâm tình cảm. 保持 nghe xuôi nhưng đã loại ở chỗ ①. 坚持 là kiên trì làm, 劫持 là bắt cóc, sai nghĩa.
Mẹo: loại 劫持 (chỗ ⑤), loại 缺口 và 缺陷 (chỗ ③, vì là danh từ). Còn lại A và B, rồi chốt ở chỗ ① (严厉 đi với 粗暴惩罚).`,
'd2-62': `① 防御: 防御性反应 là thuật ngữ tâm lý (phản ứng phòng vệ). 防守 là phòng thủ quân sự hoặc thể thao, 防护 là che chắn khỏi nguy hại, 防治 là phòng và chữa bệnh.
② 障碍: 心理障碍 (rối loạn tâm lý). 阻碍 và 妨碍 là động từ (cản trở), 碍事 là khẩu ngữ (vướng víu).
③ 表明: 研究结果表明 = kết quả nghiên cứu cho thấy, cụm cố định. 表示 là bày tỏ thái độ, 表现 là thể hiện, 表达 là diễn đạt ý.
④ 衰弱: 神经衰弱 là thuật ngữ y học (suy nhược thần kinh). 衰败 dùng cho gia đình, triều đại. 衰老 là già đi. 衰退 là suy giảm năng lực, kinh tế.
Mẹo: cả bốn chỗ đều là cụm cố định, chỉ cần nhớ 防御性, 心理障碍, 研究表明, 神经衰弱.`,
'd2-63': `① 违反: 违反规律 (trái quy luật). 违背 dùng với ý nguyện, nguyên tắc (违背初衷). 违犯 là phạm luật, nặng hơn. 违抗 là kháng lệnh.
② 原理: 基本原理 (nguyên lý). 道理 là lẽ phải, 定理 là định lý toán học, 条理 là mạch lạc.
③ 通过: 通过一段时期 (qua một giai đoạn). 经过 gần nghĩa, nên cột này chưa chốt được. 走过 và 越过 là nghĩa đen về di chuyển.
④ 沉重: 付出沉重的代价. 郑重 và 庄重 tả thái độ trang trọng, không đi với 代价. 严重 (nghiêm trọng) kém tự nhiên hơn 沉重 trong cụm này.
⑤ 深切: 深切的体会 (thấm thía). 深刻 cũng đi với 体会, nhưng chỗ ① đã chốt được A. 深浅 là danh từ, 深远 là ảnh hưởng sâu xa.
Mẹo: chốt chỗ ① 违反 là xong, đáp án A.`,
'd2-64': `① 崇拜: 最受崇拜 = được thờ phụng nhất, đối tượng là thần linh. 崇高 là tính từ (cao cả) nên loại. 崇尚 là chuộng một phẩm chất hay phong cách. 崇敬 là kính trọng, chưa đến mức thờ.
② 栽培: 最早栽培的农作物 (trồng trọt có chăm sóc). 种植 gần nghĩa, nên chỗ này chỉ là ưu tiên. 养育 là nuôi người, 培育 là ươm giống, bồi dưỡng.
③ 产生: 稷神的产生 = sự ra đời của thần Tắc. 形成 là hình thành dần dần, 萌芽 là nảy mầm, 引进 là nhập từ ngoài.
④ 综合: 诸神综合为一神 (nhiều thần gộp thành một). 统一 là thống nhất, 集中 là tập trung, 组织 là tổ chức.
Mẹo: loại 崇高 (tính từ) ngay ở chỗ ①, còn 崇拜 / 崇尚 / 崇敬 thì chốt bằng chữ 神.`,
'd2-65': `① 行为: 犯罪行为 (hành vi phạm tội), cách nói chuẩn trong văn bản pháp luật. 行径 là việc làm xấu bị lên án. 事实 và 活动 không đi với 犯罪 tự nhiên.
② 陈述: 陈述情节 = trình bày chính thức tình tiết. 表达 là diễn đạt ý hay cảm xúc, 叙说 là kể lại, 说明 là giải thích.
③ 辩解: 无罪的辩解 = nhận mình vô tội và tự biện giải. 辩论 là tranh luận hai bên, 辩护 là luật sư bào chữa, 辩白 là thanh minh.
④ 权利: 拒绝回答的权利 (quyền pháp luật cho phép). 权力 là quyền lực, 权益 là quyền và lợi ích, 权限 là phạm vi thẩm quyền.
Mẹo: chốt chỗ ④ 权利 (quyền được làm), đáp án C.`,
'd2-66': `① 相当: 有相当一部分 = một phần khá lớn, cụm cố định. 非常 và 格外 là phó từ, không nói "有非常一部分". 比较 cũng không tự nhiên bằng.
② 际: 在外敌入侵之际 (vào lúc). 之时 / 之刻 / 之后 không dùng như cụm 在…之际.
③ 高超: 医术高超 (tay nghề cao). 高明 cũng hay đi với 医术, 杰出 và 突出 tả người hoặc thành tích. Cột này không chốt được, chỉ dùng khi các chỗ khác đã khớp.
④ 尊: 尊他为"药王" (tôn ông là). 封 là phong tước, 评 là bình chọn, 敬 là kính, không có khuôn "A 为 B" tự nhiên.
Mẹo: chốt chỗ ② 际 và chỗ ④ 尊, đáp án D.`,
'd2-67': `① 家喻户晓: 传说, nhà nhà đều biết. 德才兼备 là tài đức đủ cả, 众所周知 là ai cũng biết (đứng đầu câu), 古为今用 là dùng cái xưa phục vụ nay.
② 看来: 从那故事看来 (xem ra). 从…来看 cũng nói được, nên cột này chưa chốt được.
③ 平凡: 文情简单平凡 (cốt truyện đơn giản, bình dị). 一般, 经常, 日常 không đi với 简单 như một cặp tính từ.
④ 朴素: tả người, mộc mạc, giản dị. 素质 là danh từ, 质朴 và 朴实 gần nghĩa nhưng đề chọn 朴素.
Mẹo: chốt chỗ ① (家喻户晓 hợp với 传说) và chỗ ③ (平凡), đáp án C.`,
'd2-68': `① 抱怨: than phiền, kêu ca (động từ). 怨恨 là oán hận, nặng hơn nhiều. 埋怨 là trách móc ai đó. 牢骚 là danh từ (发牢骚), không đứng ở vị trí động từ.
② 每每: mỗi lần, thường hay (văn viết). 各各 và 各次 không dùng. 每次 nghe được nhưng đã loại ở chỗ ①.
③ 喘息: 疲劳期的喘息 = khoảng thở lấy hơi giữa lúc mệt. 休息 là nghỉ chung chung, 安息 là yên nghỉ (người mất), 叹息 là thở dài.
④ 时代: 黄金时代 là cụm cố định (thời hoàng kim). 时刻 / 时候 / 时机 không đi với 黄金 theo nghĩa này.
Mẹo: chốt chỗ ① 抱怨 và chỗ ③ 喘息, đáp án B.`,
'd2-69': `① 流传: 传说流传着 (lưu truyền qua nhiều đời). 流行 và 时兴 là thịnh hành theo trào lưu. 播出 là phát sóng.
② 启示: 受花语的启示 (được gợi mở, soi sáng). 启事 là thông báo (cùng cách đọc qǐshì, khác chữ). 反映 là phản ánh, 反应 là phản ứng.
③ 象征: 象征和平 (tượng trưng cho hòa bình). 比喻 là phép ví von, 引申 là mở rộng nghĩa. 表示 cũng nghe được, nhưng câu trước đã dùng 表示 nên chỗ này đổi sang 象征.
Mẹo: chốt chỗ ② 启示 (không phải 启事), đáp án C.`,
'd2-70': `① 居高临下: thái độ bề trên, đi với 傲气轻狂. 雪上加霜 là họa vô đơn chí, 无动于衷 là thờ ơ, 轻而易举 là dễ như trở bàn tay.
② 忽视: 强调自己而忽视他人 (bỏ qua người khác). 歧视, 无视, 轻视 đều gần nghĩa, nên cột này chưa chốt được.
③ 手舞足蹈: 高兴时…手舞足蹈 (vui đến múa may). 风风火火 là hấp tấp, 呼风唤雨 là quyền thế lớn, 大手大脚 là tiêu tiền hoang phí.
④ 亲密: 亲密程度 (mức độ thân thiết). 亲热 chỉ hành vi nồng nhiệt. 亲切 chỉ thái độ dễ gần. 亲爱 dùng để xưng hô.
Mẹo: chốt chỗ ① và chỗ ③ vì cả hai đều là thành ngữ có nghĩa rất riêng, đáp án D.`,
'hx1-61': `① 序幕: 仅是序幕 = mới chỉ là màn mở đầu của đợt điều chỉnh lớn hơn. 开端 và 局部 cũng đọc được, nên cột này chưa chốt được. 首次 không đi với 仅是.
② 扭转: 趋势难以扭转 (khó xoay chuyển xu thế). 转换 là chuyển đổi dạng, 扭曲 là bóp méo, 更换 là thay cái khác.
③ 基于: 基于…回报率 (dựa trên tỷ suất lợi nhuận). 由于 chỉ nguyên nhân, 至于 là "còn về", 在于 là "nằm ở", đều không đúng cấu trúc.
④ 焦点: 将焦点放回京沪 (đặt trọng tâm trở lại). 重点 cũng được. 终点 và 起点 không hợp.
Mẹo: chốt chỗ ② 扭转 và chỗ ③ 基于, đáp án B.`,
'hx1-62': `① 羡慕: 值得羡慕 (đáng ngưỡng mộ). Sau 值得 cần động từ nhận tân ngữ. 悲哀 và 惭愧 là trạng thái cảm xúc, không dùng kiểu này. 可怜 trùng với 怜悯 ở vế sau.
② 未尝: 未尝不值得怜悯 = chưa hẳn là không đáng thương, phủ định kép. 省得 và 免得 là "để khỏi", 不免 là "khó tránh".
③ 承认: 他这样做就已经承认了… (thừa nhận mình không đủ sức). 提醒 là nhắc nhở, 答应 là nhận lời, 欺骗 là lừa dối.
Mẹo: chốt chỗ ② 未尝, đáp án D.`,
'hx1-63': `① 改造: 认识自然、改造自然 (nhận thức và cải tạo tự nhiên), cặp cố định. 改善 dùng với điều kiện, 改变 với suy nghĩ, 改正 với lỗi.
② 神秘: 神秘面纱 (bức màn bí ẩn). 神气 tả vẻ đắc ý của người. 神奇 là kỳ diệu. 神化 là động từ.
③ 确立: 地位得到确立 (vị thế được xác lập vững chắc). 确认 cũng đi với 得到, 确定 là xác định hay quyết định. 确实 là phó từ nên loại.
④ 主导: 占主导地位 (chiếm vị trí chủ đạo), cụm cố định. 优势, 重要, 首要 không đi với 占…地位 tự nhiên bằng.
Mẹo: chốt chỗ ① 改造 và chỗ ④ 占主导地位, đáp án B.`,
'hx1-64': `① 主流: 主流艺术 (nghệ thuật chính thống). Graffiti từ phi chính thống được "thu biên" thành công cụ quảng bá cho nghệ thuật chính thống. 上层 là thượng lưu, 一流 là hạng nhất, 上乘 là chất lượng tốt.
② 反应: 反应速度 (tốc độ phản ứng). 动作 và 行动 là hành động cụ thể. 反映 là phản ánh nên không hợp "速度".
③ 奢侈: 奢侈大牌 (hàng hiệu xa xỉ). 超级, 时髦, 流行 cũng đọc xuôi, nên chỗ này chưa chốt được.
④ 颇: 颇受青睐 (khá được ưa chuộng, văn viết). 特, 挺, 满 đều nói được, nên chỗ này không chốt.
Mẹo: chỉ chốt chắc ở chỗ ① và ②, đáp án B.`,
'hx1-65': `① 口口声声: nói liên hồi, hùng hồn (nhưng thường làm không ra gì), khớp với vế sau là món bò bít tết cháy. 兴致勃勃 cũng đọc được, nên chỗ này chưa chốt được.
② 征服: 征服我的胃口 (chinh phục khẩu vị). 服务 không mang tân ngữ này. 满足胃口 cũng nói được, nên chỗ này chỉ hỗ trợ.
③ 打动: 打动了我的心 (làm lay động trái tim), cụm quen nhất. 触动 là chạm đến, gợi suy nghĩ. 感动 thường dùng 被…感动. 震动 là rung chuyển.
Mẹo: chốt chỗ ③ 打动…心 trước, rồi đối chiếu 没能征服…却打动…, đáp án D.`,
'hx1-66': `① 行为: 危险行为 (hành vi nguy hiểm). 行径 mang sắc thái xấu bị lên án. 行动 là hành động cụ thể. 行程 là lịch trình.
② 实践: 教训和实践 (bài học và thực tiễn). 经验 nghe xuôi hơn nhưng đã bị loại ở chỗ ①, nên chỗ này chỉ cần nhớ đáp án chính thức là 实践.
③ 形成: 形成了…体系 (hình thành hệ thống). 产生 là nảy sinh. 导致 và 致使 chỉ dẫn đến hậu quả (thường xấu), không nối với 体系.
④ 环节: 多环节 (nhiều khâu). 步骤 là bước, 程序 là quy trình, 阶层 là tầng lớp xã hội.
Mẹo: chốt chỗ ① và chỗ ③ là đủ, đáp án A.`,
'hx1-67': `① 组成: 重要组成部分 là cụm cố định (bộ phận cấu thành quan trọng). 构成 thường là động từ (构成威胁). 合成 là tổng hợp ra chất mới. 达成 là đạt được thỏa thuận.
② 作为: 以自然界的动植物作为药物 (lấy động thực vật làm thuốc). 当成 cũng được. 叫做 là "được gọi là". 成为 là "trở thành", không đi với 以…成为.
③ 不可磨灭: 不可磨灭的贡献 (cống hiến không thể xoá nhoà). 不择手段 là bất chấp thủ đoạn (xấu). 不相上下 là ngang nhau. 不可思议 là khó tin.
Mẹo: chốt chỗ ③ trước, đáp án B.`,
'hx1-68': `① 允许: 朝廷允许 (triều đình cho phép). 批准 dùng khi cấp trên duyệt một đề nghị. 同意 là đồng ý. 赞同 là tán thành quan điểm.
② 自愿: 自愿报名 (tự nguyện đăng ký). 志愿 là nguyện vọng, tình nguyện. 自动 là tự động. 主动 là chủ động, cũng nghe được.
③ 经过: 经过分科考试 (trải qua thi theo môn). 通过 cũng được. 利用 và 采用 sai nghĩa.
Mẹo: loại 利用, 采用 ở chỗ ③ và 赞同 ở chỗ ①, còn lại chọn B.`,
'hx1-69': `① 本质: 本质上 (về bản chất). 本来, 本领, 本人 không đi với 上 theo nghĩa này.
② 否则: nếu không thì. 不然 cũng được. 要不 là khẩu ngữ. 除非 cần cấu trúc 除非…才….
③ 憧憬: 依然憧憬着… (vẫn mơ ước). 渴望 và 期盼 cũng được. 奢求 là đòi hỏi quá đáng, sắc thái khác.
④ 骨子: 骨子里, đối lập với 外表 (bề ngoài). 肚子, 心眼, 头脑 không tạo thành cặp đối lập này.
Mẹo: chốt chỗ ① 本质 và chỗ ④ 骨子, đáp án A.`,
'hx1-70': `① 重复: 不断地重复这些动作 (lặp lại cùng động tác). 反复 nhấn mạnh quá trình lặp nhiều lần, cũng nghe được. 进行 và 开展 là động từ chung, cần tân ngữ danh từ hóa.
② 丰富多彩: 丰富多彩的游戏 (trò chơi đa dạng). 力所能及 là trong khả năng, 喜闻乐见 là được yêu thích, 日新月异 là đổi thay nhanh.
③ 证据: 直接的证据 (bằng chứng trực tiếp). 凭据 là chứng từ, căn cứ pháp lý. 语言 và 材料 không hợp.
Mẹo: chốt chỗ ② và ③, đáp án C.`,
'hx2-66': `① 更加: 更加重要的是 (còn quan trọng hơn là), phó từ. 特殊 là tính từ nên loại. 尤其 và 特别 cũng nói được, nên chỗ này chỉ loại được D.
② 设想: 实现了…的设想 (hiện thực hóa ý tưởng). 设计 là thiết kế. 设施 là cơ sở vật chất. 设置 là thiết lập, cài đặt.
③ 虚拟: 虚拟实地旅行, đi tham quan "ảo" qua mạng. 虚构 là bịa. 虚荣 là hư vinh. 虚设 là bày ra cho có.
④ 参观: 参观博物馆. 拜访 chỉ dùng với người. 访问 cũng nói được. 参与 dùng với hoạt động.
Mẹo: chốt chỗ ② và ③, đáp án C.`,
'hx2-67': `① 偏偏: 你求它,它偏偏不来 (đúng là trái với mong muốn). 明明 dùng khi sự thật khác với điều người ta nói. 渐渐 và 时时 không có ý trái ý.
② 在乎: 满不在乎 (chẳng bận tâm), cụm cố định. 满不喜欢, 满不愿意, 满不介意 không có cách nói này.
③ 采取: 采取策略 (áp dụng chiến lược). 采用 cũng được. 采纳 dùng với ý kiến. 采集 dùng với mẫu vật.
Mẹo: chốt chỗ ② 满不在乎, đáp án D.`,
'hx2-68': `① 精湛: 手艺精湛 (tay nghề tinh xảo). 精致, 精细, 精巧 thường tả sản phẩm, đồ vật.
② 有心无力: ông bà có lòng đăng ký thương hiệu, mở tiệm nhưng không đủ sức vì thiếu tiền. 有备无患, 有求必应, 有利可图 sai ngữ cảnh.
③ 毕竟: 毕竟那需要…费用 (dù sao thì cần nhiều tiền), nhấn mạnh lý do. 到底 và 究竟 thường dùng trong câu hỏi. 终究 là cuối cùng thì.
④ 微乎其微: rất ít ỏi. 微不足道 gần nghĩa. 若即若离 và 若隐若现 sai nghĩa.
Mẹo: chốt chỗ ② 有心无力, đáp án B.`,
'hx2-69': `① 无数: 无数村庄 (vô số làng, đếm không xuể). 无限, 无穷, 无边 hay dùng với khái niệm trừu tượng hoặc không gian vô tận.
② 姿态: 百般姿态 (muôn hình muôn vẻ). 形态 là hình thái. 姿势 là tư thế cơ thể. 形势 là tình hình.
③ 颜色: 同样颜色的树木 (cùng màu). 色泽 là độ bóng màu, 色彩 là sắc thái, 彩色 là có màu (đối lập đen trắng).
④ 形状: 同样形状的房屋 (cùng hình dạng). 模样 và 外形 cũng được. 外貌 thường dùng cho người.
Mẹo: chốt chỗ ① 无数 và chỗ ② 姿态, đáp án A.`,
'hx2-70': `① 稀少: 之所以稀少 (số lượng ít). 减少 là giảm đi, 缺少 là thiếu, 短少 là thiếu hụt (khẩu ngữ).
② 保留: 保留老茶种和老工艺 (giữ lại). 保存 là giữ cho khỏi hỏng, 保管 là trông giữ đồ, 保护 là bảo vệ.
③ 渠道: 通过各种渠道 (qua nhiều kênh), cụm cố định. 管道 là đường ống, 门道 là bí quyết, 交道 chỉ có trong 打交道.
④ 寻觅: 难以寻觅到 (khó tìm được). 发现 và 发觉 là "nhận ra", không đi với 难以…到.
Mẹo: chốt chỗ ③ 渠道, đáp án B.`,
'hx4-61': `① 随着: 随着时间的推移 (cùng với thời gian trôi). 顺着 và 沿着 là dọc theo (không gian). 凭着 là dựa vào.
② 此外: 此外,你必须… (ngoài ra, bạn còn phải…). 何况 là huống chi. 接着 là tiếp theo. 甚至 là thậm chí.
③ 享受: 享受香蕉的美味 (thưởng thức vị ngon). 丰收 không mang tân ngữ. 培育 là ươm giống. 欣赏 hợp với cái đẹp hơn là hương vị.
Mẹo: chốt chỗ ① 随着, đáp án D.`,
'hx4-62': `① 倘若: nếu như (văn viết). 如果 cũng được. 万一 là nhỡ ra (khả năng nhỏ). 一旦 là một khi đã xảy ra.
② 仅是: 仅是一味地抒发不满 (nếu chỉ là cứ một mực trút bất mãn). 只有 cần 才, 只要 cần 就, nên không khớp.
③ 未见得: 他们未见得喜欢看 (chưa chắc thích đọc). 不一定 cũng hợp nghĩa. 不得不 là đành phải. 禁不住 là không kìm được.
④ 还是: 我们还是希望… (vẫn mong). 依然 và 仍旧 cũng được. 或者 sai.
⑤ 细腻: 写得真实、细腻、客观 (tả tinh tế). 细微 là rất nhỏ. 细节 là danh từ. 细致 thiên về cách làm việc tỉ mỉ.
Mẹo: loại 不得不 và 禁不住 ở chỗ ③, loại 只有 ở chỗ ②, còn lại D.`,
'hx4-63': `① 舆论: 舆论导向 (định hướng dư luận), cụm quen dùng. 评论, 理论, 谈论 không đi với 导向 tự nhiên.
② 设身处地: 设身处地地考虑问题 (đặt mình vào vị trí người khác). 就地取材 là lấy tại chỗ, 因地制宜 là tùy nơi mà làm, 先入为主 là định kiến.
③ 美中不足: 还是会感到美中不足 (vẫn thấy còn thiếu sót). 蛮不讲理 là ngang ngược, 漠不关心 là thờ ơ, 怀才不遇 là có tài không gặp thời.
④ 何况: nối thêm ý. 而且 và 况且 cũng nối được, nên chốt bằng các chỗ khác. 何必 (cần gì) sai nghĩa.
Mẹo: chốt chỗ ② và chỗ ③, đáp án B.`,
'hx4-64': `① 方面: 在才智方面 (về mặt tài trí). 情况 đi với 在…情况下, 角度 đi với 从…角度, 层次 đi với 在…层次上.
② 出色: 出色的口才 (tài ăn nói xuất sắc). 敏锐 tả giác quan, óc quan sát. 快捷 tả tốc độ. 杰出 hay tả người hoặc thành tựu.
③ 前提: 以…为前提 (làm điều kiện tiên quyết). 基础 và 根基 cũng gần nghĩa, 根本 là gốc rễ. Chỗ này chỉ cần khớp với ① và ②.
Mẹo: chốt chỗ ① 在…方面, đáp án D.`,
'hx4-65': `① 大行其道: thịnh hành. 大红大紫 cũng gần nghĩa, nên chỗ này chưa chốt được. 大有可为 là có triển vọng. 大包大揽 là ôm đồm.
② 内涵: 深度和内涵 (chiều sâu và nội hàm). 内容 cũng gần nghĩa. 内幕 là hậu trường. 内因 là nguyên nhân bên trong.
③ 相提并论: 无法与…相提并论 (không thể đặt ngang hàng). 相安无事 là yên ổn với nhau. 相辅相成 là bổ trợ lẫn nhau. 相得益彰 là làm nổi bật nhau.
Mẹo: chốt chỗ ③ 无法与…相提并论, đáp án D.`,
'hx4-66': `① 面对: 面对千余名学生发表演讲 (đối diện với). 面向 là hướng tới đối tượng, 朝着 là hướng đi, 对着 là khẩu ngữ, không hợp bằng.
② 蓬勃: 朝气蓬勃 (đầy sức sống), cụm cố định. 洋溢 và 四溢 là tràn ra. 充满 phải có tân ngữ.

function norm(g, q) {

  app.innerHTML = `<section class="panel"><h2>${mock ? 'Thi thử' : 'Tự kiểm tra'}</h2><p>${mock ? `Làm liền các câu, mỗi câu <b>${LIM} giây</b>, chọn xong là sang câu tiếp. Điểm và đáp án chỉ hiện ở cuối bài.` : `Mỗi câu có <b>${LIM} giây</b> và hiện đáp án ngay sau khi chọn.`} Câu sai hoặc hết giờ tự đánh dấu "Còn yếu". Phím A đến D (hoặc 1 đến 4) để chọn.</p>${sel}${body}</section>`;
}

function startQuiz(kind) {
  const n = $('#qn').value;
  let items = shuffle(pool());
  const pr = ($('#qpri') || {}).value;
  if (pr === 'new') items.sort((a, b) => cnt(a) - cnt(b));
  else if (pr === 'wrong') items.sort((a, b) => wrn(b) - wrn(a) || cnt(a) - cnt(b));
  if (n !== 'all') items = items.slice(0, +n);
  Q = { kind, i: 0, score: 0, wrong: new Map(), answers: [], done: false, t0: 0, items };
  renderQ();
}

function startTimer(onEnd) {
  clearInterval(tmr);
  const t0 = Date.now();
  tmr = setInterval(() => {
    const left = LIM - (Date.now() - t0) / 1000;
    const bar = $('#bar'), tl = $('#tl');
    if (!bar) { clearInterval(tmr); return; }
    bar.style.width = Math.max(0, left / LIM * 100) + '%';
    bar.classList.toggle('low', left < 10);
    tl.textContent = Math.max(0, Math.ceil(left)) + 's';
    if (left <= 0) { clearInterval(tmr); onEnd(); }
  }, 100);
}

/* so sánh từ bạn chọn với đáp án */
function wordInfo(g, w) {
  const x = ((g && g.words) || []).find(v => v.w === w);
  if (x) return x;
  return allVocab().find(v => v.w === w) || null;
}
function tipAbout(g, w) {
  if (!g || !g.tip) return '';
  return g.tip.split(/\.\s+|;\s+/).filter(p => p.includes(w)).map(p => p.replace(/\.$/, '') + '.').join(' ');
}
function infoLine(x) {
  if (!x) return '';
  return [x.py, x.vi].filter(Boolean).map(esc).join(' · ') + (x.use ? ` <span class="small">· hay gặp: ${esc(x.use)}</span>` : '');
}
function wrongHtml(it, choice) {
  if (choice == null || choice === it.a) return '';
  if (isMulti(it)) {
    const c = String(choice).trim().split(/\s+/), a = String(it.a).trim().split(/\s+/);
    const rows = a.map((w, i) => {
      if (c[i] === w) return '';
      const ci = wordInfo(it.g, c[i]), ai = wordInfo(it.g, w);
      const cell = (x, v) => `<td><b class="han">${esc(v || '')}</b>${x ? `<br><span class="small">${infoLine(x)}</span>` : ''}</td>`;
      return `<tr><td>${CN[i] || i + 1}</td>${cell(ci, c[i])}${cell(ai, w)}</tr>`;
    }).join('');
    if (!rows) return '';
    return `<div class="cmp"><p class="small">Chỗ bạn chọn khác đáp án</p><div class="scroll"><table><thead><tr><th>Chỗ</th><th>Bạn chọn</th><th>Đáp án</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  const ci = wordInfo(it.g, choice), ai = wordInfo(it.g, it.a);
  const hit = tipAbout(it.g, choice);
  if (!ci && !hit) return '';
  return `<div class="voc"><p class="small">Vì sao không chọn ${esc(choice)}?</p><p>Bạn chọn <b class="han">${esc(choice)}</b>: ${infoLine(ci) || 'chưa có ghi chú cho từ này'}</p>${hit ? `<p>${esc(hit)}</p>` : ''}${ai ? `<p>Đáp án <b class="han">${esc(it.a)}</b>: ${infoLine(ai)}</p>` : ''}</div>`;
}

function renderQ() {
  clearInterval(tmr);
  const it = Q.items[Q.i], mock = Q.kind === 'mock';
  Q.done = false; Q.t0 = Date.now();
  const multi = isMulti(it), wide = multi || it.opts.some(o => o.length > 8);
  app.innerHTML = `<section class="panel"><div class="qtop"><span>${mock ? 'Thi thử · ' : ''}Câu ${Q.i + 1} / ${Q.items.length}</span><span id="tl">${LIM}s</span></div><div class="track"><div class="bar" id="bar"></div></div>${it.src ? `<p class="small">${esc(it.src)}</p>` : ''}<p class="q">${blanks(it.text)}</p><div class="opts${wide ? ' wide' : ''}">${it.opts.map((o, k) => `<button type="button" class="opt${multi ? ' multi' : ''}" data-o="${esc(o)}"><small>${L[k]}</small><span>${seq(o, multi)}</span></button>`).join('')}</div>${mock ? '<button type="button" class="go ghost" id="skip">Bỏ qua câu này</button>' : '<div id="fb"></div>'}</section>`;
  startTimer(() => mock ? mockAnswer(null) : answer(null));
}

/* tự kiểm tra: hiện đáp án ngay */
function answer(choice) {
  if (Q.done) return;
  Q.done = true;
  clearInterval(tmr);
  const it = Q.items[Q.i], ok = choice === it.a;
  if (!Q.re) Q.re = new Set();
  if (ok && !Q.re.has(Q.i)) Q.score++;
  if (!ok) Q.wrong.set(it.g.id, it.g);
  markResult(it, ok, choice);
  renderStats();
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.o === it.a) b.classList.add('ok');
    else if (b.dataset.o === choice) b.classList.add('no');
  });
  const last = Q.i === Q.items.length - 1;
  const mu = isMulti(it);
  const verdict = ok ? '<strong class="ok">Đúng</strong>' : `<strong class="no">${choice === null ? 'Hết giờ' : 'Sai'}</strong></p><p class="pick"><span>Bạn chọn</span>${choice === null ? '(trống)' : seq(choice, mu)}</p><p class="pick"><span>Đáp án</span>${seq(it.a, mu)}`;
  const grp = it.u ? '' : `<p class="small">Nhóm: ${nameOf(it.g)}. ${esc(it.g.tip)}</p>`;
  $('#fb').innerHTML = `<div class="fb"><p>${verdict}</p>${it.why ? `<p>${esc(it.why)}</p>` : ''}${wrongHtml(it, choice)}${grp}${vocabHtml(it.vocab)}${extraHtml(it)}</div><button type="button" class="go" id="next" style="margin-top:14px">${last ? 'Xem kết quả' : 'Câu tiếp'}</button>`;
  { const s0 = qs[it.k]; const fbx = document.querySelector('#fb .fb'); if (s0 && fbx) fbx.insertAdjacentHTML('afterbegin', `<p class="small">Câu này: đúng ${s0.r} lần · sai ${s0.w} lần</p><p class="hist">${histHtml(s0)}</p>`); }
  $('#next').insertAdjacentHTML('afterend', '<button type="button" class="go ghost" id="redo" style="margin-top:12px;margin-left:8px">Làm lại câu này</button>');
  $('#next').focus();
}

function renderResult() {
  const n = Q.items.length;
  const wl = [...Q.wrong.values()];
  app.innerHTML = `<section class="panel"><h2>Kết quả</h2><p class="score">${Q.score}<span class="of"> / ${n}</span></p>${wl.length ? `<div><p>Các nhóm vừa đánh dấu "Còn yếu":</p><ul class="wl">${wl.map(g => `<li class="han">${nameOf(g)}</li>`).join('')}</ul></div>` : '<p>Không sai câu nào. Thử bộ lọc "Còn yếu" hoặc làm thêm câu.</p>'}<div class="field"><button type="button" class="go" id="again" data-kind="practice">Làm lại</button><button type="button" class="go ghost" id="tostudy">Về sổ từ</button></div></section>`;
}

/* thi thử: không hiện đáp án cho đến cuối */
function mockAnswer(choice) {
  if (Q.done) return;
  if (choice !== null && Date.now() - Q.t0 < 300) return;
  clearInterval(tmr);
  Q.answers[Q.i] = choice;
  if (Q.i === Q.items.length - 1) finishMock(); else { Q.i++; renderQ(); }
}

function finishMock() {
  clearInterval(tmr);
  Q.done = true;
  Q.items.forEach((it, i) => {
    const ok = Q.answers[i] === it.a;
    if (ok) Q.score++; else Q.wrong.set(it.g.id, it.g);
    markResult(it, ok, Q.answers[i]);
  });
  renderStats();
  const n = Q.items.length;
  const pct = Math.round(Q.score / n * 100);
  const rows = Q.items.map((it, i) => {
    const a = Q.answers[i], ok = a === it.a;
    const who = ok ? '<strong class="ok">Đúng</strong>' : `<strong class="no">${a == null ? 'Không trả lời' : 'Sai'}</strong>`;
    return `<li class="${ok ? 'ok' : 'no'}"><p class="q-s">${i + 1}. ${blanks(it.text)}</p><p>${who}</p><p class="pick"><span>Bạn chọn</span>${a == null ? '(trống)' : seq(a, isMulti(it))}</p><p class="pick"><span>Đáp án</span>${seq(it.a, isMulti(it))}</p>${it.why ? `<p class="small">${esc(it.why)}</p>` : ''}${wrongHtml(it, a)}${vocabHtml(it.vocab)}${extraHtml(it)}<button type="button" class="go ghost" data-rdm="${i}">Làm lại câu này</button></li>`;
  }).join('');
  MI = Q.items;
  const wl = [...Q.wrong.values()];
  app.innerHTML = `<section class="panel"><h2>Kết quả thi thử</h2><p class="score">${Q.score}<span class="of"> / ${n}</span></p><p class="small">Đúng ${pct}%. Nhóm có câu sai đã tự đánh dấu "Còn yếu"${wl.length ? ': ' + wl.map(g => nameOf(g)).join(', ') : ''}.</p><div class="field"><button type="button" class="go" id="again" data-kind="mock">Thi lại</button><button type="button" class="go ghost" id="tostudy">Về sổ từ</button></div><ol class="rev">${rows}</ol></section>`;
}

}

const DATA_PANEL = `<section class="panel"><h2>Xuất và nhập JSON</h2><p class="small">Gồm câu bạn thêm, số lần đúng/sai của từng câu và trạng thái "Còn yếu / Đã thuộc" của các nhóm và từ mới. Dữ liệu chỉ lưu trong trình duyệt này, nên hãy xuất ra cất ở nơi khác thường xuyên.</p><div class="field"><button type="button" class="go ghost" id="ex">Xuất JSON</button><span class="small">Hiện vào ô bên dưới và tự sao chép</span></div><textarea id="rs" rows="7" placeholder="JSON xuất ra hiện ở đây. Muốn nhập, dán JSON vào đây hoặc chọn file."></textarea><div class="field"><label for="rf">Hoặc chọn file .json</label><input id="rf" type="file" accept=".json,application/json"></div><div class="field"><label for="rm">Cách nhập</label><select id="rm"><option value="merge">Gộp thêm (giữ dữ liệu hiện có)</option><option value="replace">Thay thế toàn bộ</option></select><button type="button" class="go" id="im">Nhập JSON</button></div><p class="small" id="bmsg" role="status"></p></section>`;
function renderData(msg) {
  app.innerHTML = `<div class="stack">${DATA_PANEL}</div>`;
  if (msg) setMsg(msg);
}

function addQuestion() {
  const q = $('#nq').value.trim(), o = [...L].map(c => $('#o' + c).value.trim());
  const a = +$('#na').value, why = $('#nw').value.trim(), m = $('#amsg');
  const vocab = $('#nv').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0]).map(p => ({ w: p[0], py: p[1] || '', vi: p.slice(2).join(' | ') }));
  let sec = '';
  const cmp = [];
  $('#nc').value.split('\n').forEach(l => {
    l = l.trim();
    if (!l) return;
    if (l.startsWith('##')) { sec = l.replace(/^#+\s*/, ''); return; }
    const p = l.split('|').map(x => x.trim());
    if (p[0]) cmp.push({ w: p[0], py: p[1] || '', vi: p[2] || '', use: p[3] || '', ex: p.slice(4).join(' | '), sec });
  });
  const struct = $('#ns').value.split('\n').map(x => x.trim()).filter(Boolean);
  const note = $('#nt').value.trim();
  if (!/_{2,}/.test(q)) { m.textContent = 'Đề bài cần ít nhất một chỗ trống ghi ____.'; return; }
  if (o.some(x => !x)) { m.textContent = 'Cần điền đủ bốn đáp án A đến D.'; return; }
  if (new Set(o).size < 4) { m.textContent = 'Có hai đáp án giống nhau, hãy kiểm tra lại.'; return; }
  US.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), q, o, a, why, vocab, cmp, struct, note, weak: true });
  saveU(); renderStats();
  renderAdd('Đã thêm. Kho có ' + US.length + ' câu.');
}

function sanU(u) {
  if (!validU(u)) return null;
  return { id: typeof u.id === 'string' && u.id ? u.id : Date.now().toString(36) + Math.random().toString(36).slice(2, 6), q: u.q, o: u.o.slice(), a: u.a, why: typeof u.why === 'string' ? u.why : '', vocab: cleanVocab(u.vocab), cmp: cleanCmp(u.cmp), struct: cleanStruct(u.struct), note: typeof u.note === 'string' ? u.note : '', weak: !!u.weak };
}
const uKey = u => u.q + '\u0001' + u.o.join('\u0001');
function setMsg(t) { const m = $('#bmsg'); if (m) m.textContent = t; }

function exportJson() {
  const data = JSON.stringify({ app: 'so-tu-de-nham', v: 4, at: new Date().toISOString(), st, us: US, sv, qs }, null, 2);
  const ta = $('#rs');
  ta.value = data;
  const fallback = () => { ta.focus(); ta.select(); setMsg('Đã xuất ' + US.length + ' câu. Không tự sao chép được, hãy bôi đen ô trên và chép thủ công.'); };
  try { navigator.clipboard.writeText(data).then(() => setMsg('Đã xuất ' + US.length + ' câu và sao chép vào bộ nhớ tạm.'), fallback); } catch (e) { fallback(); }
}

function importJson() {
  const im = $('#im'), replace = $('#rm').value === 'replace';
  let d;
  try { d = JSON.parse($('#rs').value); } catch (e) { setMsg('Không đọc được JSON. Hãy dán đúng toàn bộ đoạn đã xuất.'); return; }
  if (!d || typeof d !== 'object' || !Array.isArray(d.us) || !d.st || typeof d.st !== 'object' || (d.v !== 1 && d.v !== 2 && d.v !== 3 && d.v !== 4)) { setMsg('File này không phải bản sao lưu của trang.'); return; }
  const inU = d.us.map(sanU).filter(Boolean);
  const skippedBad = d.us.length - inU.length;
  const inV = {};
  if (d.sv && typeof d.sv === 'object' && !Array.isArray(d.sv)) Object.keys(d.sv).forEach(k => { if (k.length <= 30 && (d.sv[k] === 'weak' || d.sv[k] === 'known')) inV[k] = d.sv[k]; });
  const inQ = {};
  if (d.qs && typeof d.qs === 'object' && !Array.isArray(d.qs)) Object.keys(d.qs).forEach(k => { const x = d.qs[k]; if (k.length <= 80 && x && Number.isFinite(x.r) && Number.isFinite(x.w) && x.r >= 0 && x.w >= 0) inQ[k] = { r: Math.floor(x.r), w: Math.floor(x.w), t: Number.isFinite(x.t) ? x.t : 0, l: x.l ? 1 : 0, h: cleanH(x.h) }; });
  const inS = {};
  G.forEach(g => { if (d.st[g.id] === 'weak' || d.st[g.id] === 'known') inS[g.id] = d.st[g.id]; });
  if (replace && !im.dataset.armed) {
    im.dataset.armed = '1'; im.textContent = 'Bấm lần nữa để thay thế';
    setMsg('Thay thế sẽ xoá ' + US.length + ' câu hiện có và dùng ' + inU.length + ' câu trong file. Bấm lần nữa để xác nhận.');
    return;
  }
  let added = 0, dup = 0;
  if (replace) { US = inU; st = inS; sv = inV; qs = inQ; added = inU.length; }
  else {
    const ids = new Set(US.map(u => u.id)), keys = new Set(US.map(uKey));
    inU.forEach(u => {
      if (ids.has(u.id) || keys.has(uKey(u))) { dup++; return; }
      US.push(u); ids.add(u.id); keys.add(uKey(u)); added++;
    });
    Object.keys(inQ).forEach(k => { const a = qs[k], b = inQ[k]; if (!a || b.r + b.w > a.r + a.w) qs[k] = b; });
    Object.keys(inV).forEach(k => { if (sv[k] !== 'weak') sv[k] = inV[k] === 'weak' ? 'weak' : (sv[k] || 'known'); });
    Object.keys(inS).forEach(id => { if (st[id] !== 'weak') st[id] = inS[id] === 'weak' ? 'weak' : (st[id] || 'known'); });
  }
  save(); saveU(); saveV(); saveQ(); renderStats();
  renderData((replace ? 'Đã thay thế: ' : 'Đã gộp: ') + added + ' câu mới' + (dup ? ', ' + dup + ' câu trùng bị bỏ qua' : '') + (skippedBad ? ', ' + skippedBad + ' mục sai định dạng bị bỏ qua' : '') + '.');
}

function readFile(f) {
  if (!f) return;
  if (f.size > 4000000) { setMsg('File quá lớn (trên 4 MB).'); return; }
  const r = new FileReader();
  r.onload = () => { $('#rs').value = String(r.result); setMsg('Đã đọc file ' + f.name + '. Chọn cách nhập rồi bấm "Nhập JSON".'); };
  r.onerror = () => setMsg('Không đọc được file này.');
  r.readAsText(f);
}

/* ---------- Tiến độ ---------- */
let MI = [];
let pk = 'short', pf = 'all', pmax = 40, PL = [];
function allItems() {
  const out = [];
  G.forEach(g => g.quiz.forEach(q => out.push(norm(g, q))));
  R.forEach(r => out.push(normR(r)));
  US.filter(validU).forEach(u => out.push(normUser(u)));
  return out;
}
const PLAB = { new: 'Chưa làm', ok: 'Đúng hết', few: 'Sai ít', many: 'Sai nhiều' };
const PCLS = { new: 'c-new', ok: 'c-ok', few: 'c-few', many: 'c-many' };
function snippet(t, n) { t = String(t).replace(/\s+/g, ' ').replace(/_{2,}/g, '＿＿'); return t.length > n ? t.slice(0, n) + '…' : t; }
function fmtT(ts) { if (!ts) return ''; const d = new Date(ts); return d.getDate() + '/' + (d.getMonth() + 1); }
function progItems() {
  const all = allItems().filter(it => (pk === 'pass') === isMulti(it));
  const c = { new: 0, ok: 0, few: 0, many: 0 };
  all.forEach(it => c[pstat(it)]++);
  return { all, c };
}
function renderProgress() {
  const { all, c } = progItems();
  const done = all.length - c.new;

  }).join('');

    <div class="seg" role="group" aria-label="Loại câu"><button type="button" data-pk="short" aria-pressed="${pk === 'short'}">Câu ngắn</button><button type="button" data-pk="pass" aria-pressed="${pk === 'pass'}">Đoạn đề thật</button></div>

    <div class="pg-sum">${sum}</div>

    <div class="pg-act">${nf ? `<button type="button" class="go" data-pgo="practice">Luyện ${Math.min(nf, 20)} câu này</button>${pk === 'pass' ? `<button type="button" class="go ghost" data-pgo="mock">Thi thử ${Math.min(nf, 20)} câu</button>` : ''}` : ''}</div>
    ${nf ? `<ul class="pg-list">${rows}</ul>${nf > shown.length ? `<button type="button" class="go ghost" data-pmore="1">Hiện thêm (còn ${nf - shown.length})</button>` : ''}` : '<p class="empty">Không có câu nào ở mục này.</p>'}
    <p class="small">Mỗi lần bạn trả lời ở Luyện hoặc Thi thử, kết quả được ghi vào từng câu. Hết giờ cũng tính là sai.</p></section></div>`;

function startSingle(it) {

const CL = { doc: null, doc2: null, ready: false, timer: null, busy: false, dirty: false };
function setSync(kind, extra) {
  const el = $('#sync'); if (!el) return;
  const m = {
    ok: ['ok', 'Đã lưu lên tài khoản của bạn' + (extra ? ' lúc ' + extra : '') + '. Mở lại bằng đường link này vẫn còn.'],
    saving: ['', 'Đang lưu…'],

    local: ['warn', 'Chỉ lưu trong trình duyệt này (chưa đăng nhập hoặc đang mở bản tải về). Hãy xuất JSON để sao lưu.'],
    err: ['warn', 'Chưa lưu được lên tài khoản. Tiến độ vẫn nằm trong trình duyệt này; thử lại sau hoặc xuất JSON.']
  }[kind] || ['', ''];
  el.className = 'sync ' + m[0]; el.textContent = m[1];
}
function touch() {
  if (!CL.ready) return;
  CL.dirty = true;
  clearTimeout(CL.timer);
  CL.timer = setTimeout(cloudPush, 1500);
}
async function cloudPush() {
  if (!CL.ready || CL.busy || !CL.dirty) return;
  CL.busy = true; CL.dirty = false; setSync('saving');
  try {
    const t = Date.now();
    await CL.doc.set({ qs: JSON.stringify(qs), st: JSON.stringify(st), sv: JSON.stringify(sv), t });
    const us = JSON.stringify(US);
    if (us.length < 240000) await CL.doc2.set({ us, t });
    const d = new Date(t);
    setSync('ok', String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
  } catch (e) {
    CL.dirty = true; setSync('err');
  }
  CL.busy = false;
  if (CL.dirty && !document.hidden) { clearTimeout(CL.timer); CL.timer = setTimeout(cloudPush, 8000); }
}
const parseJ = (t, d) => { try { const v = JSON.parse(t); return v && typeof v === 'object' ? v : d; } catch (e) { return d; } };
function mergeIn(p, u) {
  if (p) {
    const rq = parseJ(p.qs, {});
    Object.keys(rq).forEach(k => {
      const a = qs[k], b = rq[k];
      if (!b || typeof b.r !== 'number' || typeof b.w !== 'number') return;
      if (!a || (b.r + b.w > a.r + a.w) || (b.r + b.w === a.r + a.w && (b.t || 0) > (a.t || 0))) qs[k] = { r: b.r, w: b.w, t: b.t || 0, l: b.l ? 1 : 0, h: cleanH(b.h) };
    });
    const rs = parseJ(p.st, {});
    Object.keys(rs).forEach(k => { if (rs[k] === 'weak' || (rs[k] === 'known' && st[k] !== 'weak' && !st[k])) st[k] = rs[k]; });
    const rv = parseJ(p.sv, {});
    Object.keys(rv).forEach(k => { if (k.length <= 30 && (rv[k] === 'weak' || (rv[k] === 'known' && !sv[k]))) sv[k] = rv[k]; });
  }
  if (u) {
    const ru = parseJ(u.us, []);
    if (Array.isArray(ru)) {
      const ids = new Set(US.map(x => x.id)), keys = new Set(US.map(uKey));
      ru.map(sanU).filter(Boolean).forEach(x => { if (!ids.has(x.id) && !keys.has(uKey(x))) { US.push(x); ids.add(x.id); keys.add(uKey(x)); } });
    }
  }
  try { localStorage.setItem(QSKEY, JSON.stringify(qs)); localStorage.setItem(KEY, JSON.stringify(st)); localStorage.setItem(VKEY, JSON.stringify(sv)); localStorage.setItem(UKEY, JSON.stringify(US)); } catch (e) {}
}
async function cloudInit() {
  setSync('load');
  const guard = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  try {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
    const db = await guard(window.claude.use('db'), 10000);
    const user = await guard(window.claude.use('user'), 10000);
    if (!db || !user || typeof user.id !== 'function') { setSync('local'); return; }
    const id = await user.id();
    if (!id) { setSync('local'); return; }
    CL.doc = db.doc('data/users/' + id + '/progress');
    CL.doc2 = db.doc('data/users/' + id + '/userq');
    const [a, b] = await guard(Promise.all([CL.doc.get(), CL.doc2.get()]), 10000) || [null, null];
    if (!a || !b) { setSync('err'); return; }
    mergeIn(a.exists ? a.data() : null, b.exists ? b.data() : null);
    CL.ready = true;
    if (!Q && !VQ) { if (sq.trim()) renderSearch(); else render(); } else renderStats();
    CL.dirty = true; await cloudPush();
  } catch (e) { setSync('err'); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && CL.ready && CL.dirty) { clearTimeout(CL.timer); cloudPush(); } });

let sq = '', SL = [];

  const gs = G.filter(g => g.words.some(hitW) || hit(g.name) || (cjk && g.tip && g.tip.includes(raw)));

  }).join('');

    ${SL.length ? `<section class="panel"><h2>Bài tập liên quan</h2><ul class="pg-list">${rows}</ul>${SL.length > PL.length ? `<p class="small">Hiện ${PL.length} / ${SL.length} câu đầu. Bấm Luyện để làm ngẫu nhiên trong số đó.</p>` : ''}</section>` : `<section class="panel"><h2>Bài tập liên quan</h2><p>Chưa có câu luyện nào cho từ này.</p><div class="pg-act"><button type="button" class="go ghost" data-addw="1">Thêm câu có từ này</button></div></section>`}
    ${vs.length ? `<section class="panel"><h2>Từ mới trùng khớp</h2>${vs.map(v => `<p><b class="han">${esc(v.w)}</b> <span class="small">${esc(v.py)}</span> ${esc(v.vi)}</p>`).join('')}</section>` : ''}</div>`;

document.addEventListener('keydown', e => {
  if (!Q || Q.done) return;
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  let k = -1;
  if (/^[1-4]$/.test(e.key)) k = +e.key - 1;
  else if (/^[a-dA-D]$/.test(e.key)) k = e.key.toUpperCase().charCodeAt(0) - 65;
  if (k < 0) return;
  const b = document.querySelectorAll('.opt')[k];
  if (b) { e.preventDefault(); if (Q.kind === 'mock') mockAnswer(b.dataset.o); else answer(b.dataset.o); }
});
