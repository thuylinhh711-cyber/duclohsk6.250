<title>Sổ từ dễ nhầm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: một cột đọc hẹp, nhóm từ xếp dọc thành thẻ gấp mở; chế độ kiểm tra thay thế cột đó bằng một câu hỏi lớn có đồng hồ 40 giây. */
:root {
  --bg: #eef2f1;
  --surface: #fbfcfb;
  --ink: #14201d;
  --muted: #566661;
  --line: #d3dcd9;
  --accent: #1b6b57;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;
  --weak: #a24a08;
  --weak-soft: #fae9d8;
  --bad: #a42a2a;
  --bad-soft: #f7dcdc;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-han: "Noto Serif SC", "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  --font-han-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1715; --surface: #172320; --ink: #e6efec; --muted: #9bb0aa; --line: #2a3b37;
    --accent: #5ec2a4; --accent-ink: #08140f; --accent-soft: #17382e;
    --weak: #f0a15a; --weak-soft: #3a2a18; --bad: #f08a8a; --bad-soft: #3b1d1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1715; --surface: #172320; --ink: #e6efec; --muted: #9bb0aa; --line: #2a3b37;
  --accent: #5ec2a4; --accent-ink: #08140f; --accent-soft: #17382e;
  --weak: #f0a15a; --weak-soft: #3a2a18; --bad: #f08a8a; --bad-soft: #3b1d1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.han { font-family: var(--font-han); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.eyebrow { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 4px 0 8px; font-family: var(--font-han); font-weight: 700; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; text-wrap: balance; }
.lede { margin: 0; max-width: 62ch; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 14px 0 0; font-variant-numeric: tabular-nums; font-size: 14px; }
.stats b { font-weight: 600; }
.stats .k b { color: var(--accent); }
.stats .w b { color: var(--weak); }

.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* study */
.list { display: flex; flex-direction: column; gap: 10px; }
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.grp summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.grp summary::-webkit-details-marker { display: none; }
.grp summary::before { content: "▸"; color: var(--muted); font-size: 12px; transition: transform .15s; flex: none; }
.grp[open] summary::before { transform: rotate(90deg); }
.gname { min-width: 0; font-family: var(--font-han); font-weight: 700; font-size: 19px; line-height: 1.35; overflow-wrap: anywhere; }
.gname i { font-style: normal; color: var(--muted); font-weight: 500; margin: 0 .15em; }
.chip { flex: none; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.grp.weak .chip { background: var(--weak-soft); color: var(--weak); border-color: transparent; }
.grp.known .chip { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.gbody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.tip { margin: 0; padding: 10px 12px; background: var(--accent-soft); border-radius: 8px; font-size: 14px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 4px 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row > * { min-width: 0; }
.w { font-family: var(--font-han); font-weight: 700; font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.py { display: block; font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.vi { margin: 0; font-weight: 500; }
.use { margin: 2px 0 0; font-family: var(--font-han-sans); font-size: 14px; color: var(--muted); }
.mark { display: flex; flex-wrap: wrap; gap: 8px; }
.mk { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 14px; font-size: 14px; }
.mk[aria-pressed="true"].weak { background: var(--weak-soft); color: var(--weak); border-color: var(--weak); }
.mk[aria-pressed="true"].known { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; margin: 0; }

/* quiz */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(16px, 4vw, 28px); display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0; font-size: 20px; }
.panel p { margin: 0; }
.field { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.go { align-self: flex-start; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); padding: 10px 20px; font-weight: 600; }
.go.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.qtop { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar { height: 100%; width: 100%; background: var(--accent); }
.bar.low { background: var(--weak); }
.q { font-family: var(--font-han); font-size: clamp(20px, 4.4vw, 26px); line-height: 1.7; margin: 0; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--ink); text-align: center; color: var(--accent); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt { display: flex; align-items: baseline; gap: 10px; text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-family: var(--font-han); font-weight: 700; font-size: 20px; overflow-wrap: anywhere; }
.opt small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); flex: none; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.ok { background: var(--accent-soft); border-color: var(--accent); }
.opt.no { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.fb strong.ok { color: var(--accent); }
.fb strong.no { color: var(--bad); }
.fb .small { font-size: 13px; color: var(--muted); }
.score { font-family: var(--font-han); font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.wl { margin: 0; padding-left: 1.2em; }
.q { white-space: pre-line; }
.score .of { font-size: 22px; color: var(--muted); }
.opts.wide { grid-template-columns: minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.form > div, .optgrid > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.optgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
label { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type="text"], textarea { font: inherit; width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rev { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.rev li { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.rev li:first-child { border-top: 0; }
.rev .q-s { font-family: var(--font-han); font-size: 17px; line-height: 1.7; white-space: pre-line; }
.rev .small, .panel .small { font-size: 13px; color: var(--muted); }
.rev strong.ok, .panel strong.ok { color: var(--accent); }
.rev strong.no, .panel strong.no { color: var(--bad); }
.mk.del { color: var(--bad); }
.controls .seg { max-width: 100%; }
.controls .seg button { padding: 8px 12px; }
.voc { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); width: 100%; font-size: 14px; }
.voc p { margin: 0; }
.cmp { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.cmp p { margin: 0; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.cmp table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 14px; }
.cmp th, .cmp td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.cmp thead th { border-top: 0; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--bg); }
.cmp td.han { font-family: var(--font-han); font-weight: 700; font-size: 16px; white-space: nowrap; }
.cmp td.han2 { font-family: var(--font-han-sans); }
.cmp .ct { font-weight: 600; font-size: 14px; margin-top: 4px; }
.cmp td { font-size: 14px; }
.cmp tr.is-a td { background: var(--accent-soft); }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink); text-align: left; }
.pill span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill[aria-pressed="true"] span { color: inherit; opacity: .8; }
.gmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gsub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp[open] .gsub { display: none; }
.bar2 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.bar2 .small { font-size: 13px; color: var(--muted); }
.bar2b { display: flex; gap: 8px; }
.bar2b .mk { padding: 5px 12px; font-size: 13px; }
.grp summary { padding: 11px 14px; }
.gbody { padding: 0 14px 14px; gap: 10px; }
.row { padding: 8px 0; }
.w { font-size: 18px; }
input[type="file"] { font: inherit; font-size: 13px; max-width: 100%; color: var(--muted); }
.rq { font-family: var(--font-han); font-size: 17px; line-height: 1.8; margin: 0; }
.ropts { display: flex; flex-direction: column; gap: 4px; }
.ropt { margin: 0; padding: 6px 10px; border-radius: 6px; font-family: var(--font-han); font-size: 16px; overflow-wrap: anywhere; }
.ropt.ok { background: var(--accent-soft); font-weight: 700; }
/* từ mới */
.vrow { display: grid; grid-template-columns: minmax(96px, 150px) 1fr; gap: 4px 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.vrow > * { min-width: 0; margin: 0; }
.vrow.weak { border-left: 3px solid var(--weak); }
.vrow.known { border-left: 3px solid var(--accent); }
.vhd .han { display: block; font-family: var(--font-han); font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
.vrow .mark { grid-column: 1 / -1; }
.vm { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 13px; }
.vm[aria-pressed="true"].weak { background: var(--weak-soft); color: var(--weak); border-color: var(--weak); }
.vm[aria-pressed="true"].known { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.vgo { display: flex; flex-wrap: wrap; gap: 10px; }
.vprompt { margin: 0; font-size: clamp(24px, 6vw, 34px); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.opt.vopt { font-family: var(--font-body); font-weight: 500; font-size: 15px; }
.opt.vopt .han { font-family: var(--font-han); font-weight: 700; font-size: 20px; }
.blank[data-n]::before { content: attr(data-n); font-family: var(--font-body); font-size: .55em; color: var(--muted); vertical-align: super; margin-right: .2em; }
.seq { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; vertical-align: middle; }
.sw { display: inline-flex; align-items: baseline; gap: 5px; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-han); font-weight: 700; font-size: 17px; line-height: 1.5; }
.sw i { font-style: normal; font-family: var(--font-body); font-weight: 500; font-size: 11px; color: var(--muted); }
.opt.multi { align-items: center; }
.fb .pick { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.fb .pick > span:first-child, .rev .pick > span:first-child { font-size: 13px; color: var(--muted); min-width: 4.8em; }
.rev .pick { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.qt { display: flex; flex-direction: column; gap: 6px; }
.qt .small { font-size: 13px; color: var(--muted); }
.cmp td b.han { font-size: 16px; }
@media (max-width: 520px) {
  .vrow { grid-template-columns: minmax(0, 1fr); }
  .controls .seg button { padding: 8px 6px; font-size: 12.5px; white-space: nowrap; }
  .controls .seg:first-child { max-width: 100%; }
  .row { grid-template-columns: 1fr; }
  .opts, .optgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .grp summary::before { transition: none; } }
/* tiến độ + đồng bộ */
.seg.modes { display: flex; width: 100%; }
.seg.modes button { flex: 1 1 auto; padding: 8px 4px; font-size: 12.5px; white-space: nowrap; }
.sync { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.sync.ok { color: var(--accent); }
.sync.warn { color: var(--weak); }
.pg-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.pg-sum button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 6px; text-align: center; line-height: 1.25; }
.pg-sum button b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.pg-sum button span { font-size: 11.5px; color: var(--muted); }
.pg-sum button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pg-sum .c-new b { color: var(--muted); }
.pg-sum .c-ok b { color: var(--accent); }
.pg-sum .c-few b { color: var(--weak); }
.pg-sum .c-many b { color: var(--bad); }
.pg-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.pg-list li { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.pg-list li.s-new { border-left-color: var(--line); }
.pg-list li.s-ok { border-left-color: var(--accent); }
.pg-list li.s-few { border-left-color: var(--weak); }
.pg-list li.s-many { border-left-color: var(--bad); background: var(--bad-soft); }
.pg-list .q-s { font-family: var(--font-han); font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.pg-list .small { font-size: 12.5px; color: var(--muted); }
.pg-act { display: flex; flex-wrap: wrap; gap: 8px; }
.pg-act .go { align-self: auto; }
.att { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); margin: 2px 4px 2px 0; }
.att.ok { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.att.no { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.hist { margin: 4px 0 !important; }
.pg-list .rd { align-self: flex-start; margin-top: 4px; padding: 4px 12px; font-size: 13px; }
.gsearch input { width: 100%; font: inherit; font-size: 15px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.gsearch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.exs { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
.exs mark { background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 0 3px; border-radius: 3px; }
.exh { font-weight: 600; color: var(--ink) !important; }
.tag.real { font-size: 11px; background: var(--weak-soft); color: var(--weak); padding: 1px 7px; border-radius: 999px; }
.exr { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.exr summary { cursor: pointer; font-size: 14px; }
.exr .exq { margin: 8px 0; line-height: 1.8; }
.exl { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }

.exgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.excard h2 { margin-top: 0; }
.exbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.exbanner { margin: 0 0 12px; padding: 8px 12px; background: var(--accent-soft); border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
</style>

<div class="wrap">

      <button type="button" data-mode="quiz" aria-pressed="false">Luyện</button>

h thức (nước, đoàn) hoặc truy cập; 采访 = phỏng vấn lấy tin (nhà báo).", "table": true, "words": [{"w": "拜访", "py": "bàifǎng", "vi": "đến thăm (người, lễ phép)", "use": "拜访老师；登门拜访"}, {"w": "访问", "py": "fǎngwèn", "vi": "thăm chính thức; truy cập", "use": "访问中国；访问网站"}, {"w": "采访", "py": "cǎifǎng", "vi": "phỏng vấn, lấy tin", "use": "采访记者；接受采访"}], "quiz": [{"q": "春节期间，他带着礼物登门____了多年未见的老师，师生两人聊起往事，一直聊到了天黑。", "a": "拜访", "why": "Cá nhân đến thăm người đáng kính → 拜访; 采访 là việc của nhà báo."}, {"q": "总理将于下月应邀对三个东南亚国家进行正式____，并出席地区经济合作论坛的开幕式。", "a": "访问", "why": "Chuyến thăm chính thức cấp nhà nước → 访问; 拜访 dùng cho cá nhân."}, {"q": "为了写这篇关于留守儿童的报道，记者连续一周深入山村，____了二十多位村民和老师。", "a": "采访", "why": "Nhà báo lấy tin từ người được hỏi → 采访; 拜访 không có mục đích lấy tin."}]}, {"id": "bs-004", "tip": "颁布 = ban hành (luật, pháp lệnh, chính sách); 颁发 = cấp, trao tặng (giấy chứng nhận, huân chương, bằng khen).", "table": true, "words": [{"w": "颁布", "py": "bānbù", "vi": "ban hành (luật, chính sách)", "use": "颁布法律；颁布条例"}, {"w": "颁发", "py": "bānfā", "vi": "cấp, trao (giấy chứng nhận, giải thưởng)", "use": "颁发证书；颁发奖章"}], "quiz": [{"q": "国家新____的环境保护法对排污企业提出了更严格的要求，违规者将面临高额罚款甚至停产整顿。", "a": "颁布", "why": "Luật, quy định → 颁布; 颁发 dùng cho giấy tờ, giải thưởng."}, {"q": "在今天的毕业典礼上，校长亲自为优秀毕业生____荣誉证书，并和他们一一合影留念。", "a": "颁发", "why": "Trao giấy chứng nhận cho người → 颁发; 颁布 chỉ dùng cho văn bản pháp quy."}]}, {"id": "bs-005", "tip": "伴随 = đi kèm, song hành (làm vật hoặc sự việc cùng tồn tại); 随着 = cùng với, theo (giới từ mở đầu câu); 跟随 = đi theo (người, hướng dẫn).", "table": true, "words": [{"w": "伴随", "py": "bànsuí", "vi": "đồng hành, đi kèm", "use": "伴随成长；伴随着"}, {"w": "随着", "py": "suízhe", "vi": "cùng với, theo sự (giới từ)", "use": "随着发展；随着时间"}, {"w": "跟随", "py": "gēnsuí", "vi": "đi theo (người)", "use": "跟随老师；跟随队伍"}], "quiz": [{"q": "这位歌手的歌声____了几代人的成长，许多人一听到那段旋律，就会想起自己的童年和故乡。", "a": "伴随", "why": "Có 了, làm động từ 'đồng hành suốt' → 伴随; 随着 là giới từ không mang 了."}, {"q": "____气温一天天升高，湖边游泳的人也一天比一天多，救生员不得不增加了巡逻的次数。", "a": "随着", "why": "Giới từ mở đầu câu 'theo sự…' → 随着; 跟随 là đi theo người."}, {"q": "刚参加工作的那几年，他一直____着一位经验丰富的老师傅，从最基础的技术开始学起。", "a": "跟随", "why": "Đối tượng là người thầy mà mình đi theo học → 跟随; 伴随 không dùng như vậy."}]}, {"id": "bs-006", "tip": "保管 = trông giữ, cất giữ (đồ vật, hồ sơ); 保守 = giữ (bí mật) / bảo thủ; 保养 = bảo dưỡng (máy móc, da); 保卫 = bảo vệ chống xâm phạm (tổ quốc); 保障 = bảo đảm (quyền lợi, an toàn).", "table": true, "words": [{"w": "保管", "py": "bǎoguǎn", "vi": "trông giữ, bảo quản", "use": "保管财物；妥善保管"}, {"w": "保守", "py": "bǎoshǒu", "vi": "bảo thủ; giữ (bí mật)", "use": "思想保守；保守秘密"}, {"w": "保养", "py": "bǎoyǎng", "vi": "bảo dưỡng", "use": "保养汽车；皮肤保养"}, {"w": "保卫", "py": "bǎowèi", "vi": "bảo vệ (chống xâm phạm)", "use": "保卫祖国；保卫家园"}, {"w": "保障", "py": "bǎozhàng", "vi": "bảo đảm", "use": "保障权益；社会保障"}], "quiz": [{"q": "贵重物品请交给前台____，丢失后酒店概不负责，请各位旅客务必注意，不要随身携带大额现金。", "a": "保管", "why": "Gửi đồ cho người trông giữ → 保管; 保障 là bảo đảm quyền lợi chung."}, {"q": "他是个思想____的人，对任何新鲜事物都持怀疑态度，总觉得老办法才是最可靠的。", "a": "保守", "why": "Tính từ 'bảo thủ, không chịu đổi mới' → 保守; 保养 là bảo dưỡng máy móc."}, {"q": "汽车每行驶一万公里就应该做一次全面____，这样才能延长使用寿命，并确保行车安全。", "a": "保养", "why": "Bảo dưỡng định kỳ máy móc → 保养; 保管 chỉ trông giữ."}, {"q": "战士们日夜守在边境线上，用青春和热血____着祖国的每一寸土地，从不敢有丝毫松懈。", "a": "保卫", "why": "Chống ngoại xâm, bảo vệ lãnh thổ → 保卫; 保障 là đảm bảo điều kiện."}, {"q": "完善的社会保险制度可以为劳动者的基本权益提供有力的____，让他们在失业或患病时没有后顾之忧。", "a": "保障", "why": "Danh từ 'sự bảo đảm' cho quyền lợi → 保障; 保卫 là chống lại sự xâm phạm bằng vũ lực."}]}, {"id": "bs-007", "tip": "报复 = trả thù (động từ); 抱负 = hoài bão, chí hướng (danh từ). Hai từ đồng âm bàofù nhưng khác nghĩa hoàn toàn.", "table": true, "words": [{"w": "报复", "py": "bàofù", "vi": "trả thù", "use": "报复社会；打击报复"}, {"w": "抱负", "py": "bàofù", "vi": "hoài bão, chí hướng", "use": "远大抱负；施展抱负"}], "quiz": [{"q": "他遭到同事陷害后并没有想着____，而是用更出色的业绩证明了自己的清白，赢得了大家的尊重。", "a": "报复", "why": "Hành động đáp trả hận thù → 报复; 抱负 là danh từ chỉ chí hướng."}, {"q": "这位年轻的科学家胸怀远大的____，立志要攻克这项困扰业界多年的技术难题，为国家争光。", "a": "抱负", "why": "Danh từ chỉ chí hướng đi với 远大 → 抱负; 报复 là động từ trả thù."}]}, {"id": "bs-008", "tip": "暴露 = để lộ (khuyết điểm, vị trí, vấn đề vốn bị che giấu); 流露 = tự nhiên lộ ra (cảm xúc); 泄露 = làm lộ (bí mật, thông tin); 表露 = chủ động bày tỏ (suy nghĩ, tình cảm); 走漏 = lọt tin (phong thanh, tin tức).", "table": true, "words": [{"w": "暴露", "py": "bàolù", "vi": "để lộ ra, phơi bày", "use": "暴露问题；暴露目标"}, {"w": "流露", "py": "liúlù", "vi": "tự nhiên để lộ (cảm xúc)", "use": "流露真情；神情流露"}, {"w": "泄露", "py": "xièlù", "vi": "làm lộ (bí mật, thông tin)", "use": "泄露机密；泄露信息"}, {"w": "表露", "py": "biǎolù", "vi": "bày tỏ, biểu lộ (có chủ ý)", "use": "表露心声；表露心迹"}, {"w": "走漏", "py": "zǒulòu", "vi": "lọt (tin tức, phong thanh)", "use": "走漏风声；走漏消息"}], "quiz": [{"q": "这次检查____出了公司在财务管理上存在的诸多漏洞，管理层不得不重新审视整个内部制度。", "a": "暴露", "why": "Vấn đề vốn bị giấu nay lộ ra → 暴露; 泄露 là làm lộ bí mật."}, {"q": "看着女儿登上领奖台，母亲的脸上不由自主地____出骄傲和欣慰的神情，眼眶也渐渐湿润了。", "a": "流露", "why": "Cảm xúc tự nhiên lộ ra trên nét mặt → 流露; 泄露 dùng cho bí mật."}, {"q": "这名员工把尚未公开的商业机密____给了竞争对手，给公司造成了巨额经济损失，最终被依法追究责任。", "a": "泄露", "why": "Bí mật bị đưa cho người khác → 泄露; 流露 chỉ cảm xúc."}, {"q": "他性格内向，从不轻易向别人____自己内心的想法，所以同事们都觉得很难和他深入交流。", "a": "表露", "why": "Chủ động nói ra ý nghĩ trong lòng → 表露; 走漏 chỉ tin tức bị lọt."}, {"q": "警方的抓捕计划极其保密，没想到还是有人提前____了风声，嫌疑人连夜逃往了外地。", "a": "走漏", "why": "Phong thanh bị lọt ra ngoài → 走漏; 流露 không dùng với tin tức."}]}, {"id": "bs-009", "tip": "奔波 = bôn ba vất vả (vì mưu sinh, công việc); 奔驰 = phi nhanh (xe, ngựa); 奔跑 = chạy (người, động vật).", "table": true, "words": [{"w": "奔波", "py": "bēnbō", "vi": "bôn ba, tất bật", "use": "奔波劳碌；四处奔波"}, {"w": "奔驰", "py": "bēnchí", "vi": "phi nhanh, lao đi", "use": "飞速奔驰；骏马奔驰"}, {"w": "奔跑", "py": "bēnpǎo", "vi": "chạy", "use": "在操场奔跑；奔跑的孩子"}], "quiz": [{"q": "为了给重病的孩子筹集医药费，这对夫妇整年在各个城市之间四处____，几乎没有睡过一个安稳觉。", "a": "奔波", "why": "Vất vả chạy ngược xuôi vì mục đích → 奔波; 奔跑 chỉ động tác chạy."}, {"q": "高速列车在广袤的平原上飞速____，车窗外的田野和村庄一闪而过，乘客们的目光几乎来不及停留。", "a": "奔驰", "why": "Phương tiện, ngựa phi nhanh → 奔驰; 奔跑 dùng cho người, vật chạy."}, {"q": "孩子们在操场上尽情地____，清脆的笑声回荡在清晨的校园里，驱散了冬日的寒意。", "a": "奔跑", "why": "Động tác chạy của trẻ em → 奔跑; 奔波 mang nghĩa vất vả."}]}, {"id": "bs-010", "tip": "表决 = biểu quyết (bỏ phiếu quyết định); 表态 = tỏ rõ thái độ, lập trường.", "table": true, "words": [{"w": "表决", "py": "biǎojué", "vi": "biểu quyết, bỏ phiếu", "use": "举手表决；表决通过"}, {"w": "表态", "py": "biǎotài", "vi": "tỏ thái độ, bày tỏ lập trường", "use": "公开表态；表态支持"}], "quiz": [{"q": "议案经过代表们逐项____，赞成票超过了三分之二，正式获得通过，并将于下个月起开始实施。", "a": "表决", "why": "Bỏ phiếu để quyết định nghị án → 表决; 表态 chỉ là bày tỏ thái độ."}, {"q": "面对媒体的连续追问，这位官员始终回避，迟迟不肯就此事公开____，引起了公众的不满。", "a": "表态", "why": "Công khai nói rõ lập trường → 表态; 表决 cần có bỏ phiếu."}]}, {"id": "bs-011", "tip": "濒临 = cận kề (nguy cơ xấu: tuyệt chủng, phá sản); 降临 = giáng xuống (đêm, tai họa, may mắn); 来临 = đến (thời điểm, mùa, sự kiện); 面临 = đối mặt (vấn đề, thách thức).", "table": true, "words": [{"w": "濒临", "py": "bīnlín", "vi": "cận kề (bờ vực xấu)", "use": "濒临灭绝；濒临破产"}, {"w": "降临", "py": "jiànglín", "vi": "giáng xuống, đến (đêm, tai họa)", "use": "夜幕降临；灾难降临"}, {"w": "来临", "py": "láilín", "vi": "đến, tới (thời điểm)", "use": "节日来临；春天来临"}, {"w": "面临", "py": "miànlín", "vi": "đối mặt, đứng trước", "use": "面临挑战；面临困境"}], "quiz": [{"q": "由于栖息地不断遭到破坏，这种珍稀动物已经____灭绝，目前野外存活的个体不到五十只。", "a": "濒临", "why": "Sát bờ vực tình huống xấu → 濒临; 面临 là đối mặt chung chung."}, {"q": "夜幕缓缓____，街边的路灯一盏接一盏地亮了起来，整座城市被温暖的灯光所笼罩。", "a": "降临", "why": "Màn đêm buông xuống → 降临; 来临 thường dùng cho thời điểm, mùa."}, {"q": "随着春节的____，火车站里挤满了返乡的人群，每个人脸上都带着对团圆的期盼。", "a": "来临", "why": "Thời điểm, ngày lễ đến → 来临; 濒临 chỉ tình huống xấu."}, {"q": "这家老牌企业正____着转型的巨大压力，如果不能及时创新，就很可能被激烈的市场竞争所淘汰。", "a": "面临", "why": "Đối mặt với áp lực, thách thức → 面临; 降临 chỉ giáng xuống từ trên."}]}, {"id": "bs-012", "tip": "薄弱 = yếu kém (khâu, nền tảng, ý chí); 削弱 = làm suy yếu (động từ); 脆弱 = mong manh, dễ tổn thương (tình cảm, sinh thái).", "table": true, "words": [{"w": "薄弱", "py": "bóruò", "vi": "yếu kém, mỏng yếu", "use": "基础薄弱；薄弱环节"}, {"w": "削弱", "py": "xuēruò", "vi": "làm suy yếu, giảm bớt", "use": "削弱实力；削弱信心"}, {"w": "脆弱", "py": "cuìruò", "vi": "mong manh, dễ tổn thương", "use": "脆弱的心灵；生态脆弱"}], "quiz": [{"q": "老师发现他的数学基础比较____，于是为他制定了专门的补习计划，从最基本的概念开始重新讲起。", "a": "薄弱", "why": "Nền tảng, khâu còn kém → 薄弱; 脆弱 là dễ tổn thương."}, {"q": "连续的失败并没有____他的信心，反而让他更加清楚自己的不足，也更加坚定地走下去。", "a": "削弱", "why": "Động từ 'làm giảm' có tân ngữ 信心 → 削弱; 薄弱, 脆弱 là tính từ."}, {"q": "沙漠地区的生态环境极为____，一旦遭到破坏，往往几十年都很难恢复到原来的状态。", "a": "脆弱", "why": "Dễ bị phá hoại, khó phục hồi → 脆弱; 薄弱 chỉ yếu kém về năng lực."}]}, {"id": "bs-013", "tip": "补偿 = bù đắp (tổn thất, thiếu hụt, có thể không bằng tiền); 赔偿 = bồi thường (do gây thiệt hại, thường bằng tiền); 偿还 = hoàn trả (nợ, tiền vay); 索取 = đòi lấy, yêu cầu (tiền, lợi ích).", "table": true, "words": [{"w": "补偿", "py": "bǔcháng", "vi": "bù đắp, đền bù", "use": "补偿损失；精神补偿"}, {"w": "赔偿", "py": "péicháng", "vi": "bồi thường (gây thiệt hại)", "use": "赔偿损失；赔偿金"}, {"w": "偿还", "py": "chánghuán", "vi": "hoàn trả (nợ)", "use": "偿还债务；偿还贷款"}, {"w": "索取", "py": "suǒqǔ", "vi": "đòi lấy, đòi hỏi", "use": "索取报酬；一味索取"}], "quiz": [{"q": "肇事司机因酒后驾车撞坏了路边的护栏，被法院判决向市政部门____经济损失五万元。", "a": "赔偿", "why": "Gây thiệt hại phải bồi thường bằng tiền → 赔偿; 补偿 là bù đắp nói chung."}, {"q": "他整天加班，几乎没时间陪孩子，周末便带全家去海边度假，算是对孩子的一点____。", "a": "补偿", "why": "Bù đắp tình cảm cho sự thiếu hụt → 补偿; 赔偿 dùng khi gây thiệt hại."}, {"q": "那笔借款他拖了三年才终于全部____，利息加起来比本金还多，让他吃了不少苦头。", "a": "偿还", "why": "Trả lại tiền vay → 偿还; 索取 là đòi lấy."}, {"q": "一个人不能只知道向社会____，更应该学会回报，这样生活才会有真正的意义。", "a": "索取", "why": "Đối lập với 回报, chỉ đòi lấy → 索取; 偿还 là trả nợ."}]}, {"id": "bs-014", "tip": "布置 = bài trí (phòng, hội trường), cũng là giao việc; 装修 = sửa chữa, làm nội thất công trình; 收拾 = dọn dẹp, thu xếp; 装饰 = trang trí cho đẹp.", "table": true, "words": [{"w": "布置", "py": "bùzhì", "vi": "bài trí, sắp đặt; giao việc", "use": "布置会场；布置作业"}, {"w": "装修", "py": "zhuāngxiū", "vi": "sửa sang, làm nội thất", "use": "装修房子；装修完毕"}, {"w": "收拾", "py": "shōushi", "vi": "dọn dẹp, thu dọn", "use": "收拾房间；收拾行李"}, {"w": "装饰", "py": "zhuāngshì", "vi": "trang trí, tô điểm", "use": "装饰墙面；装饰品"}], "quiz": [{"q": "新房____完毕后，他们还要通风三个月，等油漆和胶水的气味散尽才能搬进去住，以免影响健康。", "a": "装修", "why": "Làm nội thất, sơn, lát sàn → 装修; 装饰 chỉ làm đẹp."}, {"q": "会议前，工作人员把会场按照主办方的要求重新____了一遍，桌椅的位置和横幅的高度都做了调整。", "a": "布置", "why": "Bài trí, sắp đặt vị trí → 布置; 收拾 là dọn dẹp."}, {"q": "客人走后，妈妈把客厅里的杯盘碗碟统统____好，又把地板仔仔细细擦了一遍，累得直不起腰。", "a": "收拾", "why": "Dọn dẹp sau khi khách về → 收拾; 装饰 là làm đẹp."}, {"q": "她喜欢在窗台上摆几盆绿植，用来____简单朴素的房间，使整个空间显得生机勃勃。", "a": "装饰", "why": "Thêm chi tiết cho phòng đẹp hơn → 装饰; 装修 là thi công."}]}, {"id": "bs-015", "tip": "参谋 = làm quân sư, góp ý hộ; 参照 = đối chiếu rồi làm theo (tiêu chuẩn, mẫu); 参考 = tham khảo (ý kiến, tài liệu).", "table": true, "words": [{"w": "参谋", "py": "cānmóu", "vi": "góp ý, làm quân sư", "use": "帮我参谋；当参谋"}, {"w": "参照", "py": "cānzhào", "vi": "đối chiếu làm theo", "use": "参照标准；参照执行"}, {"w": "参考", "py": "cānkǎo", "vi": "tham khảo", "use": "仅供参考；参考资料"}], "quiz": [{"q": "买房是一件大事，我想先听听你的意见，请你帮我____一下，看看哪个户型更适合一家三口居住。", "a": "参谋", "why": "Nhờ ai góp ý quyết định → 参谋; 参照 là làm theo mẫu."}, {"q": "新制定的操作规程是____国际通用标准修订的，所有条款都与国际惯例保持了高度一致。", "a": "参照", "why": "Dựa vào tiêu chuẩn để đối chiếu làm theo → 参照; 参考 chỉ để tham khảo."}, {"q": "这份调查报告仅供各位专家____，最终的决策还要综合各方面的情况再做出判断，不能只看这一份材料。", "a": "参考", "why": "Chỉ để xem thêm, không bắt buộc làm theo → 参考; 参照 phải làm theo."}]}, {"id": "bs-016", "tip": "阐述 = trình bày làm sáng tỏ (quan điểm, lý luận, sâu rộng); 陈述 = trần thuật (sự việc, lý do, lời khai).", "table": true, "words": [{"w": "阐述", "py": "chǎnshù", "vi": "trình bày rõ, luận giải", "use": "阐述观点；深入阐述"}, {"w": "陈述", "py": "chénshù", "vi": "trần thuật, trình bày (sự việc)", "use": "陈述事实；陈述理由"}], "quiz": [{"q": "在学术研讨会上，教授深入浅出地____了自己对城市可持续发展的看法，并提出了几条切实可行的建议。", "a": "阐述", "why": "Giải thích quan điểm lý luận cho rõ → 阐述; 陈述 chỉ kể sự việc."}, {"q": "法庭上，证人如实____了事发当天的经过，包括时间、地点以及在场的每一个人，没有任何隐瞒。", "a": "陈述", "why": "Kể lại diễn biến sự việc → 陈述; 阐述 là luận giải quan điểm."}]}, {"id": "bs-017", "tip": "撤销 = thu hồi, bãi bỏ (chức vụ, quyết định, vụ án); 取消 = hủy (kế hoạch, chuyến bay, hợp đồng); 取缔 = cấm chỉ, dẹp bỏ (hoạt động trái phép).", "table": true, "words": [{"w": "撤销", "py": "chèxiāo", "vi": "thu hồi, bãi bỏ (chức vụ, quyết định)", "use": "撤销职务；撤销处分"}, {"w": "取消", "py": "qǔxiāo", "vi": "hủy bỏ, bỏ", "use": "取消航班；取消资格"}, {"w": "取缔", "py": "qǔdì", "vi": "cấm chỉ, dẹp bỏ", "use": "取缔非法；依法取缔"}], "quiz": [{"q": "因涉嫌严重违纪，他被上级部门____了全部职务，并接受进一步的调查，相关材料也已移交司法机关。", "a": "撤销", "why": "Thu hồi chức vụ, quyết định chính thức → 撤销; 取缔 dùng cho hoạt động trái phép."}, {"q": "受台风影响，当天下午的所有航班都被临时____，数千名旅客滞留在机场等待航空公司的通知。", "a": "取消", "why": "Hủy chuyến bay, kế hoạch → 取消; 取缔 là cấm chỉ."}, {"q": "执法部门依法____了这家无证经营的黑作坊，并没收了所有违规生产的设备和未售出的产品。", "a": "取缔", "why": "Dẹp bỏ cơ sở hoạt động bất hợp pháp → 取缔; 取消 là hủy thông thường."}]}, {"id": "bs-018", "tip": "承诺 = cam kết, hứa (trang trọng, có trách nhiệm); 答应 = đồng ý, nhận lời (khẩu ngữ); 允许 = cho phép (theo quy định).", "table": true, "words": [{"w": "承诺", "py": "chéngnuò", "vi": "cam kết, hứa chắc", "use": "信守承诺；兑现承诺"}, {"w": "答应", "py": "dāying", "vi": "đồng ý, nhận lời", "use": "答应请求；答应帮忙"}, {"w": "允许", "py": "yǔnxǔ", "vi": "cho phép", "use": "允许入内；不允许"}], "quiz": [{"q": "公司当众____，三个月内一定补发所有员工被拖欠的工资，如有违约愿意承担全部法律责任。", "a": "承诺", "why": "Cam kết trang trọng có trách nhiệm → 承诺; 允许 là cho phép."}, {"q": "孩子软磨硬泡了好几天，妈妈终于松了口，____周末带他去游乐场玩一整天，他高兴得跳了起来。", "a": "答应", "why": "Nhận lời một yêu cầu → 答应; 允许 là cho phép theo quy định."}, {"q": "根据图书馆的规定，读者不得带食物入内，也不____在阅览室里大声交谈或者接打电话。", "a": "允许", "why": "Quy định không cho phép → 允许; 承诺 là lời cam kết của mình."}]}, {"id": "bs-019", "tip": "大体 = nhìn chung, về cơ bản (tổng thể); 大致 = đại khái, sơ lược; 大约 = khoảng (số lượng, thời gian); 大概 = có lẽ (suy đoán), cũng chỉ ước lượng.", "table": true, "words": [{"w": "大体", "py": "dàtǐ", "vi": "nhìn chung, về đại thể", "use": "大体相同；大体上"}, {"w": "大致", "py": "dàzhì", "vi": "đại khái, sơ lược", "use": "大致了解；大致相同"}, {"w": "大约", "py": "dàyuē", "vi": "khoảng (số ước chừng)", "use": "大约十点；大约三公里"}, {"w": "大概", "py": "dàgài", "vi": "có lẽ; đại khái", "use": "大概是；大概情况"}], "quiz": [{"q": "这份方案经过多次修改，____上已经符合大家的要求，只剩下个别细节还需进一步斟酌和完善。", "a": "大体", "why": "Nhìn tổng thể về cơ bản → 大体上; 大约 chỉ số lượng."}, {"q": "听完朋友的介绍，我对这座古城的历史沿革有了一个____的了解，具体情况还得亲自去看看才行。", "a": "大致", "why": "Hiểu sơ lược, chưa chi tiết → 大致; 大约 là khoảng cách số."}, {"q": "从我家到火车站步行____需要四十分钟，如果赶上早高峰，打车也未必比走路更快。", "a": "大约", "why": "Ước chừng số lượng thời gian → 大约; 大体 không đi với số."}, {"q": "外面乌云密布，风也越来越大，____马上就要下一场暴雨了，我们还是别出门了。", "a": "大概", "why": "Suy đoán 'có lẽ' → 大概; 大约 chỉ ước lượng số, 大体 không phải suy đoán."}]}, {"id": "bs-020", "tip": "抵抗 = chống cự (bệnh, xâm lược, tác động bên ngoài); 对抗 = đối đầu (hai bên ngang nhau); 反抗 = nổi dậy chống áp bức.", "table": true, "words": [{"w": "抵抗", "py": "dǐkàng", "vi": "chống cự, kháng (bệnh, tấn công)", "use": "抵抗疾病；顽强抵抗"}, {"w": "对抗", "py": "duìkàng", "vi": "đối kháng, đối đầu", "use": "军事对抗；对抗赛"}, {"w": "反抗", "py": "fǎnkàng", "vi": "phản kháng, nổi dậy", "use": "奋起反抗；反抗压迫"}], "quiz": [{"q": "多吃新鲜蔬果、坚持锻炼，可以增强身体的免疫力，更好地____各种病毒的侵袭，减少生病的机会。", "a": "抵抗", "why": "Chống lại tác động từ bên ngoài như virus → 抵抗; 反抗 là chống áp bức."}, {"q": "两国长期处于军事____状态，边境上的紧张局势随时都有可能升级为一场真正的武装冲突。", "a": "对抗", "why": "Hai bên đối đầu nhau → 对抗; 抵抗 là chống lại cuộc tấn công."}, {"q": "面对残酷的压迫，农民们终于忍无可忍，纷纷拿起农具起来____，推翻了当地的统治者。", "a": "反抗", "why": "Nổi dậy chống áp bức, bóc lột → 反抗; 对抗 chỉ đối đầu ngang sức."}]}, {"id": "bs-021", "tip": "抵制 = tẩy chay, chống lại (hàng hóa, hành vi xấu) bằng cách không chấp nhận; 遏制 = kiềm chế, ngăn chặn (xu hướng, đà tăng, cảm xúc).", "table": true, "words": [{"w": "抵制", "py": "dǐzhì", "vi": "tẩy chay, kiên quyết không chấp nhận", "use": "抵制日货；抵制不良风气"}, {"w": "遏制", "py": "èzhì", "vi": "kiềm chế, ngăn chặn", "use": "遏制上涨；遏制蔓延"}], "quiz": [{"q": "广大消费者自发____这种虚假宣传的产品，使得该品牌的销量在短短一个月内大幅下滑。", "a": "抵制", "why": "Người tiêu dùng chủ động không dùng → 抵制; 遏制 là ngăn xu hướng."}, {"q": "政府出台了一系列调控措施，有效____了房价过快上涨的势头，市场逐渐恢复了理性和平稳。", "a": "遏制", "why": "Ngăn đà tăng nhanh → 遏制; 抵制 là tẩy chay."}]}, {"id": "bs-022", "tip": "调和 = điều hòa (mâu thuẫn, màu sắc, hương vị); 调剂 = điều tiết, cân đối thừa thiếu hoặc làm phong phú đời sống; 调节 = điều chỉnh (nhiệt độ, khí hậu, tốc độ); 调解 = hòa giải (tranh chấp).", "table": true, "words": [{"w": "调和", "py": "tiáohé", "vi": "điều hòa, dung hòa", "use": "调和矛盾；调和色彩"}, {"w": "调剂", "py": "tiáojì", "vi": "điều tiết, cân đối", "use": "调剂余缺；调剂生活"}, {"w": "调节", "py": "tiáojié", "vi": "điều chỉnh", "use": "调节温度；调节气候"}, {"w": "调解", "py": "tiáojiě", "vi": "hòa giải", "use": "调解纠纷；法院调解"}], "quiz": [{"q": "两家邻居因为一堵围墙争执不下，居委会的工作人员出面进行____，最终双方握手言和。", "a": "调解", "why": "Bên thứ ba giải quyết tranh chấp → 调解; 调和 là dung hòa quan điểm."}, {"q": "森林能够____气候，在炎热的夏季带来凉爽，在干燥的季节增加空气湿度，是天然的空调。", "a": "调节", "why": "Điều chỉnh khí hậu, nhiệt độ → 调节; 调解 là hòa giải người."}, {"q": "紧张的工作之余，他喜欢去郊外垂钓，用这种方式____一下枯燥的生活，让自己彻底放松下来。", "a": "调剂", "why": "Làm đời sống bớt đơn điệu → 调剂; 调节 là chỉnh thiết bị, nhiệt độ."}, {"q": "这两种观点看似水火不容，其实并非无法____，只要双方各自让一步就能找到共同点。", "a": "调和", "why": "Dung hòa hai quan điểm đối lập → 调和; 调解 dùng cho tranh chấp giữa người."}]}, {"id": "bs-023", "tip": "堵塞 = tắc nghẽn (đường, giao thông, ống); 闭塞 = bế tắc, hẻo lánh, thông tin lạc hậu; 封闭 = đóng kín, phong tỏa.", "table": true, "words": [{"w": "堵塞", "py": "dǔsè", "vi": "tắc nghẽn", "use": "交通堵塞；堵塞管道"}, {"w": "闭塞", "py": "bìsè", "vi": "bế tắc, hẻo lánh, tin tức kém", "use": "消息闭塞；交通闭塞"}, {"w": "封闭", "py": "fēngbì", "vi": "đóng kín, phong tỏa", "use": "封闭管理；封闭道路"}], "quiz": [{"q": "下班高峰期，主干道上车辆排起长龙，交通严重____，司机们只能耐心地等待，谁也走不动。", "a": "堵塞", "why": "Giao thông tắc nghẽn → 堵塞; 闭塞 chỉ nơi hẻo lánh, kém thông tin."}, {"q": "那个偏僻的山村交通不便，消息十分____，直到去年才通上电话和网络，村民对外界知之甚少。", "a": "闭塞", "why": "Nơi hẻo lánh, ít thông tin → 闭塞; 堵塞 là tắc nghẽn vật lý."}, {"q": "由于发现了疑似病例，小区被临时____管理，居民不得随意进出，生活物资由专人统一配送。", "a": "封闭", "why": "Đóng kín khu vực, không cho ra vào → 封闭; 闭塞 mang nghĩa thông tin kém."}]}, {"id": "bs-024", "tip": "杜绝 = chấm dứt hẳn, ngăn ngừa triệt để (hiện tượng xấu); 灭绝 = tuyệt chủng, diệt vong; 断绝 = cắt đứt (quan hệ, nguồn cung).", "table": true, "words": [{"w": "杜绝", "py": "dùjué", "vi": "chấm dứt triệt để, ngăn ngừa", "use": "杜绝浪费；杜绝隐患"}, {"w": "灭绝", "py": "mièjué", "vi": "tuyệt chủng, diệt vong", "use": "物种灭绝；灭绝人性"}, {"w": "断绝", "py": "duànjué", "vi": "cắt đứt", "use": "断绝关系；断绝来往"}], "quiz": [{"q": "为了彻底____食品安全隐患，市场监管部门对所有餐饮单位进行了拉网式检查，发现问题立即整改。", "a": "杜绝", "why": "Ngăn chặn triệt để hiện tượng xấu → 杜绝; 断绝 là cắt đứt quan hệ."}, {"q": "恐龙是在六千多万年前____的，至于原因，科学家们至今仍有各种不同的推测，没有定论。", "a": "灭绝", "why": "Một loài biến mất hoàn toàn → 灭绝; 断绝 là cắt đứt quan hệ."}, {"q": "因为在原则问题上产生了严重分歧，他与家人____了一切往来，独自远走他乡，多年没有音讯。", "a": "断绝", "why": "Cắt đứt quan hệ, qua lại → 断绝; 杜绝 là chấm dứt hiện tượng xấu."}]}, {"id": "bs-025", "tip": "对待 = đối xử (người hay việc, thể hiện bằng hành động); 看待 = nhìn nhận (quan điểm); 款待 = tiếp đãi nồng hậu; 亏待 = đối xử tệ, thiệt thòi.", "table": true, "words": [{"w": "对待", "py": "duìdài", "vi": "đối xử, xử lý", "use": "对待客人；认真对待"}, {"w": "看待", "py": "kàndài", "vi": "nhìn nhận, xem xét", "use": "看待问题；正确看待"}, {"w": "款待", "py": "kuǎndài", "vi": "tiếp đãi nồng hậu", "use": "热情款待；盛情款待"}, {"w": "亏待", "py": "kuīdài", "vi": "đối xử tệ, bạc đãi", "use": "亏待员工；不会亏待"}], "quiz": [{"q": "他认真____每一位顾客，哪怕只是买一包纸巾的人，也能得到同样热情周到的服务。", "a": "对待", "why": "Hành động đối xử với người → 对待; 看待 là cách nhìn."}, {"q": "同一件事情，从不同的角度去____，往往会得出完全不同的结论，所以我们要学会换位思考。", "a": "看待", "why": "Quan điểm khi xem xét vấn đề → 看待; 款待 là tiếp khách."}, {"q": "我们到老乡家里做客，主人杀鸡宰羊，拿出最好的酒菜热情____，让大家十分感动。", "a": "款待", "why": "Tiếp đãi khách nồng hậu → 款待; 对待 không nhấn mạnh việc đãi tiệc."}, {"q": "老板待人宽厚，员工为公司付出了努力，他从来不会____他们，年终奖也总是很丰厚。", "a": "亏待", "why": "Đối xử thiệt thòi với người → 亏待; 款待 là đãi khách."}]}, {"id": "bs-026", "tip": "对应 = tương ứng (hai thứ ăn khớp nhau); 对照 = đối chiếu, so sánh (động từ).", "table": true, "words": [{"w": "对应", "py": "duìyìng", "vi": "tương ứng", "use": "相互对应；与…对应"}, {"w": "对照", "py": "duìzhào", "vi": "đối chiếu, so sánh", "use": "对照原文；对照检查"}], "quiz": [{"q": "表格中的每一个英文单词都有一个与之____的中文解释，查起来非常方便，读者不用再翻其他词典。", "a": "对应", "why": "Hai thứ khớp với nhau → 对应; 对照 là hành động so sánh."}, {"q": "请你把译文和原文逐句____一遍，看看有没有漏译或者错译的地方，改完之后再交给我。", "a": "对照", "why": "Hành động đem ra so sánh → 对照; 对应 là trạng thái tương ứng."}]}, {"id": "bs-027", "tip": "发布 = phát đi (thông báo, cảnh báo, sản phẩm); 公布 = công bố cho công chúng biết (kết quả, danh sách); 宣布 = tuyên bố (quyết định, trang trọng).", "table": true, "words": [{"w": "发布", "py": "fābù", "vi": "phát đi, ra (tin, cảnh báo)", "use": "发布预警；发布新闻"}, {"w": "公布", "py": "gōngbù", "vi": "công bố ra công chúng", "use": "公布结果；公布名单"}, {"w": "宣布", "py": "xuānbù", "vi": "tuyên bố", "use": "宣布决定；宣布成立"}], "quiz": [{"q": "气象台今天上午十点____了暴雨红色预警，提醒市民尽量减少外出，并注意防范次生灾害。", "a": "发布", "why": "Phát đi cảnh báo, thông báo → 发布; 宣布 là tuyên bố long trọng."}, {"q": "考试成绩将在下周一统一____，同学们可以登录学校官网查询自己的分数和排名。", "a": "公布", "why": "Cho công chúng biết kết quả → 公布; 宣布 là tuyên bố quyết định."}, {"q": "会议结束时，主席郑重____本届运动会正式闭幕，现场响起了热烈的掌声。", "a": "宣布", "why": "Tuyên bố trang trọng một sự kiện → 宣布; 公布 là công bố thông tin."}]}, {"id": "bs-028", "tip": "腐败 = tham nhũng, thối nát (chính trị, xã hội), cũng chỉ thức ăn ôi; 腐烂 = thối rữa (vật hữu cơ); 腐蚀 = ăn mòn (axit, nước biển, tư tưởng); 腐朽 = mục nát (gỗ, chế độ, tư tưởng).", "table": true, "words": [{"w": "腐败", "py": "fǔbài", "vi": "tham nhũng, thối nát", "use": "反腐败；腐败分子"}, {"w": "腐烂", "py": "fǔlàn", "vi": "thối rữa", "use": "腐烂变质；水果腐烂"}, {"w": "腐蚀", "py": "fǔshí", "vi": "ăn mòn", "use": "腐蚀金属；腐蚀思想"}, {"w": "腐朽", "py": "fǔxiǔ", "vi": "mục nát", "use": "腐朽的木头；腐朽没落"}], "quiz": [{"q": "这位官员利用职权收受贿赂，严重的____问题被曝光后，他受到了法律的严惩，并被开除公职。", "a": "腐败", "why": "Tham nhũng trong bộ máy → 腐败; 腐烂 chỉ vật thối rữa."}, {"q": "仓库里的水果因为存放时间过长，大部分都已经____发臭，只能全部扔掉，造成了不小的损失。", "a": "腐烂", "why": "Vật hữu cơ thối rữa → 腐烂; 腐朽 dùng cho gỗ, chế độ."}, {"q": "海边的钢结构桥梁长期受到海水的____，如果不定期做防锈处理，几年后就会出现严重损坏。", "a": "腐蚀", "why": "Bị nước biển ăn mòn kim loại → 腐蚀; 腐烂 là thối rữa."}, {"q": "这座老宅的木梁早已____不堪，稍有风吹就嘎吱作响，随时都有坍塌的危险，不能再住人了。", "a": "腐朽", "why": "Gỗ mục nát → 腐朽; 腐烂 dùng cho vật hữu cơ như thức ăn."}]}, {"id": "bs-029", "tip": "干扰 = quấy nhiễu (tín hiệu, công việc, tiếng ồn); 干涉 = can thiệp vào việc người khác (không có quyền, thường tiêu cực); 干预 = can dự (có chủ ý, trung tính, hay dùng cho chính sách, y tế).", "table": true, "words": [{"w": "干扰", "py": "gānrǎo", "vi": "quấy nhiễu, gây cản trở", "use": "干扰信号；噪音干扰"}, {"w": "干涉", "py": "gānshè", "vi": "can thiệp (việc của người khác)", "use": "干涉内政；干涉婚姻"}, {"w": "干预", "py": "gānyù", "vi": "can dự, can thiệp có chủ ý", "use": "政府干预；早期干预"}], "quiz": [{"q": "附近的施工噪音严重____了学生们的复习，老师只好把晚自习调到另一栋比较安静的教学楼里进行。", "a": "干扰", "why": "Tiếng ồn gây ảnh hưởng → 干扰; 干涉 là xen vào việc người khác."}, {"q": "父母应该尊重孩子的选择，不要过多____他们的交友和恋爱，否则很容易引起孩子的逆反心理。", "a": "干涉", "why": "Xen vào việc riêng của người khác → 干涉; 干预 trung tính, dùng cho chính sách."}, {"q": "当市场出现剧烈波动时，政府可以通过适当的经济手段进行____，以维护市场的稳定和公平。", "a": "干预", "why": "Can thiệp có chủ ý bằng biện pháp → 干预; 干扰 chỉ gây cản trở."}]}, {"id": "bs-030", "tip": "感染 = (bệnh/vi khuẩn) xâm nhập cơ thể, hoặc cảm xúc lan sang người khác; 传染 = bệnh lây từ người này sang người khác; 感动 = lòng xúc động, tính từ/động từ chỉ cảm xúc.", "table": true, "words": [{"w": "感染", "py": "gǎnrǎn", "vi": "nhiễm (bệnh, vi khuẩn); lan truyền cảm xúc", "use": "伤口感染；被情绪感染"}, {"w": "传染", "py": "chuánrǎn", "vi": "lây (bệnh) từ người này sang người khác", "use": "传染疾病；传染给别人"}, {"w": "感动", "py": "gǎndòng", "vi": "cảm động, xúc động", "use": "深受感动；令人感动"}], "quiz": [{"q": "医生在缝合伤口时没有做好消毒，结果病人的伤口出现了红肿化脓，不得不再次住院接受治疗，这就是典型的伤口____。", "a": "感染", "why": "Vi khuẩn xâm nhập vết thương → 感染. 传染 phải nói về việc lây sang người khác; 感动 là xúc động."}, {"q": "这种疾病主要通过空气和飞沫在人与人之间____，所以一旦发现病例，必须马上隔离，以免波及更多的人。", "a": "传染", "why": "Bệnh lây giữa người với người → 传染. 感染 nhấn vào việc bị nhiễm, 感动 không liên quan bệnh."}, {"q": "他是个很容易____的人，每次看电影遇到温情的情节，总会不好意思地偷偷抹眼泪，还怕被身边的朋友发现。", "a": "感动", "why": "Dễ xúc động rơi nước mắt → 感动. Nếu dùng 感染 sẽ thành 'dễ bị nhiễm bệnh', 传染 không đi với 容易 theo nghĩa này."}]}, {"id": "bs-031", "tip": "隔阂 = khoảng cách trong lòng giữa người với người; 间隔 = khoảng cách/quãng nghỉ về không gian, thời gian; 隔离 = cách ly, tách riêng (bệnh nhân, vật).", "table": true, "words": [{"w": "隔阂", "py": "géhé", "vi": "cách biệt, khúc mắc trong tình cảm", "use": "产生隔阂；消除隔阂"}, {"w": "间隔", "py": "jiàngé", "vi": "khoảng cách, quãng cách (không gian/thời gian)", "use": "间隔时间；每隔一段距离"}, {"w": "隔离", "py": "gélí", "vi": "cách ly, tách ra", "use": "隔离病人；隔离观察"}], "quiz": [{"q": "父母和孩子之间如果缺少沟通，时间一长，彼此就会产生难以消除的____，谁也不愿意先开口说出心里话。", "a": "隔阂", "why": "Khoảng cách tâm lý giữa người với người → 隔阂. 间隔 chỉ khoảng cách vật lý; 隔离 là tách ra."}, {"q": "为了保证行车安全，高速公路上的车辆要保持足够的车距，路边每隔一段路还会设置一块提示牌，提醒司机注意前后车的____。", "a": "间隔", "why": "Khoảng cách giữa các xe → 间隔. 隔离 là tách biệt hẳn, 隔阂 là khúc mắc tâm lý."}, {"q": "从疫区回来的人员需要先在指定地点____十四天，确认没有发病迹象之后，才能回到自己的家中与家人团聚。", "a": "隔离", "why": "Tách người nghi nhiễm ra để quan sát → 隔离. 隔阂 và 间隔 không dùng làm động từ theo nghĩa này."}]}, {"id": "bs-032", "tip": "更正 = đính chính (thông tin, số liệu đã công bố); 改正 = sửa (lỗi sai của mình); 纠正 = uốn nắn, chỉnh lại (hành vi/quan niệm sai của người khác).", "table": true, "words": [{"w": "更正", "py": "gēngzhèng", "vi": "đính chính (nội dung đã đăng, đã nói)", "use": "更正错误信息；发表更正声明"}, {"w": "改正", "py": "gǎizhèng", "vi": "sửa chữa (lỗi, khuyết điểm)", "use": "改正错误；改正缺点"}, {"w": "纠正", "py": "jiūzhèng", "vi": "uốn nắn, chỉnh sửa (cái sai lệch)", "use": "纠正发音；纠正偏差"}], "quiz": [{"q": "报社发现昨天刊登的新闻中有一处数据写错了，于是在今天的版面上专门发表声明，对错误的数字进行了____。", "a": "更正", "why": "Đính chính thông tin đã công bố → 更正. 改正 là tự sửa lỗi; 纠正 là chỉnh sai lệch của người khác."}, {"q": "知错能改是一种美德，只要你真心认识到自己的缺点，并且在今后的行动中努力____，大家一定会原谅你的。", "a": "改正", "why": "Tự mình sửa khuyết điểm → 改正. 更正 dùng cho thông tin; 纠正 thường do người khác chỉnh."}, {"q": "老师发现这个外国学生的发音总是不准，便耐心地一个音一个音地帮他____，经过两个月的练习，他的口语进步了很多。", "a": "纠正", "why": "Chỉnh lại cái sai của người khác → 纠正. 更正 dùng cho thông tin công bố, 改正 là tự sửa."}]}, {"id": "bs-033", "tip": "孤独 = cô đơn, lẻ loi (cảm giác); 孤立 = bị cô lập, tách rời, không có ai ủng hộ (tình thế); 独立 = độc lập, tự đứng vững.", "table": true, "words": [{"w": "孤独", "py": "gūdú", "vi": "cô độc, đơn độc (cảm giác)", "use": "孤独的老人；感到孤独"}, {"w": "孤立", "py": "gūlì", "vi": "cô lập, bị tách rời", "use": "孤立无援；孤立事件"}, {"w": "独立", "py": "dúlì", "vi": "độc lập, tự lập", "use": "独立思考；经济独立"}], "quiz": [{"q": "独居的老人常常在子女上班后整日无人说话，晚上面对空荡荡的房间，内心难免会涌起一阵深深的____。", "a": "孤独", "why": "Cảm giác lẻ loi trong lòng → 孤独. 孤立 là bị tách khỏi tập thể; 独立 là tự lập."}, {"q": "在这场争论中，他的观点遭到了所有同事的反对，渐渐地没有人再愿意和他交流，他的处境变得十分____。", "a": "孤立", "why": "Bị mọi người xa lánh, không ai ủng hộ → 孤立. 孤独 thiên về cảm xúc cá nhân."}, {"q": "大学毕业以后，她不再依靠父母的资助，而是靠自己的工资租房生活，学会了____处理生活中的各种难题。", "a": "独立", "why": "Tự mình xoay xở, không dựa vào người khác → 独立. 孤独 và 孤立 mang sắc thái tiêu cực, không hợp."}]}, {"id": "bs-034", "tip": "过瘾 = thỏa thích, đã (làm việc mình thích đến mức hài lòng); 上瘾 = nghiện, không bỏ được (thói quen).", "table": true, "words": [{"w": "过瘾", "py": "guòyǐn", "vi": "đã, thỏa thích", "use": "玩得过瘾；看得真过瘾"}, {"w": "上瘾", "py": "shàngyǐn", "vi": "nghiện, say mê không bỏ được", "use": "对游戏上瘾；喝咖啡上瘾"}], "quiz": [{"q": "连续几天加班之后，周末他终于和朋友们在球场上痛痛快快地打了一场比赛，从上午一直踢到傍晚，大家都说踢得真____。", "a": "过瘾", "why": "Cảm giác thỏa thích sau khi làm điều mình thích → 过瘾. 上瘾 là nghiện, mang nghĩa tiêu cực."}, {"q": "起初他只是在睡前随便玩几局手机游戏放松一下，没想到时间一长越玩越入迷，现在一天不玩就浑身不自在，已经彻底____了。", "a": "上瘾", "why": "Dần dần không bỏ được → 上瘾. 过瘾 chỉ sự hài lòng nhất thời, không có ý lệ thuộc."}, {"q": "这部电影的特效和节奏都处理得非常好，三个小时的片长一点也不觉得拖沓，从头看到尾，观众都觉得十分____。", "a": "过瘾", "why": "Xem đã mắt, hả hê → 过瘾. 上瘾 sẽ thành 'nghiện phim', không phải lời khen."}]}, {"id": "bs-035", "tip": "耗费 = tốn (thời gian, tiền, sức, tinh thần, nhấn vào mất mát); 消耗 = tiêu hao dần (năng lượng, vật chất); 消费 = tiêu dùng (mua hàng hóa, dịch vụ); 花费 = chi tiêu, bỏ ra (tiền, thời gian).", "table": true, "words": [{"w": "耗费", "py": "hàofèi", "vi": "tốn (nhiều sức, thời gian, tài lực)", "use": "耗费心血；耗费大量时间"}, {"w": "消耗", "py": "xiāohào", "vi": "tiêu hao (năng lượng, vật chất)", "use": "消耗体力；消耗能源"}, {"w": "消费", "py": "xiāofèi", "vi": "tiêu dùng, chi tiêu mua sắm", "use": "消费水平；刺激消费"}, {"w": "花费", "py": "huāfèi", "vi": "chi phí; tiêu (tiền, thời gian)", "use": "花费一千元；花费不少精力"}], "quiz": [{"q": "这位科学家为了完成这项研究，前后____了整整二十年的心血，期间几乎没有休过一个完整的假期。", "a": "耗费", "why": "Bỏ ra rất nhiều tâm huyết, nhấn mạnh sự hao tổn → 耗费. 消费 là mua sắm; 消耗 thiên về năng lượng, vật chất."}, {"q": "长跑运动员在比赛中会大量____体内储存的能量，所以赛后需要及时补充水分和食物才能恢复体力。", "a": "消耗", "why": "Năng lượng trong cơ thể hao dần → 消耗. 消费 chỉ mua sắm; 花费 chỉ tiền/thời gian."}, {"q": "随着居民收入不断提高，人们在旅游、教育和文化娱乐方面的____明显增加，也带动了相关行业的快速发展。", "a": "消费", "why": "Chi tiêu mua dịch vụ → 消费. 耗费 và 消耗 không nói về hành vi mua sắm của người dân."}, {"q": "这次出国留学的各项开支算下来，每个月大约要____一万多元，对普通家庭来说是一笔不小的负担。", "a": "花费", "why": "Số tiền bỏ ra cụ thể → 花费. 消耗 không đi với tiền; 耗费 mang sắc thái tổn hao lớn."}]}, {"id": "bs-036", "tip": "激励 = khích lệ làm tăng tinh thần, động lực (tác động từ bên trong, ý chí); 鼓励 = cổ vũ, động viên bằng lời nói/hành động; 奖励 = khen thưởng bằng vật chất/danh nghĩa; 奖赏 = ban thưởng (trang trọng, của người trên).", "table": true, "words": [{"w": "激励", "py": "jīlì", "vi": "khích lệ, thúc đẩy tinh thần", "use": "激励员工；受到激励"}, {"w": "鼓励", "py": "gǔlì", "vi": "cổ vũ, động viên", "use": "鼓励孩子；互相鼓励"}, {"w": "奖励", "py": "jiǎnglì", "vi": "khen thưởng (bằng tiền, hiện vật)", "use": "奖励优秀员工；物质奖励"}, {"w": "奖赏", "py": "jiǎngshǎng", "vi": "ban thưởng (của bề trên)", "use": "重重奖赏；得到奖赏"}], "quiz": [{"q": "公司设立了清晰的晋升制度，让每一位员工都能看到努力之后的前景，这种做法极大地____了大家的工作热情。", "a": "激励", "why": "Thúc đẩy tinh thần, động lực làm việc → 激励. 奖励 là thưởng cụ thể; 鼓励 thiên về lời động viên."}, {"q": "孩子第一次上台演讲时紧张得声音发抖，妈妈坐在台下不停地朝他点头微笑，这无声的____让他渐渐平静下来。", "a": "鼓励", "why": "Động viên bằng cử chỉ, lời nói → 鼓励. 奖励 là thưởng, 激励 mang tính thúc đẩy lâu dài."}, {"q": "学校为在全国数学竞赛中获奖的同学颁发了荣誉证书，并给予每人一千元的现金____，以表彰他们的优异成绩。", "a": "奖励", "why": "Thưởng tiền, giấy khen → 奖励. 鼓励 chỉ động viên tinh thần."}, {"q": "故事中的国王听完大臣的献策非常高兴，当场取出一箱金银珠宝，对立下大功的将士们作了重重的____。", "a": "奖赏", "why": "Vua ban thưởng cho thần dân, sắc thái cổ trang, trang trọng → 奖赏. 奖励 dùng trong tổ chức hiện đại."}]}, {"id": "bs-037", "tip": "检讨 = tự kiểm điểm, nhìn lại lỗi của mình; 检查 = kiểm tra, rà soát (sự vật, sức khỏe).", "table": true, "words": [{"w": "检讨", "py": "jiǎntǎo", "vi": "tự kiểm điểm, xem xét lại sai sót", "use": "写检讨；深刻检讨"}, {"w": "检查", "py": "jiǎnchá", "vi": "kiểm tra, rà soát", "use": "检查身体；检查作业"}], "quiz": [{"q": "这次项目失败后，团队负责人在会上对决策中的失误作了深刻的____，并提出了具体的改进措施，赢得了大家的理解。", "a": "检讨", "why": "Tự phê bình lỗi sai của mình → 检讨. 检查 chỉ kiểm tra việc/vật, không mang nghĩa tự nhận lỗi."}, {"q": "按照规定，工厂的安全员每天下班前都要对车间里的设备、电线和消防器材逐一进行____，确保没有任何隐患。", "a": "检查", "why": "Rà soát thiết bị → 检查. 检讨 chỉ dùng khi nhìn lại lỗi lầm của bản thân."}]}, {"id": "bs-038", "tip": "简化 = làm đơn giản đi (thủ tục, quy trình, chữ viết); 精简 = tinh giản, cắt bớt cho gọn (nhân sự, bộ máy, nội dung).", "table": true, "words": [{"w": "简化", "py": "jiǎnhuà", "vi": "đơn giản hóa", "use": "简化手续；简化程序"}, {"w": "精简", "py": "jīngjiǎn", "vi": "tinh giản, cắt giảm cho gọn", "use": "精简人员；精简机构"}], "quiz": [{"q": "为了方便群众办事，政府部门取消了许多不必要的证明材料，把原来需要跑五六个窗口的流程____成了一次办结。", "a": "简化", "why": "Làm quy trình đơn giản đi → 简化. 精简 thiên về cắt bớt số lượng người, bộ phận."}, {"q": "公司为了降低运营成本，决定压缩管理层级，对一些职能重叠的部门进行合并，同时____冗余的人员编制。", "a": "精简", "why": "Cắt giảm biên chế, bộ máy → 精简. 简化 dùng cho quy trình, thủ tục."}]}, {"id": "bs-039", "tip": "鉴别 = phân biệt thật giả, tốt xấu; 借鉴 = tham khảo kinh nghiệm của người khác để học hỏi; 鉴定 = giám định, đánh giá chính thức (do chuyên gia).", "table": true, "words": [{"w": "鉴别", "py": "jiànbié", "vi": "phân biệt, nhận định thật giả", "use": "鉴别真伪；鉴别能力"}, {"w": "借鉴", "py": "jièjiàn", "vi": "tham khảo, học hỏi kinh nghiệm", "use": "借鉴经验；值得借鉴"}, {"w": "鉴定", "py": "jiàndìng", "vi": "giám định, thẩm định", "use": "专家鉴定；鉴定结果"}], "quiz": [{"q": "现在网上的信息良莠不齐，我们要提高自己的____能力，学会从大量的资料中分辨出哪些是真实可靠的内容。", "a": "鉴别", "why": "Phân biệt thật giả → 鉴别. 借鉴 là học hỏi; 鉴定 là kết luận chính thức của chuyên gia."}, {"q": "这座城市在垃圾分类方面积累了丰富的经验，不少兄弟城市纷纷派人前来考察，希望能从中____一些有用的做法。", "a": "借鉴", "why": "Học hỏi kinh nghiệm → 借鉴. 鉴别 và 鉴定 đều không có nghĩa tham khảo."}, {"q": "这件出土的瓷器是否为宋代真品，需要请文物部门的专家进行科学____之后，才能得出最终的结论。", "a": "鉴定", "why": "Chuyên gia thẩm định chính thức → 鉴定. 鉴别 là cá nhân phân biệt, không cần kết luận chuyên môn."}]}, {"id": "bs-040", "tip": "讲究 = chú trọng, coi trọng, cầu kỳ; 在乎 = để tâm, bận lòng (hay đi với phủ định); 计较 = so đo, tính toán thiệt hơn; 在意 = để ý, bận tâm (chung hơn 在乎).", "table": true, "words": [{"w": "讲究", "py": "jiǎngjiu", "vi": "chú trọng, cầu kỳ", "use": "讲究卫生；吃穿很讲究"}, {"w": "在乎", "py": "zàihu", "vi": "để tâm, bận lòng", "use": "满不在乎；不在乎结果"}, {"w": "计较", "py": "jìjiào", "vi": "so đo, tính toán thiệt hơn", "use": "斤斤计较；不计较得失"}, {"w": "在意", "py": "zàiyì", "vi": "để ý, bận tâm", "use": "不太在意；别太在意"}], "quiz": [{"q": "这家老字号的师傅做菜非常____，从选材、火候到摆盘都有一套严格的标准，哪怕客人不懂也不肯马虎。", "a": "讲究", "why": "Coi trọng, chú ý từng chi tiết → 讲究. 在乎/在意 là bận lòng; 计较 là so đo thiệt hơn."}, {"q": "他总是对朋友说，只要大家玩得开心就好，至于花了多少钱、谁多付了一点，他从来都不愿意去____。", "a": "计较", "why": "So đo từng khoản thiệt hơn → 计较. 讲究 là cầu kỳ; 在乎 không có sắc thái tính toán tiền bạc."}, {"q": "她对别人怎么议论自己的穿着一点也不____，因为她觉得只要自己穿得舒服、心情愉快，就是最好的搭配。", "a": "在乎", "why": "Không bận lòng trước lời người khác (hay đi với 不) → 在乎. 计较 là so đo; 讲究 là cầu kỳ."}, {"q": "你不要太把他刚才的那句话放在心上，他说话向来直来直去，其实并没有恶意，也不会特别____你的反应。", "a": "在意", "why": "Để ý đến phản ứng của ai → 在意. 讲究 và 计较 không hợp với 反应 trong ngữ cảnh này."}]}, {"id": "bs-041", "tip": "交涉 = thương lượng, đàm phán giải quyết vấn đề (với bên kia); 交流 = trao đổi, giao lưu (thông tin, văn hóa, kinh nghiệm); 交往 = qua lại, giao du (quan hệ giữa người với người).", "table": true, "words": [{"w": "交涉", "py": "jiāoshè", "vi": "thương lượng, đàm phán", "use": "严正交涉；与对方交涉"}, {"w": "交流", "py": "jiāoliú", "vi": "trao đổi, giao lưu", "use": "文化交流；交流经验"}, {"w": "交往", "py": "jiāowǎng", "vi": "giao du, qua lại", "use": "人际交往；与人交往"}], "quiz": [{"q": "房东突然单方面提高了租金，几位租客一起去找他理论，经过几轮____，对方终于同意把涨幅降到原来的一半。", "a": "交涉", "why": "Thương lượng giải quyết tranh chấp → 交涉. 交流 và 交往 không có sắc thái tranh chấp, đàm phán."}, {"q": "每年夏天，学校都会组织师生到国外的姊妹学校进行短期访问，通过课堂旁听和座谈会，增进双方在教学方法上的____。", "a": "交流", "why": "Trao đổi, giao lưu kinh nghiệm → 交流. 交涉 là đàm phán; 交往 là qua lại giữa người với người."}, {"q": "他性格内向，从小就不善于与人____，工作后才在同事的帮助下，渐渐学会了主动打招呼、参加集体活动。", "a": "交往", "why": "Giao du với người khác → 交往. 交涉 là thương lượng; 交流 không đi với 与人 theo nghĩa này."}]}, {"id": "bs-042", "tip": "解雇 = sa thải (chủ cho nhân viên nghỉ việc); 解散 = giải tán (tổ chức, tập thể, đám đông).", "table": true, "words": [{"w": "解雇", "py": "jiěgù", "vi": "sa thải", "use": "被解雇；解雇员工"}, {"w": "解散", "py": "jiěsàn", "vi": "giải tán, giải thể", "use": "解散社团；解散人群"}], "quiz": [{"q": "这名员工因为多次泄露公司的商业机密，经过人事部门调查核实之后，被公司依法____，并且需要承担相应的责任。", "a": "解雇", "why": "Công ty cho nhân viên thôi việc → 解雇. 解散 chỉ tổ chức, đám đông."}, {"q": "演出结束后，保安人员疏导观众有序离场，不到半个小时，聚集在广场上的人群便渐渐地____了。", "a": "解散", "why": "Đám đông tản đi → 解散. 解雇 chỉ dùng với cá nhân bị cho nghỉ việc."}]}, {"id": "bs-043", "tip": "进展 = tiến triển (công việc, sự việc, đứng sau chủ ngữ); 开展 = triển khai, mở rộng (hoạt động); 发展 = phát triển (sự vật lớn mạnh, đổi thay).", "table": true, "words": [{"w": "进展", "py": "jìnzhǎn", "vi": "tiến triển", "use": "进展顺利；取得进展"}, {"w": "开展", "py": "kāizhǎn", "vi": "triển khai, tiến hành (hoạt động)", "use": "开展活动；开展调查"}, {"w": "发展", "py": "fāzhǎn", "vi": "phát triển", "use": "经济发展；事态发展"}], "quiz": [{"q": "谈判已经持续了三天，双方在关键条款上仍然存在分歧，目前还没有取得实质性的____，预计需要再举行一轮会谈。", "a": "进展", "why": "Kết quả tiến triển của công việc → 进展. 开展 là triển khai hoạt động; 发展 là phát triển lớn mạnh."}, {"q": "为了提高居民的环保意识，社区计划在下个月____一系列主题活动，包括旧物回收、垃圾分类讲座和环保手工比赛。", "a": "开展", "why": "Triển khai hoạt động → 开展. 进展 không có tân ngữ; 发展 không đi với 活动 theo nghĩa này."}, {"q": "随着互联网技术的普及，这座曾经默默无闻的小镇依靠电商和旅游，用短短十年时间便实现了经济的跨越式____。", "a": "发展", "why": "Phát triển lớn mạnh theo thời gian → 发展. 进展 chỉ tiến độ một việc cụ thể."}]}, {"id": "bs-044", "tip": "惊动 = làm kinh động, quấy rầy hoặc khiến người/cơ quan bị báo động (惊动警方, 惊动邻居); 震惊 = bị sốc mạnh, kinh ngạc tột độ (tính từ/động từ chỉ cảm xúc, 震惊世界).", "table": true, "words": [{"w": "惊动", "py": "jīngdòng", "vi": "làm kinh động, quấy rầy, khiến bị báo động", "use": "惊动警方；惊动邻居；不要惊动"}, {"w": "震惊", "py": "zhènjīng", "vi": "chấn động, vô cùng kinh ngạc", "use": "令人震惊；震惊世界；感到震惊"}], "quiz": [{"q": "半夜孩子突然发烧，他不想____正在熟睡的邻居，就悄悄背起孩子，一个人快步走向医院，一路上连脚步声都放得很轻。", "a": "惊动", "why": "Ý là sợ làm người khác bị đánh thức, quấy rầy → 惊动; 震惊 là bị sốc mạnh, không hợp với hành động nhẹ nhàng này."}, {"q": "这起造假事件被曝光后，消息很快传遍全国，公众对企业长期欺骗消费者的行为感到十分____，纷纷要求有关部门严惩责任人。", "a": "震惊", "why": "Phản ứng cảm xúc sốc, bàng hoàng của công chúng → 震惊; 惊动 là làm phiền/báo động, không dùng để chỉ cảm xúc."}]}, {"id": "bs-045", "tip": "精通 = nắm vững thấu đáo một lĩnh vực, kiến thức (精通英语, 精通业务); 擅长 = giỏi, có sở trường về việc gì (擅长游泳, 擅长沟通), nhấn mạnh năng lực chứ không nhất thiết đạt mức thông thạo.", "table": true, "words": [{"w": "精通", "py": "jīngtōng", "vi": "tinh thông, nắm vững thấu đáo", "use": "精通外语；精通业务；精通此道"}, {"w": "擅长", "py": "shàncháng", "vi": "giỏi về, có sở trường", "use": "擅长沟通；擅长绘画；擅长游泳"}], "quiz": [{"q": "经过三十多年的刻苦钻研，这位老工程师已经____了桥梁设计的各个环节，哪怕是最细小的计算失误，他也能一眼就看出来。", "a": "精通", "why": "Nhấn mạnh nắm vững thấu đáo cả một lĩnh vực, đi với 了 + tân ngữ → 精通; 擅长 không đi tự nhiên với 了 và tân ngữ kiểu này."}, {"q": "她从小在乡下长大，性格开朗热情，特别____与人打交道，所以公司派她负责客户接待，一年下来业绩在全部门名列前茅。", "a": "擅长", "why": "Chỉ sở trường làm một việc (đi với động từ 与人打交道) → 擅长; 精通 dùng cho kiến thức, kỹ thuật, không đi với cụm này."}]}, {"id": "bs-046", "tip": "觉悟 = giác ngộ, ý thức tư tưởng (danh từ); 觉醒 = thức tỉnh về ý thức (tập thể, giai cấp, bản sắc); 清醒 = tỉnh táo (sau hôn mê/đầu óc minh mẫn); 醒悟 = tỉnh ngộ, nhận ra sai lầm; 领悟 = lĩnh hội, thấu hiểu ý nghĩa.", "table": true, "words": [{"w": "觉悟", "py": "juéwù", "vi": "giác ngộ, ý thức tư tưởng", "use": "提高觉悟；有觉悟；思想觉悟"}, {"w": "觉醒", "py": "juéxǐng", "vi": "thức tỉnh (về ý thức, nhận thức)", "use": "民族觉醒；意识觉醒；开始觉醒"}, {"w": "清醒", "py": "qīngxǐng", "vi": "tỉnh táo, tỉnh lại, minh mẫn", "use": "头脑清醒；清醒过来；保持清醒"}, {"w": "醒悟", "py": "xǐngwù", "vi": "tỉnh ngộ, nhận ra sai lầm", "use": "猛然醒悟；醒悟过来；醒悟到"}, {"w": "领悟", "py": "lǐngwù", "vi": "lĩnh hội, hiểu thấu ý nghĩa", "use": "领悟真谛；领悟道理；深刻领悟"}], "quiz": [{"q": "面对村里修路需要占用自家一小块地的难题，老党员说，每个人都要有为集体着想的____，不能只盯着个人得失，大家听了都点头同意。", "a": "觉悟", "why": "Danh từ chỉ ý thức tư tưởng, tinh thần vì tập thể → 觉悟; 觉醒/醒悟 là động từ, không đứng sau 有…的 theo nghĩa này."}, {"q": "随着教育的普及，越来越多的农村妇女开始____，她们不再满足于待在家里，而是走出村子去城里打工、创业，追求独立的生活。", "a": "觉醒", "why": "Thức tỉnh ý thức về giá trị bản thân của một nhóm người → 觉醒; 醒悟 là nhận ra mình sai, còn 清醒 là tỉnh táo về thể chất."}, {"q": "手术结束后，病人在重症监护室里观察了六个小时才渐渐____过来，医生立即询问了他的姓名和住址，确认没有意识障碍。", "a": "清醒", "why": "Tỉnh lại sau mổ, trạng thái ý thức rõ ràng → 清醒; 醒悟 là tỉnh ngộ về sai lầm, không nói về tình trạng cơ thể."}, {"q": "他沉迷网络游戏整整两年，直到考试落榜、看到父母愁白了头，才____到自己错得有多离谱，下决心重新开始复习功课。", "a": "醒悟", "why": "Nhận ra sai lầm của mình sau một cú sốc → 醒悟; 领悟 là hiểu ra đạo lý/ý nghĩa chứ không hàm ý nhận lỗi."}, {"q": "老师反复讲解了好几遍，我还是没弄明白，后来在实验里亲手操作了一次，才真正____了这条物理定律所包含的深刻含义。", "a": "领悟", "why": "Hiểu thấu ý nghĩa, nguyên lý qua trải nghiệm → 领悟; 觉悟 chỉ ý thức tư tưởng, 醒悟 là nhận ra sai lầm."}]}, {"id": "bs-047", "tip": "考核 = đánh giá, kiểm tra theo tiêu chuẩn (nhân viên, thành tích); 考察 = đi khảo sát, tìm hiểu thực địa hoặc xem xét kỹ một người/sự việc; 考验 = thử thách (hoàn cảnh, biến cố thử sức con người/hệ thống).", "table": true, "words": [{"w": "考核", "py": "kǎohé", "vi": "khảo hạch, đánh giá theo tiêu chuẩn", "use": "绩效考核；通过考核；年度考核"}, {"w": "考察", "py": "kǎochá", "vi": "khảo sát thực địa, xem xét kỹ", "use": "实地考察；考察团；考察干部"}, {"w": "考验", "py": "kǎoyàn", "vi": "thử thách, sự thử sức", "use": "经受考验；严峻的考验；接受考验"}], "quiz": [{"q": "公司每季度都按统一标准对员工的业绩逐项打分、排名，这项____的结果直接决定年终奖的多少，因此大家都格外重视。", "a": "考核", "why": "Đánh giá thành tích theo tiêu chuẩn, chấm điểm xếp hạng → 考核; 考察 là đi khảo sát, 考验 là thử thách."}, {"q": "为了了解当地的投资环境，市政府组织了一个代表团，前往沿海几个城市实地____，并与当地的企业家进行了座谈和交流。", "a": "考察", "why": "Đi thực địa tìm hiểu tình hình → 考察; 考核 là chấm đánh giá nhân sự, 考验 là thử thách."}, {"q": "这场罕见的暴雨对全市的排水系统是一次严峻的____，幸好前几年刚完成了管网改造，街道上并没有出现严重的积水。", "a": "考验", "why": "Biến cố thử sức hệ thống, xem chịu được không → 考验; 考核 mang tính đánh giá theo tiêu chuẩn do người tổ chức."}]}, {"id": "bs-048", "tip": "恐怖 = đáng sợ, kinh hoàng (tính từ, cảnh vật/sự việc gây sợ); 恐惧 = nỗi sợ hãi trong lòng (cảm xúc của người); 恐怕 = phó từ 'e rằng', suy đoán điều không hay.", "table": true, "words": [{"w": "恐怖", "py": "kǒngbù", "vi": "kinh hoàng, đáng sợ", "use": "恐怖电影；恐怖气氛；恐怖袭击"}, {"w": "恐惧", "py": "kǒngjù", "vi": "sợ hãi, nỗi sợ", "use": "感到恐惧；充满恐惧；克服恐惧"}, {"w": "恐怕", "py": "kǒngpà", "vi": "e rằng, có lẽ (điều không hay)", "use": "恐怕来不及；恐怕不行；恐怕要"}], "quiz": [{"q": "这部电影的气氛非常____，漆黑的走廊、忽明忽暗的灯光和突然响起的怪声，让不少观众吓得浑身发抖，甚至有人中途就离场了。", "a": "恐怖", "why": "Miêu tả bầu không khí đáng sợ của sự vật (tính từ) → 恐怖; 恐惧 là cảm giác bên trong người, 恐怕 là phó từ suy đoán."}, {"q": "小时候被狗咬过之后，他对所有的狗都产生了深深的____，哪怕只是远远地看见一只，也会不由自主地绕道走开。", "a": "恐惧", "why": "Nỗi sợ trong lòng người (danh từ, sau 产生了深深的) → 恐惧; 恐怖 miêu tả sự vật đáng sợ, không chỉ cảm xúc."}, {"q": "天空乌云密布，风也越刮越大，看这情形，今天下午的户外运动会____要推迟了，大家最好提前做好各种应对的准备。", "a": "恐怕", "why": "Suy đoán điều không hay sắp xảy ra, đứng trước động từ → 恐怕; 恐怖/恐惧 không làm phó từ."}]}, {"id": "bs-049", "tip": "扩充 = mở rộng, bổ sung về số lượng (nhân sự, thiết bị, nội dung); 扩散 = lan rộng, khuếch tán ra xung quanh (dịch bệnh, ô nhiễm, tin tức); 扩张 = bành trướng, mở rộng phạm vi/quy mô (lãnh thổ, thế lực, doanh nghiệp).", "table": true, "words": [{"w": "扩充", "py": "kuòchōng", "vi": "mở rộng, bổ sung thêm (về số lượng)", "use": "扩充队伍；扩充内容；扩充词汇量"}, {"w": "扩散", "py": "kuòsàn", "vi": "lan rộng, khuếch tán", "use": "扩散到；迅速扩散；防止扩散"}, {"w": "扩张", "py": "kuòzhāng", "vi": "bành trướng, mở rộng phạm vi, quy mô", "use": "盲目扩张；扩张领土；扩张势力"}], "quiz": [{"q": "随着学生人数逐年增加，学校决定投资新建两栋教学楼，并大力____图书馆的藏书量，以满足师生日益增长的阅读和学习需要。", "a": "扩充", "why": "Bổ sung thêm số lượng sách → 扩充; 扩张 chỉ mở rộng thế lực/quy mô, 扩散 là lan ra."}, {"q": "由于没有及时隔离，病毒在短短几天内便迅速____到了周边的几个城市，疫情防控部门不得不紧急采取了封闭管理的措施。", "a": "扩散", "why": "Virus lan ra các khu vực xung quanh → 扩散; 扩张 là chủ động bành trướng, 扩充 là bổ sung số lượng."}, {"q": "这家连锁企业近几年依靠大量贷款疯狂____，在全国开了上千家门店，结果市场需求下降后资金链断裂，不得不宣布破产。", "a": "扩张", "why": "Doanh nghiệp mở rộng quy mô ồ ạt, hàm ý quá đà → 扩张; 扩散 là lan truyền, 扩充 mang nghĩa bổ sung nhẹ nhàng hơn."}]}, {"id": "bs-050", "tip": "谅解 = thông cảm, hiểu và bỏ qua (trang trọng, hai bên); 体谅 = thấu hiểu nỗi khó khăn của người khác; 原谅 = tha lỗi cho người đã sai; 饶恕 = tha thứ tội lỗi nặng; 迁就 = nhượng bộ theo ý người khác; 宽容 = khoan dung, độ lượng.", "table": true, "words": [{"w": "谅解", "py": "liàngjiě", "vi": "thông cảm, hiểu và bỏ qua (trang trọng)", "use": "达成谅解；取得谅解；请求谅解"}, {"w": "体谅", "py": "tǐliàng", "vi": "thấu hiểu, đặt mình vào hoàn cảnh người khác", "use": "体谅父母；体谅难处；互相体谅"}, {"w": "原谅", "py": "yuánliàng", "vi": "tha lỗi, bỏ qua lỗi lầm", "use": "请原谅；原谅他；不可原谅"}, {"w": "饶恕", "py": "ráoshù", "vi": "tha thứ (tội lỗi nặng)", "use": "饶恕罪行；饶恕罪孽；不能饶恕"}, {"w": "迁就", "py": "qiānjiù", "vi": "nhượng bộ, chiều theo", "use": "迁就别人；一味迁就；不肯迁就"}, {"w": "宽容", "py": "kuānróng", "vi": "khoan dung, độ lượng", "use": "宽容大度；宽容待人；宽容的胸怀"}], "quiz": [{"q": "劳资双方坐下来坦诚沟通，公司说明了资金周转的困难，工人们也提出了合理要求，最终达成了____，约定分三个月补发拖欠的工资。", "a": "谅解", "why": "Hai bên hiểu và thông cảm cho nhau, văn phong trang trọng → 谅解; 体谅 là đơn phương hiểu nỗi khổ, 原谅 là tha lỗi."}, {"q": "妈妈每天下班回家后还要做饭、洗衣，孩子们应该多____她的辛苦，主动承担一些力所能及的家务，而不是只顾着躺在沙发上玩手机。", "a": "体谅", "why": "Đặt mình vào hoàn cảnh để hiểu nỗi vất vả → 体谅; 原谅 dùng khi người kia có lỗi, ở đây mẹ không có lỗi."}, {"q": "他因为一时冲动在会上当众顶撞了老师，事后诚恳地道了歉，老师见他态度真诚，便大度地____了他，还鼓励他今后继续努力。", "a": "原谅", "why": "Tha lỗi cho lỗi lầm nhỏ sau khi xin lỗi → 原谅; 饶恕 dành cho tội nặng, 宽容 là phẩm chất độ lượng chung."}, {"q": "在这部小说里，主人公曾经背叛朋友并犯下无法挽回的罪行，他在临终前跪倒在教堂里，含着泪祈求上帝____自己的罪孽。", "a": "饶恕", "why": "Tha tội nặng, sắc thái tôn giáo/đạo đức → 饶恕; 原谅 dùng cho lỗi thường ngày, nhẹ hơn."}, {"q": "她从来不愿____别人，在团队讨论中总是坚持己见，哪怕大多数人都不赞成，也不肯降低要求，所以同事们都觉得和她很难合作。", "a": "迁就", "why": "Chịu hạ yêu cầu, chiều theo người khác → 迁就; 体谅 là thấu hiểu chứ không phải nhượng bộ."}, {"q": "一个成熟的人应当有____的胸怀，能够接受与自己观点不同的人，允许别人犯错和有不同的看法，这样才能营造出和谐的团队氛围。", "a": "宽容", "why": "Chỉ tấm lòng độ lượng, chấp nhận khác biệt → 宽容; 谅解/原谅 là hành động đối với một việc cụ thể, không đứng trước 的胸怀."}]}, {"id": "bs-051", "tip": "留恋 = lưu luyến, không nỡ rời (nơi chốn, quá khứ, cuộc sống); 留念 = giữ làm kỷ niệm (vật, ảnh, 合影留念); 惦记 = nhớ nhung, lo nghĩ đến người/việc ở xa.", "table": true, "words": [{"w": "留恋", "py": "liúliàn", "vi": "lưu luyến, không nỡ rời", "use": "留恋故乡；充满留恋；毫不留恋"}, {"w": "留念", "py": "liúniàn", "vi": "lưu niệm, giữ làm kỷ niệm", "use": "合影留念；作为留念；赠物留念"}, {"w": "惦记", "py": "diànjì", "vi": "nhớ nhung, canh cánh lo nghĩ", "use": "惦记着家人；总惦记；互相惦记"}], "quiz": [{"q": "毕业典礼那天，同学们都对生活了四年的校园充满了____，迟迟不肯离开，一遍遍地在教学楼和操场前拍照，同老师们依依惜别。", "a": "留恋", "why": "Không nỡ rời nơi gắn bó → 留恋; 留念 là giữ làm kỷ niệm, không đi với 充满."}, {"q": "登上山顶后，导游把大家召集到刻着山名的石碑前，拍了一张集体照作为____，说这是这次旅行中最值得珍藏的美好回忆。", "a": "留念", "why": "Ảnh chụp để làm kỷ niệm → 留念; 留恋 là cảm xúc lưu luyến, không đi sau 作为 theo nghĩa này."}, {"q": "儿子在外地工作，母亲总是____着他的身体，每次通电话都要反复叮嘱他按时吃饭，天气变冷了还要及时添加衣服，不要着凉。", "a": "惦记", "why": "Nhớ và lo cho người ở xa → 惦记; 留恋 là không nỡ rời nơi chốn, không dùng cho lo lắng sức khỏe."}]}, {"id": "bs-052", "tip": "啰唆 = dài dòng, lằng nhằng (lời nói, văn viết, người nói nhiều; cũng là tính từ); 唠叨 = càu nhàu, nói đi nói lại (thường vì quan tâm hoặc phàn nàn, có thể làm danh từ 'lời cằn nhằn').", "table": true, "words": [{"w": "啰唆", "py": "luōsuo", "vi": "dài dòng, lằng nhằng, rườm rà", "use": "说话啰唆；写得啰唆；太啰唆"}, {"w": "唠叨", "py": "láodao", "vi": "càu nhàu, nói đi nói lại", "use": "爱唠叨；母亲的唠叨；唠叨个没完"}], "quiz": [{"q": "这篇报告写得太____了，同样的意思反复说了好几遍，前后一共二十多页，其实只要三页纸就足以把整个问题讲得清清楚楚。", "a": "啰唆", "why": "Văn viết dài dòng, rườm rà → 啰唆; 唠叨 là hành vi càu nhàu của người, không dùng để chê bài viết."}, {"q": "出门前，他最怕听到母亲的____，可等他真的离开家去外地读书之后，却开始格外想念那些絮絮不休、充满关心的叮嘱。", "a": "唠叨", "why": "Danh từ 'lời cằn nhằn của mẹ' → 唠叨; 啰唆 là tính từ/động từ, không dùng làm danh từ sau 的."}]}, {"id": "bs-053", "tip": "排除 = loại trừ (khả năng, nghi ngờ, trở ngại); 开除 = đuổi việc/đuổi học; 消除 = xóa bỏ cảm giác, ảnh hưởng trừu tượng (nỗi lo, hiểu lầm); 清除 = dọn sạch vật cụ thể hoặc thứ xấu; 解除 = hủy bỏ, gỡ bỏ (hợp đồng, lệnh, quan hệ).", "table": true, "words": [{"w": "排除", "py": "páichú", "vi": "loại trừ, gạt bỏ", "use": "排除可能；排除障碍；排除嫌疑"}, {"w": "开除", "py": "kāichú", "vi": "đuổi việc, đuổi học", "use": "开除公职；被开除；开除学籍"}, {"w": "消除", "py": "xiāochú", "vi": "xóa bỏ, làm tan biến (tâm lý, ảnh hưởng)", "use": "消除疲劳；消除误会；消除隐患"}, {"w": "清除", "py": "qīngchú", "vi": "dọn sạch, thanh trừ", "use": "清除垃圾；清除障碍；清除病毒"}, {"w": "解除", "py": "jiěchú", "vi": "hủy bỏ, gỡ bỏ (hợp đồng, lệnh, quan hệ)", "use": "解除合同；解除警报；解除婚约"}], "quiz": [{"q": "警方经过反复勘查现场和调取监控录像，已经____了意外事故的可能，认定这是一起蓄意纵火案，目前正在全力追捕犯罪嫌疑人。", "a": "排除", "why": "Loại bỏ một khả năng trong điều tra → 排除; 消除/清除 dùng cho thứ cần làm tan hay dọn đi."}, {"q": "那名员工多次泄露公司的商业机密，造成了严重的经济损失，经管理层研究决定，将其立即____，并保留追究其法律责任的权利。", "a": "开除", "why": "Chấm dứt tư cách nhân viên vì vi phạm → 开除; 解除 dùng cho hợp đồng, quan hệ chứ không đi với người."}, {"q": "为了____孩子们对考试的紧张情绪，班主任在考前专门组织了一次小游戏活动，让大家在轻松愉快的氛围中放松了心情，睡了个好觉。", "a": "消除", "why": "Làm tan cảm giác trừu tượng (căng thẳng) → 消除; 清除 dành cho vật cụ thể, 解除 dành cho hợp đồng/lệnh."}, {"q": "暴雨过后，环卫工人连夜出动，把堵在路口的泥沙和断树枝全部____干净，保证了第二天清晨道路能够恢复正常的通行。", "a": "清除", "why": "Dọn sạch vật cụ thể, kèm 干净 → 清除; 消除 dùng cho thứ trừu tượng, 开除 dùng cho người."}, {"q": "这家公司因为对方多次违约，决定单方面____与它签订的供货合同，并要求对方赔偿由此造成的全部经济损失和商誉损失。", "a": "解除", "why": "Hủy bỏ hợp đồng → 解除; 排除/开除 không đi với 合同."}]}, {"id": "bs-054", "tip": "抛弃 = vứt bỏ, ruồng bỏ (người thân, thứ không cần; sắc thái nặng/tiêu cực); 放弃 = từ bỏ (ý định, quyền lợi, cuộc thi), trung tính, có thể không có tân ngữ; 舍弃 = đành bỏ đi thứ có giá trị để giữ cái quan trọng hơn.", "table": true, "words": [{"w": "抛弃", "py": "pāoqì", "vi": "vứt bỏ, ruồng bỏ", "use": "抛弃妻子；被抛弃；抛弃旧观念"}, {"w": "放弃", "py": "fàngqì", "vi": "từ bỏ, bỏ cuộc", "use": "放弃机会；中途放弃；决不放弃"}, {"w": "舍弃", "py": "shěqì", "vi": "đành bỏ đi, hy sinh (thứ có giá trị)", "use": "忍痛舍弃；舍弃小我；舍弃利益"}], "quiz": [{"q": "他在妻子最困难的时候无情地____了她和年幼的孩子，独自去了外地，从此再也没有往家里寄过一分钱，也没有回来看过一眼。", "a": "抛弃", "why": "Bỏ rơi người thân một cách vô tình → 抛弃; 放弃 trung tính, 舍弃 hàm ý hy sinh vì mục đích lớn hơn."}, {"q": "尽管比赛中途多次摔倒，她还是咬牙坚持跑完了全程，没有选择中途____，观众们被她顽强的精神感动，为她送上了热烈的掌声。", "a": "放弃", "why": "Bỏ cuộc, không có tân ngữ → 放弃; 抛弃/舍弃 bắt buộc có tân ngữ."}, {"q": "为了集中资源做好主业，这家公司忍痛____了盈利不错的房地产和餐饮业务，把全部资金投入到新能源汽车的研发和生产之中。", "a": "舍弃", "why": "Đành bỏ thứ có giá trị để dồn cho mục tiêu lớn hơn (忍痛) → 舍弃; 抛弃 mang nghĩa ruồng bỏ tiêu cực, 放弃 thiếu sắc thái hy sinh."}]}, {"id": "bs-055", "tip": "期望 = kỳ vọng, mong chờ ở người khác (danh từ/động từ); 指望 = trông cậy, dựa vào (ai/cái gì) để có kết quả; 渴望 = khao khát mãnh liệt; 企图 = mưu toan, âm mưu làm việc không tốt (sắc thái tiêu cực).", "table": true, "words": [{"w": "期望", "py": "qīwàng", "vi": "kỳ vọng, mong đợi", "use": "寄予期望；期望值；不负期望"}, {"w": "指望", "py": "zhǐwàng", "vi": "trông cậy, trông chờ vào", "use": "指望着；全靠指望；没什么指望"}, {"w": "渴望", "py": "kěwàng", "vi": "khao khát, thiết tha mong muốn", "use": "渴望自由；充满渴望；渴望成功"}, {"w": "企图", "py": "qǐtú", "vi": "mưu toan, ý đồ (thường xấu)", "use": "企图逃跑；企图掩盖；不良企图"}], "quiz": [{"q": "父母对孩子的____很高，从小就希望他能考上名牌大学，可孩子却觉得压力太大，每天闷闷不乐，学习成绩反而一路下降了。", "a": "期望", "why": "Kỳ vọng của cha mẹ đặt lên con (danh từ, 很高) → 期望; 企图 là ý đồ xấu, 指望 là trông cậy vào."}, {"q": "这个家全靠父亲一个人打工养活，母亲又长年卧病在床，弟弟妹妹还在上学，他们都____着父亲每月寄回来的那点工资勉强过日子。", "a": "指望", "why": "Dựa vào khoản tiền để sống, trông cậy → 指望; 渴望 là khao khát, 期望 không nhấn mạnh sự dựa dẫm."}, {"q": "生活在偏远山区的孩子们对外面的世界充满了____，他们常常望着远处的群山发呆，盼着有一天能够走出大山去城里读书。", "a": "渴望", "why": "Khao khát mãnh liệt đối với điều chưa có → 渴望; 企图 là mưu toan, 指望 là trông cậy."}, {"q": "犯罪嫌疑人____趁着夜色翻墙逃走，却被早已埋伏在围墙外的民警当场抓获，最后只能老老实实地交代了全部犯罪事实。", "a": "企图", "why": "Ý đồ làm việc xấu rồi thất bại → 企图; 期望/渴望 là mong muốn tích cực, không dùng cho hành vi phạm pháp."}]}, {"id": "bs-056", "tip": "牵扯 = liên lụy, dính líu, kéo theo người/việc khác vào; 牵制 = kìm hãm, ghìm chân (lực lượng, đối phương), thường dùng trong quân sự, cạnh tranh.", "table": true, "words": [{"w": "牵扯", "py": "qiānchě", "vi": "liên lụy, dính líu, kéo vào", "use": "牵扯进来；牵扯到；互相牵扯"}, {"w": "牵制", "py": "qiānzhì", "vi": "kìm hãm, ghìm chân, cầm chân", "use": "牵制敌军；互相牵制；受到牵制"}], "quiz": [{"q": "这起经济案件涉及的人员很多，不少与案子毫无关系的亲戚朋友也被____进来，接受了长时间的调查询问，承受了很大的心理压力。", "a": "牵扯", "why": "Bị kéo vào, dính líu → 牵扯; 牵制 là kìm giữ lực lượng đối phương."}, {"q": "主力部队在正面发动猛攻，另一支小分队则悄悄绕到敌军后方，____了对方的大批兵力，使他们无法及时增援前线的战友。", "a": "牵制", "why": "Ghìm chân, kìm giữ lực lượng địch → 牵制; 牵扯 là liên lụy người vô can."}]}, {"id": "bs-057", "tip": "强制 = cưỡng chế bằng quyền lực, quy định (强制执行); 勉强 = miễn cưỡng, gắng gượng hoặc ép mình; 强迫 = ép buộc ai làm điều họ không muốn.", "table": true, "words": [{"w": "强制", "py": "qiángzhì", "vi": "cưỡng chế (bằng quyền lực, pháp luật)", "use": "强制执行；强制措施；强制性"}, {"w": "勉强", "py": "miǎnqiǎng", "vi": "miễn cưỡng, gắng gượng", "use": "勉强撑着；勉强同意；勉强及格"}, {"w": "强迫", "py": "qiǎngpò", "vi": "ép buộc, bắt ép", "use": "强迫他人；被迫；强迫症"}], "quiz": [{"q": "法院依法对拒不履行判决的企业采取____执行，冻结了它的银行账户，并拍卖了部分闲置设备，用来偿还拖欠多年的债务。", "a": "强制", "why": "Cưỡng chế bằng quyền lực pháp luật → 强制; 强迫 là ép một người cụ thể trái ý họ."}, {"q": "他连续加班三天没怎么合眼，身体已经很虚弱了，但为了不耽误项目进度，还是____撑着参加了晚上的会议，会后差点晕倒在走廊里。", "a": "勉强", "why": "Gắng gượng dù đã quá sức → 勉强; 强迫/强制 là ép người khác."}, {"q": "孩子对钢琴根本不感兴趣，父母却____他每天练习三个小时，结果孩子产生了强烈的逆反心理，后来一看到琴键就大发脾气。", "a": "强迫", "why": "Cha mẹ ép con làm điều con không muốn → 强迫; 强制 mang tính cưỡng chế của quy định, 勉强 là tự gắng gượng."}]}, {"id": "bs-058", "tip": "请教 = thỉnh giáo, xin chỉ bảo (người giỏi hơn, kiến thức, kinh nghiệm); 请示 = xin chỉ thị, báo cáo xin ý kiến cấp trên trước khi quyết định.", "table": true, "words": [{"w": "请教", "py": "qǐngjiào", "vi": "thỉnh giáo, xin chỉ bảo", "use": "向老师请教；虚心请教；请教问题"}, {"w": "请示", "py": "qǐngshì", "vi": "xin chỉ thị (cấp trên)", "use": "向领导请示；请示汇报；书面请示"}], "quiz": [{"q": "遇到不懂的数学难题时，他总是主动向班上成绩最好的同学____，对方也很乐意耐心讲解，两人因此成了无话不谈的好朋友。", "a": "请教", "why": "Hỏi người giỏi hơn để học hỏi → 请教; 请示 là xin chỉ thị cấp trên."}, {"q": "这笔超出预算的开支数额较大，财务人员不敢擅自决定，只好先向上级领导书面____，等到批复下来之后才办理了付款手续。", "a": "请示", "why": "Xin ý kiến, chờ cấp trên phê duyệt → 请示; 请教 là xin chỉ bảo về kiến thức."}]}, {"id": "bs-059", "tip": "扰乱 = làm xáo trộn, gây rối (trật tự, kế hoạch, tình hình); 打扰 = làm phiền (người khác đang nghỉ ngơi, làm việc), thường dùng như lời xin lỗi lịch sự.", "table": true, "words": [{"w": "扰乱", "py": "rǎoluàn", "vi": "gây rối, làm xáo trộn", "use": "扰乱秩序；扰乱计划；扰乱视听"}, {"w": "打扰", "py": "dǎrǎo", "vi": "làm phiền, quấy rầy", "use": "打扰一下；不好意思打扰；打扰别人"}], "quiz": [{"q": "个别观众在影院里大声喧哗，严重____了正常的放映秩序，保安赶来后将他们请出了场，并提醒其他观众务必保持安静。", "a": "扰乱", "why": "Gây rối trật tự chung → 扰乱; 打扰 là làm phiền một người, không đi với 秩序."}, {"q": "我知道您最近工作很忙，本来不想____您，但这份合同明天一早就要签字，所以只好冒昧地打电话来请您抽空看一下。", "a": "打扰", "why": "Lời xin lỗi lịch sự vì làm phiền một người → 打扰; 扰乱 không dùng với người theo nghĩa này."}]}, {"id": "bs-060", "tip": "忍耐 = nhẫn nại, kiềm chế bản thân không bộc phát (thường không có tân ngữ); 忍受 = chịu đựng điều khó chịu, đau khổ (có tân ngữ); 容忍 = dung thứ, cho phép điều người khác làm dù không hài lòng.", "table": true, "words": [{"w": "忍耐", "py": "rěnnài", "vi": "nhẫn nại, kiềm chế", "use": "忍耐着；耐心忍耐；忍耐力"}, {"w": "忍受", "py": "rěnshòu", "vi": "chịu đựng (đau đớn, khó chịu)", "use": "忍受痛苦；难以忍受；忍受着"}, {"w": "容忍", "py": "róngrěn", "vi": "dung thứ, cho phép (điều không vừa ý)", "use": "不能容忍；容忍错误；容忍度"}], "quiz": [{"q": "面对同事一次又一次的无理指责，他一直____着没有发作，因为他知道，一旦吵起来，只会让整个项目的推进变得更加困难。", "a": "忍耐", "why": "Tự kiềm chế, không có tân ngữ → 忍耐; 忍受 cần có thứ bị chịu đựng, 容忍 là cho phép điều người khác làm."}, {"q": "长期生活在噪音污染严重的工厂附近，居民们每天都不得不____着震耳欲聋的机器声，很多人因此患上了失眠和耳鸣等疾病。", "a": "忍受", "why": "Chịu đựng thứ khó chịu cụ thể (机器声) → 忍受; 忍耐 không mang tân ngữ, 容忍 là dung thứ hành vi của người."}, {"q": "这位老师对学生的要求十分严格，课堂上绝不____任何作弊行为，一旦发现，不管成绩多好，都要通报批评并取消考试资格。", "a": "容忍", "why": "Không cho phép hành vi sai trái của người khác → 容忍; 忍受 là chịu đựng đau khổ chứ không phải cho phép."}]}, {"id": "bs-061", "tip": "散布 = tung, rải tin đồn/thông tin xấu; 散发 = phát tán, toả ra (tờ rơi, mùi, nhiệt); 传播 = truyền bá, lan truyền rộng (văn hoá, tri thức, bệnh).", "table": true, "words": [{"w": "散布", "py": "sànbù", "vi": "tung, rải (tin đồn, lời đồn)", "use": "散布谣言；散布消息；散布在各地"}, {"w": "散发", "py": "sànfā", "vi": "phát (tờ rơi); toả ra (mùi, nhiệt)", "use": "散发传单；散发香味；散发热量"}, {"w": "传播", "py": "chuánbō", "vi": "truyền bá, lan truyền", "use": "传播知识；传播文化；病毒传播"}], "quiz": [{"q": "有人在网络上故意____谣言，说这家企业即将倒闭，导致不少客户纷纷提出退款。", "a": "散布", "why": "散布 đi với 谣言 (tin đồn xấu). 传播 trung tính, thường đi với văn hoá, tri thức; 散发 là phát tờ rơi hoặc toả mùi."}, {"q": "志愿者们走上街头，向过往的行人____宣传单，呼吁大家保护环境、减少使用塑料袋。", "a": "散发", "why": "散发 + 传单 = phát tờ rơi. 散布 chỉ dùng cho tin đồn, tin tức; 传播 không đi với việc phát tờ giấy."}, {"q": "互联网的普及让各种新知识能够以前所未有的速度____到世界各个角落，改变了人们的学习方式。", "a": "传播", "why": "传播 = lan truyền rộng, đi với 知识. 散布 mang sắc thái xấu (tin đồn), 散发 là toả ra hoặc phát cho từng người."}]}, {"id": "bs-062", "tip": "审查 = xem xét, thẩm tra (hồ sơ, nội dung); 审理 = xét xử/thụ lý vụ án (quá trình); 审判 = phiên xét xử và tuyên án, nhấn vào việc kết tội.", "table": true, "words": [{"w": "审查", "py": "shěnchá", "vi": "thẩm tra, kiểm duyệt", "use": "审查资格；严格审查；审查书稿"}, {"w": "审理", "py": "shěnlǐ", "vi": "xét xử, thụ lý (vụ án)", "use": "审理案件；公开审理；依法审理"}, {"w": "审判", "py": "shěnpàn", "vi": "xét xử và tuyên án", "use": "审判战犯；公正审判；审判长"}], "quiz": [{"q": "出版社在书稿正式印刷之前，必须交由专门机构进行严格的____，确认内容没有违规之处。", "a": "审查", "why": "审查 = thẩm tra, kiểm tra hồ sơ/nội dung. 审理 và 审判 chỉ dùng cho tòa án với vụ án."}, {"q": "法院已经受理了这起合同纠纷，并将在三个月内____完毕，当事人不必担心案件被无限期拖延。", "a": "审理", "why": "审理 = quá trình thụ lý, xét xử vụ việc cụ thể, hay đi với 案件. 审查 là xem xét hồ sơ, 审判 nhấn mạnh việc tuyên án."}, {"q": "战争结束后，国际法庭对多名战犯进行了公正的____，让受害者终于看到了迟来的正义。", "a": "审判", "why": "审判 = xét xử và tuyên án, hợp với 战犯. 审查 không dùng cho tội phạm; 审理 thiên về thủ tục xử vụ việc dân sự, kinh tế."}]}, {"id": "bs-063", "tip": "施加 = gây, đặt lên (áp lực, ảnh hưởng); 施展 = thi triển, phát huy (tài năng, thủ đoạn); 实施 = thực thi (chính sách, kế hoạch).", "table": true, "words": [{"w": "施加", "py": "shījiā", "vi": "gây, đặt lên (áp lực, ảnh hưởng)", "use": "施加压力；施加影响"}, {"w": "施展", "py": "shīzhǎn", "vi": "thi triển, phát huy", "use": "施展才华；施展本领；施展手段"}, {"w": "实施", "py": "shíshī", "vi": "thực thi, đưa vào thực hiện", "use": "实施计划；全面实施；开始实施"}], "quiz": [{"q": "不少家长无意中给孩子____了过大的压力，使孩子对学习产生了强烈的抵触情绪。", "a": "施加", "why": "施加 + 压力 là cụm quen thuộc. 施展 dành cho tài năng, 实施 dành cho chính sách, kế hoạch."}, {"q": "这位年轻的厨师在比赛现场充分____自己的才华，赢得了评委们一致的好评和观众热烈的掌声。", "a": "施展", "why": "施展 + 才华/本领 = phát huy tài năng. 施加 phải có đối tượng bị tác động như áp lực; 实施 không đi với 才华."}, {"q": "政府决定从下个月起全面____新的环保政策，对违规排放污水的企业将予以重罚。", "a": "实施", "why": "实施 = đưa chính sách vào thực hiện. 施加 và 施展 không đi với 政策."}]}, {"id": "bs-064", "tip": "损坏 = làm hỏng, hư hại vật cụ thể; 破坏 = phá hoại, làm tổn hại (cả vật cụ thể lẫn trừu tượng như môi trường, quan hệ, hoà bình).", "table": true, "words": [{"w": "损坏", "py": "sǔnhuài", "vi": "làm hỏng, hư hại (đồ vật)", "use": "损坏设备；严重损坏；零件损坏"}, {"w": "破坏", "py": "pòhuài", "vi": "phá hoại, làm tổn hại", "use": "破坏环境；破坏团结；故意破坏"}], "quiz": [{"q": "这批货物在运输途中因包装不严而受到挤压，部分精密零件已经被____，无法继续使用。", "a": "损坏", "why": "损坏 chỉ hư hại vật cụ thể, thường là do vô ý. 破坏 hàm ý chủ động, cố ý phá, không hợp với hỏng do chèn ép khi vận chuyển."}, {"q": "施工单位为了赶进度而违规作业，严重____了当地的生态环境和居民原有的平静生活。", "a": "破坏", "why": "破坏 dùng được với đối tượng trừu tượng như 生态环境, 生活. 损坏 chỉ dùng với đồ vật cụ thể."}]}, {"id": "bs-065", "tip": "挑剔 = xoi mói, kén chọn; 挑拨 = xúi giục gây chia rẽ giữa người với người; 挑衅 = cố tình khiêu khích để gây xung đột.", "table": true, "words": [{"w": "挑剔", "py": "tiāoti", "vi": "xoi mói, kén chọn", "use": "挑剔的顾客；过分挑剔；爱挑剔"}, {"w": "挑拨", "py": "tiǎobō", "vi": "xúi giục, gây chia rẽ", "use": "挑拨离间；挑拨关系"}, {"w": "挑衅", "py": "tiǎoxìn", "vi": "khiêu khích, gây hấn", "use": "公然挑衅；挑衅行为；军事挑衅"}], "quiz": [{"q": "他对生活要求极高，无论是饭菜还是衣服都格外____，让身边的人常常感到压力很大。", "a": "挑剔", "why": "挑剔 = kén chọn, bới lông tìm vết trong chuyện sinh hoạt, đồ dùng. 挑拨 là xúi giục chia rẽ, 挑衅 là gây hấn, đều không phải tính cách kén chọn."}, {"q": "有人在同事之间散布流言，故意____他们的关系，想让大家互相猜疑，彼此不再信任。", "a": "挑拨", "why": "挑拨 hay đi với 关系, 离间 (chia rẽ người với người). 挑衅 là khiêu khích trực tiếp một đối phương, 挑剔 là bắt bẻ."}, {"q": "对方球员多次在场上做出不友好的动作公然____，但我方队员始终保持冷静，没有还击。", "a": "挑衅", "why": "挑衅 = cố tình khiêu khích để gây xung đột, hợp với hành động trên sân. 挑拨 phải có ba bên, 挑剔 là soi mói."}]}, {"id": "bs-066", "tip": "停顿 = ngừng lại tạm thời giữa chừng (lời nói, hoạt động); 停止 = dừng hẳn, chấm dứt; 停滞 = trì trệ, không tiến triển (kinh tế, p
