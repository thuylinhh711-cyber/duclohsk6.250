hát triển).", "table": true, "words": [{"w": "停顿", "py": "tíngdùn", "vi": "ngừng lại một lúc", "use": "稍作停顿；停顿片刻；毫不停顿"}, {"w": "停止", "py": "tíngzhǐ", "vi": "dừng hẳn, ngừng", "use": "停止生产；停止营业；停止前进"}, {"w": "停滞", "py": "tíngzhì", "vi": "trì trệ, đình đọng", "use": "停滞不前；经济停滞；发展停滞"}], "quiz": [{"q": "他讲到这里突然____了几秒，环顾四周，似乎在等待听众理解自己刚才那句话的含义。", "a": "停顿", "why": "停顿 = ngừng tạm giữa chừng rồi tiếp tục. 停止 là dừng hẳn, 停滞 nói về sự phát triển trì trệ."}, {"q": "由于资金链断裂，这家工厂不得不宣布从下周起全面____生产，所有工人暂时回家休息。", "a": "停止", "why": "停止 = dừng hẳn một hoạt động, đi với 生产. 停顿 chỉ nghỉ ngắn, 停滞 là trì trệ, không đi với 全面."}, {"q": "多年来该地区经济一直____不前，年轻人纷纷外出打工，村里只剩下老人和孩子。", "a": "停滞", "why": "停滞不前 là cụm quen: kinh tế, phát triển không tiến triển. 停顿 và 停止 không đứng trước 不前."}]}, {"id": "bs-067", "tip": "挽救 = cứu vãn (tình thế, sinh mệnh, hôn nhân, quan hệ); 补救 = khắc phục, bù đắp sai sót sau khi xảy ra; 抢救 = cấp cứu gấp gáp (người, tài sản bị nguy).", "table": true, "words": [{"w": "挽救", "py": "wǎnjiù", "vi": "cứu vãn, cứu lấy", "use": "挽救生命；挽救局面；挽救婚姻"}, {"w": "补救", "py": "bǔjiù", "vi": "khắc phục, sửa chữa sai sót", "use": "采取补救措施；及时补救；无法补救"}, {"w": "抢救", "py": "qiǎngjiù", "vi": "cấp cứu, cứu gấp", "use": "抢救伤员；紧急抢救；抢救文物"}], "quiz": [{"q": "医护人员连夜____了那位遭遇车祸的伤者，终于把他从死亡线上拉了回来，家属感激不已。", "a": "抢救", "why": "抢救 = cấp cứu khẩn cấp trong tình huống nguy kịch. 挽救 mang nghĩa cứu vãn tình thế chung, 补救 là sửa sai."}, {"q": "这家企业已经陷入严重亏损，管理层试图通过大规模重组来____濒临破产的局面，但效果并不明显。", "a": "挽救", "why": "挽救 + 局面 = cứu vãn tình thế nguy ngập. 抢救 thiên về cấp cứu gấp người/vật, 补救 là sửa sai sót đã xảy ra."}, {"q": "发现数据录入出现错误后，他立刻采取了一系列措施加以____，才没有给客户造成实际损失。", "a": "补救", "why": "补救 = khắc phục lỗi sau khi sai sót đã xảy ra, hay đi với 措施. 抢救 chỉ dùng cho người/vật đang nguy kịch."}]}, {"id": "bs-068", "tip": "污蔑 = bôi nhọ, vu khống bằng lời nói không có căn cứ; 诬陷 = bịa chứng cứ để buộc tội người khác; 陷害 = dùng thủ đoạn hại người; 诽谤 = phỉ báng, thuật ngữ pháp lý.", "table": true, "words": [{"w": "污蔑", "py": "wūmiè", "vi": "bôi nhọ, vu khống", "use": "污蔑他人；恶意污蔑；被污蔑为"}, {"w": "诬陷", "py": "wūxiàn", "vi": "vu cáo, hãm hại bằng chứng giả", "use": "诬陷好人；诬陷同事；遭到诬陷"}, {"w": "陷害", "py": "xiànhài", "vi": "hãm hại (bằng mưu kế)", "use": "陷害他人；设计陷害；被人陷害"}, {"w": "诽谤", "py": "fěibàng", "vi": "phỉ báng, nói xấu làm tổn hại danh dự", "use": "诽谤他人；诽谤罪；恶意诽谤"}], "quiz": [{"q": "这位老教授一生清廉，却被一些人____为收受贿赂，这样的说法毫无根据，严重损害了他的名誉。", "a": "污蔑", "why": "被污蔑为… = bị bôi nhọ thành…, nhấn vào việc làm mất thanh danh bằng lời. 诬陷 và 陷害 không đi theo cấu trúc 为 này."}, {"q": "为了抢夺升职的机会，他伪造了证据，____同事挪用公款，使对方险些被开除。", "a": "诬陷", "why": "诬陷 = bịa chuyện, giả mạo chứng cứ để buộc tội người vô tội. 污蔑 chỉ là nói xấu, không có hành vi làm giả chứng cứ."}, {"q": "那个团伙设下圈套，一步步把他引入赌局，最后成功____了他，让他背上了巨额债务。", "a": "陷害", "why": "陷害 = dùng mưu kế đẩy người khác vào cảnh bất lợi. 诬陷 là vu cáo, 污蔑 chỉ là nói xấu, không dính đến việc giăng bẫy."}, {"q": "根据法律规定，捏造事实____他人并造成严重后果的，将依法追究其刑事责任。", "a": "诽谤", "why": "诽谤 là thuật ngữ pháp lý (tội phỉ báng), hay đi với 他人, 罪. 陷害 là hại người bằng mưu kế, không nói đến việc bịa chuyện làm hại danh dự."}]}, {"id": "bs-069", "tip": "误解 = hiểu sai ý nghĩa, quan điểm (thường kéo dài, mang tính nhận thức); 误会 = hiểu lầm nhất thời, thường giữa hai người (có thể làm danh từ hoặc động từ).", "table": true, "words": [{"w": "误解", "py": "wùjiě", "vi": "hiểu sai, hiểu lầm sâu", "use": "产生误解；消除误解；深深的误解"}, {"w": "误会", "py": "wùhuì", "vi": "hiểu lầm (nhất thời, giữa người với người)", "use": "一场误会；别误会；产生误会"}], "quiz": [{"q": "很多人对这位作家的作品存在____，以为他只写爱情故事，其实他的创作题材相当广泛。", "a": "误解", "why": "误解 = hiểu sai về bản chất một đối tượng (tác phẩm, quan điểm). 误会 thường là sự hiểu lầm nhất thời giữa hai người."}, {"q": "我昨天没接你的电话是因为手机没电了，并不是故意躲着你，希望你不要产生____。", "a": "误会", "why": "误会 = hiểu lầm tình huống giữa người với người, dễ giải thích. 误解 thiên về hiểu sai sâu hơn, mang tính nhận thức."}, {"q": "两个人因为一句玩笑话闹了点小____，不过很快就当面说清楚，重新和好了。", "a": "误会", "why": "一场小误会 là cách nói quen, hiểu lầm nhỏ giữa người với người. 误解 nghe nặng hơn và ít đi với 小."}]}, {"id": "bs-070", "tip": "吸取 = rút ra, tiếp thu (kinh nghiệm, bài học, dưỡng chất trừu tượng); 吸收 = hấp thụ (nước, chất dinh dưỡng, tiếp nhận kiến thức, nhân sự mới).", "table": true, "words": [{"w": "吸取", "py": "xīqǔ", "vi": "rút ra, tiếp thu (bài học, kinh nghiệm)", "use": "吸取教训；吸取经验；吸取营养"}, {"w": "吸收", "py": "xīshōu", "vi": "hấp thụ; tiếp nhận", "use": "吸收水分；吸收知识；吸收新成员"}], "quiz": [{"q": "公司管理层认真总结了上一次失败的经验，决心____教训，避免在同样的地方再次出错。", "a": "吸取", "why": "吸取教训 là cụm cố định: rút bài học. 吸收 thiên về hấp thụ vật chất hoặc tiếp nhận người, kiến thức."}, {"q": "植物的根系不仅能够____土壤中的水分，还能固定土壤，防止雨水冲刷造成水土流失。", "a": "吸收", "why": "吸收 = hấp thụ nước, chất dinh dưỡng bằng cơ chế vật lý, sinh học. 吸取 dùng cho bài học, kinh nghiệm."}]}, {"id": "bs-071", "tip": "熏陶 = hun đúc, ảnh hưởng lâu dài và tích cực (văn hoá, môi trường, nghệ thuật); 影响 = ảnh hưởng, tác động (tốt hay xấu, ngắn hay dài).", "table": true, "words": [{"w": "熏陶", "py": "xūntáo", "vi": "hun đúc, thấm nhuần dần", "use": "受到熏陶；艺术熏陶；潜移默化的熏陶"}, {"w": "影响", "py": "yǐngxiǎng", "vi": "ảnh hưởng, tác động", "use": "影响很大；影响到；受…的影响"}], "quiz": [{"q": "他从小在书香门第中长大，长期受到传统文化的____，说话做事都带着一种温文尔雅的气质。", "a": "熏陶", "why": "熏陶 = chịu ảnh hưởng tích cực, thấm dần theo năm tháng từ văn hoá, môi trường. 影响 chung chung hơn, không nhất thiết lâu dài và tốt."}, {"q": "这场突如其来的暴雨对城市交通造成了很大的____，不少地铁线路被迫临时停运。", "a": "影响", "why": "影响 trung tính, đi được với tác động xấu như đình trệ giao thông. 熏陶 chỉ dùng cho tác động tốt, lâu dài."}, {"q": "这条新规定将____到几百万外来务工人员的生活，所以出台之前政府广泛征求了各方意见。", "a": "影响", "why": "影响到 + đối tượng = tác động đến. 熏陶 không đi với 到 theo nghĩa này và mang sắc thái tích cực, không hợp với quy định mới."}]}, {"id": "bs-072", "tip": "压缩 = nén, cắt giảm (số lượng, chi phí, dung lượng); 压抑 = đè nén, ngột ngạt (cảm xúc, không khí); 压制 = áp chế, dùng sức mạnh kìm hãm (ý kiến, đối thủ).", "table": true, "words": [{"w": "压缩", "py": "yāsuō", "vi": "nén, cắt giảm", "use": "压缩开支；压缩篇幅；压缩文件"}, {"w": "压抑", "py": "yāyì", "vi": "đè nén, ngột ngạt (cảm xúc)", "use": "心情压抑；压抑情绪；气氛压抑"}, {"w": "压制", "py": "yāzhì", "vi": "áp chế, kìm hãm bằng sức mạnh", "use": "压制批评；压制不同意见；被压制"}], "quiz": [{"q": "为了降低成本，公司决定大幅____管理部门的人员编制，并取消一些不必要的开支项目。", "a": "压缩", "why": "压缩 = cắt giảm quy mô, chi phí, số lượng. 压抑 là cảm xúc bị đè nén, 压制 là dùng sức mạnh để kìm."}, {"q": "长期生活在沉闷的环境里，他的情绪越来越____，常常一个人坐着发呆，连话也不想说。", "a": "压抑", "why": "压抑 = tâm trạng ngột ngạt, bí bách (hay làm vị ngữ chỉ cảm xúc). 压缩 là cắt giảm, 压制 cần có chủ thể bên ngoài dùng quyền lực."}, {"q": "当局动用强力手段____不同的声音，结果只会让民众的不满情绪越积越深，最终集中爆发出来。", "a": "压制", "why": "压制 = áp chế ý kiến của người khác bằng quyền lực. 压抑 là tự đè nén bên trong, 压缩 không đi với 声音."}]}, {"id": "bs-073", "tip": "延伸 = kéo dài, mở rộng ra (không gian, phạm vi); 延续 = tiếp diễn, kéo dài (thời gian, truyền thống, sinh mệnh).", "table": true, "words": [{"w": "延伸", "py": "yánshēn", "vi": "kéo dài, vươn ra (không gian, phạm vi)", "use": "向远方延伸；延伸到；向…领域延伸"}, {"w": "延续", "py": "yánxù", "vi": "tiếp nối, kéo dài (thời gian)", "use": "延续传统；延续生命；延续至今"}], "quiz": [{"q": "这条铁路从市中心出发，一直向西北方向____，穿过戈壁和沙漠，最终到达边境小城。", "a": "延伸", "why": "延伸 = kéo dài về không gian (đường, sông, dãy núi). 延续 chỉ kéo dài về thời gian."}, {"q": "这座古老的庙会已经____了近千年，每年春节都会吸引数十万游客前来烧香祈福。", "a": "延续", "why": "延续 = tiếp diễn qua thời gian (传统, 习俗). 延伸 dành cho không gian, không đi với 千年."}, {"q": "他的研究成果不仅局限于医学领域，还不断向环境科学和人工智能等相关领域____。", "a": "延伸", "why": "延伸 cũng dùng với phạm vi, lĩnh vực mở rộng ra. 延续 chỉ kéo dài theo thời gian, không phải mở rộng sang lĩnh vực khác."}]}, {"id": "bs-074", "tip": "掩盖 = che đậy (sự thật, mâu thuẫn, mùi); 掩饰 = che giấu tâm trạng, sai sót bằng vẻ ngoài; 掩护 = yểm hộ, che chắn cho người/hành động (quân sự).", "table": true, "words": [{"w": "掩盖", "py": "yǎngài", "vi": "che đậy, bao phủ", "use": "掩盖真相；掩盖矛盾；掩盖不住"}, {"w": "掩饰", "py": "yǎnshì", "vi": "che giấu, ngụy trang bằng vẻ ngoài", "use": "掩饰不安；难以掩饰；欲盖弥彰的掩饰"}, {"w": "掩护", "py": "yǎnhù", "vi": "yểm hộ, che chắn", "use": "在…的掩护下；掩护战友；夜色掩护"}], "quiz": [{"q": "他故意大声说笑，想借此____内心的紧张和不安，可微微颤抖的手还是出卖了他。", "a": "掩饰", "why": "掩饰 + 情绪/不安 = giả vờ để che đi cảm xúc thật. 掩盖 thiên về sự thật, vấn đề; 掩护 là che chắn cho người."}, {"q": "无论企业如何包装宣传，都不可能永远____产品存在严重质量问题的事实，真相迟早会被曝光。", "a": "掩盖", "why": "掩盖 + 事实/真相 = che đậy sự thật. 掩饰 thiên về vẻ ngoài, tâm trạng; 掩护 là hỗ trợ che chắn."}, {"q": "夜色的____下，侦察兵悄悄接近了敌人的营地，没有惊动任何一名哨兵。", "a": "掩护", "why": "在…的掩护下 là cấu trúc cố định: dưới sự che chắn của. 掩盖 và 掩饰 không đi theo cấu trúc này."}]}, {"id": "bs-075", "tip": "依靠 = dựa vào (người, sức lực, điều kiện) để sống, làm việc; 依赖 = ỷ lại, phụ thuộc (hay mang sắc thái tiêu cực); 依托 = lấy làm chỗ dựa, nền tảng (địa thế, nguồn lực).", "table": true, "words": [{"w": "依靠", "py": "yīkào", "vi": "dựa vào, nhờ vào", "use": "依靠自己；依靠养老金；互相依靠"}, {"w": "依赖", "py": "yīlài", "vi": "ỷ lại, phụ thuộc", "use": "依赖手机；过分依赖；产生依赖"}, {"w": "依托", "py": "yītuō", "vi": "dựa vào làm nền tảng, chỗ dựa", "use": "依托优势；依托…而建；有所依托"}], "quiz": [{"q": "这位孤身一人的老人没有子女，只能____每月微薄的养老金勉强维持生活，日子过得十分艰难。", "a": "依靠", "why": "依靠 = dựa vào nguồn sống để tồn tại. 依赖 hàm ý ỷ lại không tốt, 依托 là lấy làm nền tảng cho một dự án."}, {"q": "如今许多年轻人过于____手机导航，离开了它就连回家的路都不太敢走，方向感越来越差。", "a": "依赖", "why": "依赖 = phụ thuộc quá mức, thường mang sắc thái tiêu cực (过于依赖). 依靠 trung tính, 依托 không dùng cho thói quen."}, {"q": "该度假村____背后的千年古镇而建，游客可以在这里同时体验自然风光和传统文化。", "a": "依托", "why": "依托…而建 = lấy cái có sẵn làm nền tảng để xây dựng. 依靠 và 依赖 không hợp với cấu trúc 而建."}]}, {"id": "bs-076", "tip": "隐蔽 = ẩn nấp, kín đáo (động từ không có tân ngữ hoặc tính từ); 隐瞒 = giấu giếm sự thật; 隐藏 = cất giấu, giấu đi (vật, cảm xúc).", "table": true, "words": [{"w": "隐蔽", "py": "yǐnbì", "vi": "ẩn nấp, kín đáo", "use": "就地隐蔽；隐蔽的地方；注意隐蔽"}, {"w": "隐瞒", "py": "yǐnmán", "vi": "giấu giếm (sự thật, bệnh tình)", "use": "隐瞒真相；隐瞒病情；毫不隐瞒"}, {"w": "隐藏", "py": "yǐncáng", "vi": "cất giấu, che giấu", "use": "隐藏起来；隐藏身份；深深隐藏"}], "quiz": [{"q": "战士们趁着夜色，把电台和武器____在茂密的树林深处，等待天亮之后再转移阵地。", "a": "隐藏", "why": "隐藏 có tân ngữ (把…隐藏在…) = cất giấu vật. 隐蔽 là động từ không có tân ngữ, 隐瞒 chỉ giấu sự thật."}, {"q": "医生要求患者如实讲述病情，千万不要____症状，否则很可能耽误诊断甚至危及生命。", "a": "隐瞒", "why": "隐瞒 + 病情/症状/真相 = giấu giếm sự thật không cho người khác biết. 隐藏 là cất giấu vật hoặc thân phận."}, {"q": "接到空袭警报后，居民们迅速躲进地下室，士兵们则在附近的树丛里就地____，等待上级命令。", "a": "隐蔽", "why": "就地隐蔽 là cụm quen: tại chỗ ẩn nấp để tránh bị phát hiện, không có tân ngữ. 隐藏 phải có tân ngữ, 隐瞒 không dùng cho hành động trốn."}]}, {"id": "bs-077", "tip": "预料 = dự đoán, liệu trước (sự việc sẽ xảy ra); 意料 = điều đã dự tính, hay dùng trong 出乎意料; 预期 = dự kiến, mong đợi (mục tiêu, kết quả).", "table": true, "words": [{"w": "预料", "py": "yùliào", "vi": "dự đoán, liệu trước", "use": "难以预料；预料到；事先预料"}, {"w": "意料", "py": "yìliào", "vi": "dự tính, liệu trước (trong 出乎意料)", "use": "出乎意料；意料之中；意料之外"}, {"w": "预期", "py": "yùqī", "vi": "dự kiến, kỳ vọng", "use": "预期目标；达到预期；预期效果"}], "quiz": [{"q": "谁也没有____到，这个名不见经传的小球队居然能一路闯进决赛，并最终夺得了冠军。", "a": "预料", "why": "预料到 = đoán trước được (động từ). 意料 là danh từ nằm trong cụm 出乎意料, 预期 là kỳ vọng."}, {"q": "出乎大家的____，那位一向沉默寡言的新同事竟然在年会上唱了一首歌，赢得了满堂喝彩。", "a": "意料", "why": "出乎意料 là cụm cố định (ngoài dự tính). 预料 là động từ dự đoán, 预期 là kỳ vọng nên không dùng trong cụm này."}, {"q": "今年的销售业绩远远超过了公司最初设定的____目标，管理层决定给全体员工发放额外奖金。", "a": "预期", "why": "预期目标 = mục tiêu dự kiến. 预料 là động từ không làm định ngữ trực tiếp, 意料 không đi với 目标."}]}, {"id": "bs-078", "tip": "冤枉 = oan, bị đổ oan (vô tội mà bị trách, bị nghi); 委屈 = ấm ức, tủi thân (bị đối xử không công bằng, cảm giác trong lòng).", "table": true, "words": [{"w": "冤枉", "py": "yuānwàng", "vi": "oan uổng; đổ oan cho người vô tội", "use": "被冤枉；冤枉好人；觉得冤枉"}, {"w": "委屈", "py": "wěiqu", "vi": "ấm ức, tủi thân", "use": "受委屈；感到委屈；委屈地哭了"}], "quiz": [{"q": "明明是同伴打碎了花瓶，老师却批评了他，他觉得自己被____了，站在原地一句话也说不出来。", "a": "冤枉", "why": "被冤枉 = bị đổ oan cho điều mình không làm. 委屈 là cảm giác ấm ức, không đi với 被…了 để chỉ hành động bị đổ oan."}, {"q": "孩子辛辛苦苦做完了家务，母亲不但没夸奖，反而责备他做得不够好，他心里十分____，眼泪忍不住掉了下来。", "a": "委屈", "why": "委屈 = tủi thân vì công sức không được ghi nhận. 冤枉 nhấn vào việc bị đổ oan, không phải nỗi buồn vì không được công nhận."}]}, {"id": "bs-079", "tip": "赞同 = tán đồng, đồng ý với ý kiến, quan điểm; 赞扬 = ca ngợi, khen ngợi người hoặc hành vi tốt.", "table": true, "words": [{"w": "赞同", "py": "zàntóng", "vi": "tán đồng, đồng tình (với ý kiến)", "use": "表示赞同；完全赞同；不太赞同"}, {"w": "赞扬", "py": "zànyáng", "vi": "khen ngợi, ca ngợi", "use": "受到赞扬；公开赞扬；赞扬他的勇气"}], "quiz": [{"q": "对于这项改革方案，大多数代表表示____，只有少数人担心实施过程中可能出现新的问题。", "a": "赞同", "why": "赞同 = đồng ý với phương án, quan điểm. 赞扬 là khen người, hành vi, không dùng cho việc đồng thuận một phương án."}, {"q": "市长在大会上公开____了那位救火英雄的勇敢行为，号召全市市民向他学习。", "a": "赞扬", "why": "赞扬 = khen ngợi hành vi tốt, đối tượng là người hoặc việc làm. 赞同 chỉ là đồng ý, không có nghĩa tuyên dương."}, {"q": "我完全____你的看法，不过在具体做法上，我们还需要再讨论一下，听听其他人的意见。", "a": "赞同", "why": "赞同 + 看法 = đồng ý với quan điểm. 赞扬 là khen ngợi, không hợp với việc bàn bạc cách làm."}]}, {"id": "bs-080", "tip": "遭受 = chịu (tổn thất, thiên tai, đả kích) kéo dài hoặc nặng nề; 遭遇 = gặp phải (chuyện bất ngờ, thường xấu); 遭殃 = gặp tai ương (không có tân ngữ).", "table": true, "words": [{"w": "遭受", "py": "zāoshòu", "vi": "chịu, gánh (tổn thất, đả kích)", "use": "遭受损失；遭受打击；遭受灾害"}, {"w": "遭殃", "py": "zāoyāng", "vi": "gặp tai ương, bị hại", "use": "最先遭殃；遭殃的是…；老百姓遭殃"}, {"w": "遭遇", "py": "zāoyù", "vi": "gặp phải (chuyện bất ngờ, thường xấu)", "use": "遭遇挫折；遭遇暴雨；不幸的遭遇"}], "quiz": [{"q": "这家企业因判断失误而____了巨额经济损失，不得不裁掉近三分之一的员工。", "a": "遭受", "why": "遭受 + 损失/打击 = phải chịu thiệt hại. 遭遇 là gặp phải một sự việc, 遭殃 không có tân ngữ nên không đi với 损失."}, {"q": "他在回家途中突然____了一场大雨，浑身湿透，只好在路边的小店里躲雨。", "a": "遭遇", "why": "遭遇 + sự việc bất ngờ (một trận mưa, một vụ tai nạn). 遭受 nhấn vào việc chịu đựng tổn hại, nặng hơn."}, {"q": "每次洪水来临，最先____的总是住在河边的穷人，他们的房屋往往一夜之间就被冲毁。", "a": "遭殃", "why": "遭殃 là nội động từ, không mang tân ngữ, = gặp tai ương. 遭受 và 遭遇 phải có tân ngữ phía sau."}]}, {"id": "bs-081", "tip": "照料 = chăm lo cụ thể sinh hoạt hằng ngày (người bệnh, trẻ nhỏ, cây trồng, gia súc); 照顾 = chăm sóc, quan tâm đến, ưu tiên cho; 照应 = chiếu cố, giúp đỡ lẫn nhau (bạn bè, đồng hương).", "table": true, "words": [{"w": "照料", "py": "zhàoliào", "vi": "chăm lo, trông nom cụ thể", "use": "照料病人；精心照料；照料家畜"}, {"w": "照顾", "py": "zhàogù", "vi": "chăm sóc; chiếu cố, quan tâm đến", "use": "照顾老人；照顾到；特别照顾"}, {"w": "照应", "py": "zhàoyìng", "vi": "chiếu cố, giúp đỡ lẫn nhau", "use": "互相照应；多加照应；有人照应"}], "quiz": [{"q": "农场的几十头奶牛都由老张一个人____，他每天凌晨四点就起床喂食、挤奶，十几年如一日。", "a": "照料", "why": "照料 = chăm lo cụ thể việc ăn uống, sinh hoạt của gia súc, người bệnh. 照应 là giúp đỡ lẫn nhau, 照顾 rộng hơn và có thêm nghĩa ưu tiên."}, {"q": "会议安排得很周到，既要____到老年代表的身体状况，又要让年轻代表有充分发言的机会。", "a": "照顾", "why": "照顾到 = quan tâm đến, tính đến hoàn cảnh của người khác. 照料 là chăm lo cụ thể sinh hoạt, 照应 là giúp đỡ giữa bạn bè."}, {"q": "两位老乡在异地创业，平时互相____，遇到困难总能第一时间伸出援手。", "a": "照应", "why": "互相照应 là cụm quen: giúp đỡ nhau giữa người cùng cảnh ngộ. 照料 mang nghĩa chăm lo người yếu thế, không hợp với quan hệ ngang hàng."}]}, {"id": "bs-082", "tip": "珍惜 = trân trọng, quý trọng (động từ, hành động giữ gìn); 珍贵 = quý giá (tính từ, bản thân vật có giá trị lớn).", "table": true, "words": [{"w": "珍惜", "py": "zhēnxī", "vi": "trân trọng, quý trọng", "use": "珍惜时间；珍惜机会；珍惜友谊"}, {"w": "珍贵", "py": "zhēnguì", "vi": "quý giá, quý hiếm", "use": "珍贵的文物；珍贵的礼物；十分珍贵"}], "quiz": [{"q": "青春一去不复返，希望你们能够____在校园里度过的每一天，不要等到毕业后才后悔当初的虚度。", "a": "珍惜", "why": "珍惜 là động từ, có tân ngữ: biết quý trọng. 珍贵 là tính từ, không mang tân ngữ."}, {"q": "这批出土的文物年代久远，保存完好，对研究古代社会生活具有极其____的历史价值。", "a": "珍贵", "why": "珍贵 = quý giá, làm định ngữ cho 价值. 珍惜 là động từ, không thể bổ nghĩa cho danh từ theo cách này."}, {"q": "他从小家境贫寒，所以格外____来之不易的上学机会，每天都是第一个到教室、最后一个离开。", "a": "珍惜", "why": "珍惜 + 机会 = biết trân trọng cơ hội. 珍贵 chỉ miêu tả giá trị, không biểu thị thái độ của chủ thể."}]}, {"id": "bs-083", "tip": "斟酌 = cân nhắc kỹ từng chi tiết (câu chữ, điều khoản); 思索 = suy nghĩ tìm tòi, thường mô tả dáng vẻ; 琢磨 = nghiền ngẫm, nghĩ đi nghĩ lại (khẩu ngữ); 思考 = suy nghĩ có hệ thống (vấn đề lớn, trừu tượng).", "table": true, "words": [{"w": "斟酌", "py": "zhēnzhuó", "vi": "cân nhắc, châm chước từng chi tiết", "use": "反复斟酌；斟酌字句；值得斟酌"}, {"w": "思索", "py": "sīsuǒ", "vi": "suy nghĩ tìm tòi, trầm ngâm", "use": "陷入思索；低头思索；思索着"}, {"w": "琢磨", "py": "zuómo", "vi": "nghiền ngẫm, nghĩ đi nghĩ lại (khẩu ngữ)", "use": "琢磨半天；琢磨不透；仔细琢磨"}, {"w": "思考", "py": "sīkǎo", "vi": "suy nghĩ, tư duy có hệ thống", "use": "独立思考；深入思考；思考问题"}], "quiz": [{"q": "这份合同涉及金额巨大，每个条款他都反复____，生怕有半点疏漏给公司带来损失。", "a": "斟酌", "why": "斟酌 = cân nhắc cẩn thận từng chi tiết như điều khoản, câu chữ. 思考 chung hơn, 琢磨 là khẩu ngữ nghĩ miên man."}, {"q": "他站在窗前凝视着远方，____着该如何向父母解释自己辞职的决定，神情显得十分凝重。", "a": "思索", "why": "思索着 + vẻ trầm ngâm, tìm cách giải quyết. 斟酌 cần đối tượng cụ thể để cân nhắc, 思考 thiên về suy nghĩ có hệ thống."}, {"q": "我____了一晚上，也没弄明白他那句话到底是什么意思，他是在夸我，还是在讽刺我？", "a": "琢磨", "why": "琢磨 là khẩu ngữ, nghĩ đi nghĩ lại để hiểu ý, hay đi với 不透, 半天. 斟酌 và 思考 mang sắc thái trang trọng hơn."}, {"q": "哲学的任务就是引导人们对生命的意义和人类的未来进行深入的____，而不是简单地给出答案。", "a": "思考", "why": "进行思考 = suy nghĩ có hệ thống về vấn đề lớn, trừu tượng. 琢磨 là khẩu ngữ, 斟酌 là cân nhắc chi tiết cụ thể."}]}, {"id": "bs-084", "tip": "征服 = chinh phục (thiên nhiên, đối thủ, lòng người); 制服 = khuất phục, khống chế bằng sức mạnh (người, thú dữ).", "table": true, "words": [{"w": "征服", "py": "zhēngfú", "vi": "chinh phục", "use": "征服高峰；征服观众；征服世界"}, {"w": "制服", "py": "zhìfú", "vi": "khống chế, khuất phục", "use": "制服歹徒；制服野兽；将其制服"}], "quiz": [{"q": "这位登山家历经三年准备，终于____了那座从未有人成功攀登过的雪山，创造了新的纪录。", "a": "征服", "why": "征服 = chinh phục (núi cao, thiên nhiên). 制服 là khống chế bằng vũ lực, thường dùng cho người hoặc thú dữ."}, {"q": "歹徒持刀闯入银行，几名保安冲上前去，经过一番搏斗，终于将其____并交给了警方。", "a": "制服", "why": "制服 = dùng sức mạnh khống chế đối phương, hay đi với 歹徒. 征服 mang nghĩa chinh phục lớn lao, không hợp với việc bắt kẻ cướp."}, {"q": "他那精彩绝伦的演讲____了在场的所有听众，大家起立鼓掌，久久不愿离去。", "a": "征服", "why": "征服 cũng có nghĩa chinh phục lòng người, khiến người ta khâm phục. 制服 là dùng sức mạnh, không dùng cho khán giả."}]}, {"id": "bs-085", "tip": "指定 = chỉ định (người, thời gian, địa điểm cụ thể); 指令 = mệnh lệnh, chỉ lệnh (từ cấp trên hoặc lệnh máy tính); 指示 = chỉ thị, chỉ đạo (của lãnh đạo).", "table": true, "words": [{"w": "指定", "py": "zhǐdìng", "vi": "chỉ định (người, nơi, thời gian)", "use": "指定地点；指定时间；指定人选"}, {"w": "指令", "py": "zhǐlìng", "vi": "chỉ lệnh, mệnh lệnh", "use": "下达指令；操作指令；执行指令"}, {"w": "指示", "py": "zhǐshì", "vi": "chỉ thị, chỉ đạo", "use": "领导指示；作出指示；听从指示"}], "quiz": [{"q": "比赛前，组委会要求所有参赛选手必须在____的时间内到达现场，迟到者将被取消比赛资格。", "a": "指定", "why": "指定 + 时间/地点 = chỉ định rõ ràng cụ thể. 指令 và 指示 là danh từ chỉ lệnh, không đứng trước 的时间 theo nghĩa này."}, {"q": "程序运行时，电脑会按照用户输入的____逐步执行各项操作，任何一步出错都会导致任务失败。", "a": "指令", "why": "指令 là lệnh cụ thể cho máy móc, hay đi với 操作, 执行. 指示 là chỉ thị của lãnh đạo bằng lời hoặc văn bản."}, {"q": "领导对这项工作作出了重要____，强调必须把群众的利益放在第一位，不得敷衍了事。", "a": "指示", "why": "作出指示 = lãnh đạo đưa ra chỉ đạo mang tính định hướng. 指令 mang tính lệnh cụ thể, 指定 là động từ."}]}, {"id": "bs-086", "tip": "转移 = chuyển dịch (vật, người, sự chú ý) từ nơi này sang nơi khác; 转折 = bước ngoặt (danh từ, hoặc quan hệ chuyển ý); 扭转 = xoay chuyển (tình thế bất lợi); 周转 = luân chuyển (vốn, hàng hoá); 周折 = trắc trở, vòng vèo.", "table": true, "words": [{"w": "转移", "py": "zhuǎnyí", "vi": "chuyển dịch, dời đi", "use": "转移注意力；转移阵地；转移资金"}, {"w": "转折", "py": "zhuǎnzhé", "vi": "bước ngoặt, chuyển hướng", "use": "人生转折；转折点；出现转折"}, {"w": "扭转", "py": "niǔzhuǎn", "vi": "xoay chuyển (tình thế)", "use": "扭转局面；扭转颓势；扭转观念"}, {"w": "周转", "py": "zhōuzhuǎn", "vi": "luân chuyển (vốn, hàng hoá)", "use": "资金周转；周转不灵；加快周转"}, {"w": "周折", "py": "zhōuzhé", "vi": "trắc trở, rắc rối", "use": "几经周折；颇费周折；一番周折"}], "quiz": [{"q": "为了避免火势蔓延，消防员迅速将仓库里的易燃物品____到了安全地带，同时疏散了周围的居民。", "a": "转移", "why": "转移 + 到… = chuyển vật hoặc người sang nơi khác. 周转 là luân chuyển vốn, hàng hoá; 扭转 là xoay chuyển tình thế."}, {"q": "这场比赛在下半场出现了戏剧性的____，落后三分的球队连得十分，最终反败为胜。", "a": "转折", "why": "出现转折 = xuất hiện bước ngoặt (danh từ). 扭转 là động từ, cần có tân ngữ như 局面; 周折 là sự trắc trở, không phải bước ngoặt."}, {"q": "在教练的调整下，球队终于____了连续失利的不利局面，重新回到了积分榜前列。", "a": "扭转", "why": "扭转 + 局面/颓势 = xoay chuyển tình thế bất lợi. 转移 là dời chỗ, 转折 là danh từ chỉ bước ngoặt."}, {"q": "这家小公司账上现金不足，无法维持正常的资金____，只能向银行申请短期贷款来应急。", "a": "周转", "why": "资金周转 là cụm cố định: vòng quay vốn. 转移 là dời vốn sang nơi khác, không phải vòng quay lưu thông."}, {"q": "办理这张证件花了不少时间，几经____才终于拿到手，让他深深体会到办事的不易。", "a": "周折", "why": "几经周折 = trải qua nhiều trắc trở. 转折 là bước ngoặt, 周转 là luân chuyển vốn, không đi với 几经."}]}, {"id": "bs-087", "tip": "遵循 = noi theo nguyên tắc, quy luật, phương hướng; 遵照 = làm đúng theo chỉ thị, lời dặn cụ thể; 遵守 = giữ đúng pháp luật, quy tắc, kỷ luật.", "table": true, "words": [{"w": "遵循", "py": "zūnxún", "vi": "noi theo, tuân theo (nguyên tắc, quy luật)", "use": "遵循规律；遵循原则"}, {"w": "遵照", "py": "zūnzhào", "vi": "làm đúng theo (chỉ thị, lời dặn)", "use": "遵照指示；遵照医嘱"}, {"w": "遵守", "py": "zūnshǒu", "vi": "tuân thủ (luật, quy định, kỷ luật)", "use": "遵守法律；遵守纪律"}], "quiz": [{"q": "科学研究必须____客观规律，不能凭主观愿望随意下结论，否则再精密的实验也会得出错误的结果。", "a": "遵循", "why": "Đối tượng là 规律 (quy luật) → 遵循. 遵守 dùng cho luật lệ, kỷ luật; 遵照 dùng cho chỉ thị cụ thể."}, {"q": "护士____医生的嘱咐，每隔四小时为病人测一次体温，并认真记录在病历上。", "a": "遵照", "why": "Làm đúng theo lời dặn cụ thể của bác sĩ → 遵照. 遵循 thiên về nguyên tắc chung, không đi với một lời dặn."}, {"q": "无论身份高低，每一位乘客都应当____公共场所的秩序，不能因为赶时间就随意插队。", "a": "遵守", "why": "Trật tự, quy tắc công cộng là thứ phải giữ → 遵守. 遵照 cần chỉ thị cụ thể từ cấp trên."}]}, {"id": "bs-088", "tip": "比方 = ví dụ, ví như (hay dùng 打比方 / 比方说); 比喻 = biện pháp ví von, so sánh tu từ hoặc động từ \"ví … như\".", "table": true, "words": [{"w": "比方", "py": "bǐfang", "vi": "ví dụ, ví như", "use": "打比方；比方说"}, {"w": "比喻", "py": "bǐyù", "vi": "ví von, so sánh (tu từ)", "use": "比喻的手法；比喻成"}], "quiz": [{"q": "很多职业都需要不断学习，____说医生，几乎每年都要接触新的疗法和药物，必须随时更新知识。", "a": "比方", "why": "比方说 = ví dụ như, dùng để đưa ví dụ. 比喻说 không phải cách nói quen thuộc."}, {"q": "诗人常用____的手法，把短暂的人生写成一条奔向大海的河流，读来既形象又有韵味。", "a": "比喻", "why": "Nói về thủ pháp tu từ → 比喻. 比方 chỉ là ví dụ minh họa, không gọi là thủ pháp."}]}, {"id": "bs-089", "tip": "弊端 = mặt hại sinh ra từ một chế độ, cách làm (hay đi với 带来/显现/克服); 弊病 = chỗ hỏng, vấn đề trong công việc, quản lý (hay đi với 存在/根治).", "table": true, "words": [{"w": "弊病", "py": "bìbìng", "vi": "tệ nạn, chỗ hỏng trong công việc, quản lý", "use": "管理弊病；根治弊病"}, {"w": "弊端", "py": "bìduān", "vi": "mặt hại, điểm bất cập của chế độ/cách làm", "use": "制度弊端；带来弊端"}], "quiz": [{"q": "这项制度实行多年后，其带来的____逐渐显现：基层干部为了完成指标，不得不虚报数据。", "a": "弊端", "why": "带来 + 显现: hậu quả xấu do chế độ gây ra → 弊端. 弊病 không đi với 带来."}, {"q": "要想根治教育中的____，光靠增加投入还不够，必须先改变唯分数论的评价方式。", "a": "弊病", "why": "根治 (chữa tận gốc) đi với 弊病 như bệnh. 弊端 ít đi với 根治."}]}, {"id": "bs-090", "tip": "边疆 = vùng biên cương xa xôi của đất nước; 边界 = đường ranh giới (cả nghĩa bóng); 边境 = khu vực sát biên giới; 边缘 = rìa, mép.", "table": true, "words": [{"w": "边疆", "py": "biānjiāng", "vi": "vùng biên cương", "use": "开发边疆；建设边疆"}, {"w": "边界", "py": "biānjiè", "vi": "ranh giới, đường biên", "use": "划分边界；学科边界"}, {"w": "边境", "py": "biānjìng", "vi": "khu vực biên giới", "use": "边境贸易；边境口岸"}, {"w": "边缘", "py": "biānyuán", "vi": "rìa, mép; bên lề", "use": "处于边缘；边缘地带"}], "quiz": [{"q": "上世纪五十年代，许多年轻人响应号召，告别家乡来到遥远的____，在荒漠中建起了第一座农场。", "a": "边疆", "why": "Vùng đất xa xôi của đất nước cần khai phá → 边疆. 边境 chỉ khu vực sát biên giới, không nói đến \"xây dựng\"."}, {"q": "随着技术的发展，不同学科之间的____变得越来越模糊，跨领域合作已成为常态。", "a": "边界", "why": "Ranh giới trừu tượng giữa các ngành → 边界. 边缘 là rìa, không nói \"học thuật mờ ranh\"."}, {"q": "为了防止疫情传入，这个国家暂时关闭了____口岸，所有入境的货车都要接受严格检查。", "a": "边境", "why": "Khu vực/cửa khẩu sát biên giới → 边境. 边疆 là vùng xa rộng lớn, không đi với 口岸."}, {"q": "他因为性格孤僻，在班级里一直被排挤在集体的____，很少有人主动找他聊天。", "a": "边缘", "why": "Bị đẩy ra \"bên lề\" tập thể → 边缘. 边界 là đường phân chia, không hợp."}]}, {"id": "bs-091", "tip": "变故 = biến cố bất ngờ, thường là chuyện không may; 变迁 = đổi thay lớn trải qua thời gian dài; 变化 = thay đổi nói chung.", "table": true, "words": [{"w": "变故", "py": "biàngù", "vi": "biến cố (bất ngờ, thường xấu)", "use": "家庭变故；遭遇变故"}, {"w": "变迁", "py": "biànqiān", "vi": "biến thiên, đổi thay lớn theo thời gian", "use": "历史变迁；沧桑变迁"}, {"w": "变化", "py": "biànhuà", "vi": "thay đổi, biến hóa", "use": "发生变化；明显变化"}], "quiz": [{"q": "家里突然遭遇了一场____，父亲病倒、母亲失业，原本安稳的生活一下子变得艰难。", "a": "变故", "why": "Chuyện không may bất ngờ → 变故. 变化 quá trung tính, 变迁 phải là quá trình dài."}, {"q": "这座老城几十年的____，不仅体现在高楼取代了平房，也体现在居民生活方式的转变。", "a": "变迁", "why": "Đổi thay lớn kéo dài nhiều thập niên → 变迁. 变故 là biến cố bất ngờ."}, {"q": "医生说，他的病情在最近一周内出现了明显的____，各项指标都比之前好转了不少。", "a": "变化", "why": "Chỉ sự thay đổi nói chung → 变化. 变迁 không dùng cho bệnh tình trong một tuần."}]}, {"id": "bs-092", "tip": "标记 = dấu hiệu (danh từ) hoặc đánh dấu (động từ); 标志 = biểu tượng, mốc đánh dấu (hay đi với 着); 记号 = dấu riêng đơn giản, khẩu ngữ.", "table": true, "words": [{"w": "标记", "py": "biāojì", "vi": "đánh dấu; dấu hiệu", "use": "做标记；标记出来"}, {"w": "标志", "py": "biāozhì", "vi": "biểu tượng; đánh dấu một mốc", "use": "城市的标志；标志着"}, {"w": "记号", "py": "jìhao", "vi": "ký hiệu, dấu hiệu đơn giản (khẩu ngữ)", "use": "做个记号；刻记号"}], "quiz": [{"q": "请用红笔把文中的生词____出来，下节课我们将逐一讲解，并让大家造句练习。", "a": "标记", "why": "Dùng làm động từ \"đánh dấu ra\" → 标记. 记号 chỉ là danh từ; 标志 không đi với 出来 theo nghĩa này."}, {"q": "这条高速公路的全线通车，____着该地区的交通网络进入了一个全新的阶段。", "a": "标志", "why": "标志着 = đánh dấu một mốc lớn. 标记 và 记号 không dùng cấu trúc này."}, {"q": "小时候我和弟弟在院子的树干上刻了个____，约定等长大后再回来比一比谁长得高。", "a": "记号", "why": "Dấu khắc đơn giản mang tính cá nhân, khẩu ngữ → 记号. 标志 là biểu tượng mang tính chính thức."}]}, {"id": "bs-093", "tip": "财富 = của cải, giá trị (cả tinh thần); 财产 = tài sản có thể sở hữu, pháp lý; 财务 = công việc tiền nong, sổ sách của đơn vị; 财政 = tài chính nhà nước.", "table": true, "words": [{"w": "财富", "py": "cáifù", "vi": "của cải, tài phú", "use": "创造财富；精神财富"}, {"w": "财产", "py": "cáichǎn", "vi": "tài sản", "use": "共同财产；财产继承"}, {"w": "财务", "py": "cáiwù", "vi": "tài vụ, công việc tiền nong của đơn vị", "use": "财务报表；财务经理"}, {"w": "财政", "py": "cáizhèng", "vi": "tài chính (nhà nước)", "use": "财政收入；财政预算"}], "quiz": [{"q": "对于这位老教授来说，真正的____不是银行里的存款，而是几十年来培养出的一批批优秀学生。", "a": "财富", "why": "Giá trị rộng, có cả nghĩa tinh thần → 财富. 财产 chỉ thứ sở hữu cụ thể về pháp lý."}, {"q": "法院判决，在离婚时夫妻双方共同拥有的房产和存款属于共同____，应当平分。", "a": "财产", "why": "Nhà, tiền gửi thuộc sở hữu về mặt pháp lý → 财产. 财富 không dùng trong phán quyết."}, {"q": "公司新聘了一位会计专业的经理，专门负责审核各部门的____报表，防止出现账目混乱。", "a": "财务", "why": "Sổ sách, báo cáo của công ty → 财务. 财政 là tài chính nhà nước."}, {"q": "受经济下行影响，该市今年的____收入大幅减少，不得不压缩部分公共项目的预算。", "a": "财政", "why": "Thu nhập ngân sách của thành phố → 财政. 财务 chỉ dùng cho doanh nghiệp, đơn vị."}]}, {"id": "bs-094", "tip": "差别 = khác nhau về tính chất; 差距 = khoảng cách chênh lệch về trình độ, mức độ; 距离 = khoảng cách không gian, thời gian.", "table": true, "words": [{"w": "差别", "py": "chābié", "vi": "khác biệt", "use": "没有差别；差别很大"}, {"w": "差距", "py": "chājù", "vi": "khoảng cách chênh lệch (trình độ, mức độ)", "use": "缩小差距；存在差距"}, {"w": "距离", "py": "jùlí", "vi": "cự ly, khoảng cách", "use": "路程距离；保持距离"}], "quiz": [{"q": "这两款手机在外观上几乎没有____，但价格却相差一千多元，让不少消费者感到困惑。", "a": "差别", "why": "So sánh sự khác nhau về đặc điểm bên ngoài → 差别. 差距 là chênh lệch về trình độ, mức độ."}, {"q": "尽管他每天坚持练习，可与专业运动员相比，两人的水平仍存在很大的____，需要更长时间追赶。", "a": "差距", "why": "Chênh lệch về trình độ → 差距. 距离 chỉ khoảng cách vật lý."}, {"q": "从学校到医院的____并不远，步行十分钟就能到，所以家长不必担心孩子上学的安全。", "a": "距离", "why": "Khoảng cách địa lý → 距离. 差距 và 差别 không nói về quãng đường."}]}, {"id": "bs-095", "tip": "场合 = hoàn cảnh, dịp (xã giao); 场面 = cảnh tượng, quang cảnh sự việc; 场所 = nơi chốn, địa điểm dùng cho hoạt động.", "table": true, "words": [{"w": "场合", "py": "chǎnghé", "vi": "dịp, hoàn cảnh xã giao", "use": "正式场合；公共场合"}, {"w": "场面", "py": "chǎngmiàn", "vi": "cảnh tượng, quang cảnh", "use": "热闹的场面；感人场面"}, {"w": "场所", "py": "chǎngsuǒ", "vi": "nơi chốn, địa điểm", "use": "娱乐场所；公共场所"}], "quiz": [{"q": "参加葬礼这样严肃的____，穿着花哨的衣服会被认为是对逝者不尊重，也容易引起他人反感。", "a": "场合", "why": "Dịp trang trọng, cần cư xử phù hợp → 场合. 场所 chỉ nơi chốn vật lý."}, {"q": "比赛结束时，球迷们齐声高唱队歌，那热烈感人的____让在场的每一个人都热泪盈眶。", "a": "场面", "why": "Cảnh tượng diễn ra trước mắt → 场面. 场合 là dịp, không dùng để miêu tả cảnh."}, {"q": "新规定要求，医院、学校等人员密集的____必须配备消毒设备，并定期检查防疫措施的落实情况。", "a": "场所", "why": "Các địa điểm cụ thể như bệnh viện, trường học → 场所. 场合 là dịp, không phải nơi."}]}, {"id": "bs-096", "tip": "风气 = nếp, phong khí của xã hội/tập thể; 风味 = hương vị đặc trưng (món ăn, địa phương); 风土 = khí hậu, đất đai và phong tục địa phương.", "table": true, "words": [{"w": "风气", "py": "fēngqì", "vi": "phong khí, nếp xã hội", "use": "社会风气；学习风气"}, {"w": "风味", "py": "fēngwèi", "vi": "phong vị, hương vị đặc trưng", "use": "地方风味；风味小吃"}, {"w": "风土", "py": "fēngtǔ", "vi": "phong thổ, khí hậu và tục lệ địa phương", "use": "风土人情"}], "quiz": [{"q": "近年来，学校大力提倡勤俭节约，同学们之间攀比名牌的____终于有所好转，浪费现象也减少了。", "a": "风气", "why": "Nếp chung của tập thể, có thể tốt hoặc xấu → 风气. 风味 chỉ hương vị."}, {"q": "这家小店的牛肉面带着浓郁的地方____，汤头鲜美，吸引了许多慕名而来的外地游客。", "a": "风味", "why": "Hương vị đặc trưng của món ăn → 风味. 风气 và 风土 không nói về mùi vị."}, {"q": "这位旅行作家走遍西北，用文字记录下当地独特的气候、地貌与____，让读者仿佛亲身感受到那片土地的气息。", "a": "风土", "why": "Khí hậu, địa mạo, phong tục của một vùng → 风土. 风气 là nếp xã hội, không đi cùng khí hậu địa mạo."}]}, {"id": "bs-097", "tip": "高峰 = đỉnh cao (số lượng, mức độ, giờ cao điểm); 高潮 = cao trào của sự kiện, câu chuyện, phong trào.", "table": true, "words": [{"w": "高峰", "py": "gāofēng", "vi": "đỉnh cao, cao điểm", "use": "上下班高峰；攀登高峰"}, {"w": "高潮", "py": "gāocháo", "vi": "cao trào", "use": "迎来高潮；掀起高潮"}], "quiz": [{"q": "每天早晚上下班的____时段，地铁里挤满了人，想找个座位几乎是不可能的事情。", "a": "高峰", "why": "Giờ cao điểm → 高峰. 高潮 chỉ cao trào của diễn biến, không đi với 时段 giao thông."}, {"q": "电影的情节一步步推进，直到最后十分钟才迎来____，主角终于揭开了隐藏多年的真相。", "a": "高潮", "why": "Cao trào của cốt truyện → 高潮. 高峰 chỉ mức độ đỉnh, không nói về tình tiết."}]}, {"id": "bs-098", "tip": "功效 = công hiệu vốn có của thuốc, sản phẩm; 成效 = hiệu quả, thành quả đạt được từ công việc, hành động.", "table": true, "words": [{"w": "功效", "py": "gōngxiào", "vi": "công hiệu", "use": "药物功效；神奇的功效"}, {"w": "成效", "py": "chéngxiào", "vi": "thành hiệu, hiệu quả đạt được", "use": "成效显著；取得成效"}], "quiz": [{"q": "这种草药在民间被认为具有清热解毒的____，但是否真的有效，还需要临床研究来验证。", "a": "功效", "why": "Tác dụng vốn có của thuốc → 功效. 成效 là kết quả của công việc."}, {"q": "经过三年的综合治理，当地的空气质量明显改善，环保工作取得了显著的____。", "a": "成效", "why": "Kết quả của một công tác → 成效. 功效 chỉ tác dụng của vật."}]}, {"id": "bs-099", "tip": "规定 = điều quy định cụ thể; 规范 = chuẩn mực, hoặc làm cho đúng chuẩn; 规划 = quy hoạch dài hạn; 规章 = hệ thống quy tắc của tổ chức.", "table": true, "words": [{"w": "规定", "py": "guīdìng", "vi": "quy định", "use": "明文规定；有关规定"}, {"w": "规范", "py": "guīfàn", "vi": "quy phạm, chuẩn mực; chuẩn hóa", "use": "行业规范；规范市场"}, {"w": "规划", "py": "guīhuà", "vi": "quy hoạch, lập kế hoạch dài hạn", "use": "城市规划；职业规划"}, {"w": "规章", "py": "guīzhāng", "vi": "quy chương, điều lệ", "use": "规章制度；遵守规章"}], "quiz": [{"q": "学校明文____，学生在考试期间不得携带任何通讯设备入场，违者按作弊处理。", "a": "规定", "why": "Động từ \"quy định rõ\" một điều cụ thể → 规定. 规划 là lên kế hoạch, 规章 là danh từ."}, {"q": "为了____网络直播行业，相关部门出台了新办法，要求主播必须实名认证并接受内容审核。", "a": "规范", "why": "Làm cho lĩnh vực đi vào chuẩn → 规范. 规定 không đi với tân ngữ \"ngành\"."}, {"q": "市政府正在____未来十年的城市交通，打算新建三条地铁线路并改造老旧的公交系统。", "a": "规划", "why": "Lập kế hoạch dài hạn cho tương lai → 规划. 规范 và 规定 không có nghĩa này."}, {"q": "这家企业建立了一整套____，涵盖考勤、奖惩、保密等方面，员工必须逐条遵守。", "a": "规章", "why": "Hệ thống điều lệ của tổ chức → 规章. 规定 là điều khoản đơn lẻ."}]}, {"id": "bs-100", "tip": "过失 = sơ suất, lỗi do vô ý (hay gặp trong pháp lý); 失误 = sai sót trong thao tác, thi đấu; 错误 = sai, lỗi nói chung, có thể do nhận thức.", "table": true, "words": [{"w": "过失", "py": "guòshī", "vi": "sơ suất, lỗi lầm do vô ý", "use": "过失犯罪；工作过失"}, {"w": "失误", "py": "shīwù", "vi": "sai sót, lỡ tay", "use": "操作失误；防守失误"}, {"w": "错误", "py": "cuòwù", "vi": "sai lầm, lỗi", "use": "犯错误；错误的数据"}], "quiz": [{"q": "法院认定，这起事故是由于司机疲劳驾驶、疏忽大意而造成的，并非有意伤害他人，应按____犯罪处理。", "a": "过失", "why": "Lỗi vô ý, thuật ngữ pháp lý → 过失. 失误 và 错误 không đi với 犯罪."}, {"q": "这场比赛本来稳操胜券，可惜后卫在最后时刻出现了一次防守____，被对方抓住机会打入一球。", "a": "失误", "why": "Lỡ tay trong thi đấu → 失误. 错误 nặng hơn, thiên về sai lầm nhận thức."}, {"q": "他在论文中引用了不实的数据，导致整个结论站不住脚，他决定公开承认自己的____，并重新做实验。", "a": "错误", "why": "Sai lầm nói chung, cần thừa nhận → 错误. 失误 chỉ lỡ tay nhỏ, 过失 thiên về pháp lý."}]}, {"id": "bs-101", "tip": "机遇 = cơ hội thuận lợi mang tính hoàn cảnh, thường có cả thách thức; 时机 = thời điểm thích hợp để hành động.", "table": true, "words": [{"w": "机遇", "py": "jīyù", "vi": "cơ ngộ, dịp may", "use": "把握机遇；难得的机遇"}, {"w": "时机", "py": "shíjī", "vi": "thời cơ, thời điểm thích hợp", "use": "等待时机；抓住时机"}], "quiz": [{"q": "对年轻人来说，这个行业的快速发展既带来了挑战，也提供了难得的____，值得全力一搏。", "a": "机遇", "why": "Cơ hội lớn gắn với hoàn cảnh, đi đôi với 挑战 → 机遇. 时机 là thời điểm cụ thể."}, {"q": "他想向老板提出加薪，却一直在等待一个合适的____，最后选在公司刚签下大单的那天开口。", "a": "时机", "why": "Thời điểm thích hợp để làm một việc → 时机. 机遇 không nói \"đợi\" một thời điểm."}]}, {"id": "bs-102", "tip": "见解 = quan điểm, ý kiến riêng về sự việc; 见闻 = điều mắt thấy tai nghe, kiến văn.", "table": true, "words": [{"w": "见解", "py": "jiànjiě", "vi": "kiến giải, quan điểm", "use": "独到的见解；提出见解"}, {"w": "见闻", "py": "jiànwén", "vi": "kiến văn, điều thấy nghe", "use": "旅途见闻；增长见闻"}], "quiz": [{"q": "在讨论会上，这位年轻学者对城市交通问题提出了独到的____，赢得了在场专家的称赞。", "a": "见解", "why": "Quan điểm cá nhân đã suy nghĩ → 见解. 见闻 chỉ điều đã thấy nghe."}, {"q": "旅途中的各种____，从当地集市到节日习俗，都被他一一写进了游记里，读来十分生动。", "a": "见闻", "why": "Những điều mắt thấy tai nghe khi đi → 见闻. 见解 là ý kiến, không phải điều quan sát."}]}, {"id": "bs-103", "tip": "交易 = mua bán, giao dịch cụ thể; 贸易 = hoạt động thương mại quy mô lớn, giữa các nước, ngành.", "table": true, "words": [{"w": "交易", "py": "jiāoyì", "vi": "giao dịch", "use": "完成交易；交易记录"}, {"w": "贸易", "py": "màoyì", "vi": "mậu dịch, thương mại", "use": "对外贸易；贸易往来"}], "quiz": [{"q": "两人在咖啡馆里谈妥了价格，当场完成了这笔二手车____，各自满意地离开。", "a": "交易", "why": "Một thương vụ cụ thể giữa hai người → 交易. 贸易 là thương mại quy mô lớn."}, {"q": "两国近年来不断扩大双边____规模，今年上半年进出口总额已经超过去年全年的一半。", "a": "贸易", "why": "Thương mại giữa hai quốc gia, có con số xuất nhập khẩu → 贸易. 交易 là một lần giao dịch."}]}, {"id": "bs-104", "tip": "结局 = kết cục cuối cùng của câu chuyện, sự việc (thường mang cảm xúc); 结果 = kết quả, cả của nguyên nhân và thí nghiệm.", "table": true, "words": [{"w": "结局", "py": "jiéjú", "vi": "kết cục", "use": "悲惨的结局；大团圆结局"}, {"w": "结果", "py": "jiéguǒ", "vi": "kết quả", "use": "实验结果；检查结果"}], "quiz": [{"q": "这部小说的____出人意料，原本被认为是反派的人物最终牺牲自己，保护了主人公。", "a": "结局", "why": "Phần kết của câu chuyện → 结局. 结果 chỉ kết quả nói chung, ít dùng cho cốt truyện."}, {"q": "经过反复实验，研究人员得到了与预期完全相反的____，于是决定重新检查实验设计。", "a": "结果", "why": "Kết quả thí nghiệm → 结果. 结局 dùng cho số phận, diễn biến cuối."}]}, {"id": "bs-105", "tip": "局面 = cục diện của một sự việc, tình thế cụ thể; 局势 = tình hình chính trị, quân sự, xã hội mang tính tổng thể.", "table": true, "words": [{"w": "局面", "py": "júmiàn", "vi": "cục diện, tình thế", "use": "打破局面；僵持的局面"}, {"w": "局势", "py": "júshì", "vi": "cục thế, tình hình (chính trị, quân sự)", "use": "局势紧张；国际局势"}], "quiz": [{"q": "经过三轮谈判，双方终于打破了僵持不下的____，同意先暂停诉讼，再商讨赔偿的方案。", "a": "局面", "why": "Tình thế bế tắc của cuộc thương lượng → 局面. 局势 thiên về chính trị, quân sự tổng thể."}, {"q": "联合国安理会召开紧急会议，讨论该地区日益紧张的____，呼吁各方保持克制，避免冲突升级。", "a": "局势", "why": "Tình hình chính trị khu vực → 局势. 局面 là cục diện của một việc cụ thể."}]}, {"id": "bs-106", "tip": "来历 = lai lịch, xuất xứ của người/vật; 来源 = nguồn (thông tin, thu nhập); 根源 = nguyên nhân gốc của vấn đề; 起源 = nguồn gốc ban đầu của sự vật, văn hóa.", "table": true, "words": [{"w": "来历", "py": "láilì", "vi": "lai lịch, xuất xứ", "use": "来历不明；弄清来历"}, {"w": "来源", "py": "láiyuán", "vi": "nguồn gốc, nguồn", "use": "资料来源；收入来源"}, {"w": "根源", "py": "gēnyuán", "vi": "căn nguyên, gốc rễ", "use": "问题的根源；社会根源"}, {"w": "起源", "py": "qǐyuán", "vi": "khởi nguồn", "use": "文明起源；生命起源"}], "quiz": [{"q": "警方正在调查这批文物的____，因为卖家既拿不出收藏证明，也说不清是从哪里得来的。", "a": "来历", "why": "Lai lịch, xuất xứ của một món đồ → 来历. 来源 là nguồn thông tin, thu nhập."}, {"q": "写论文时，所有引用的资料都必须标明____，否则可能被认定为抄袭，影响论文的可信度。", "a": "来源", "why": "Nguồn trích dẫn tư liệu → 来源. 起源 là sự bắt đầu của sự vật."}, {"q": "专家指出，这场危机的____在于长期忽视基础设施的维护，而不是一时的天气原因。", "a": "根源", "why": "Nguyên nhân gốc rễ của khủng hoảng → 根源. 起源 chỉ điểm khởi đầu, không nhấn nguyên nhân."}, {"q": "关于汉字的____，学术界有结绳记事、仓颉造字等多种说法，至今没有定论。", "a": "起源", "why": "Nguồn gốc ra đời của chữ Hán → 起源. 来历 dùng cho vật cụ thể."}]}, {"id": "bs-107", "tip": "乐趣 = niềm vui, thú vui khi làm việc; 兴趣 = hứng thú, sự yêu thích đối với sự vật; 趣味 = tính thú vị, hương vị vui vẻ của sự vật.", "table": true, "words": [{"w": "乐趣", "py": "lèqù", "vi": "lạc thú, niềm vui", "use": "享受乐趣；生活的乐趣"}, {"w": "兴趣", "py": "xìngqù", "vi": "hứng thú, sở thích", "use": "产生兴趣；兴趣爱好"}, {"w": "趣味", "py": "qùwèi", "vi": "thú vị, tính hấp dẫn", "use": "增加趣味；低级趣味"}], "quiz": [{"q": "退休后，他在阳台上种起了花草，每天浇水、修剪，从中找到了许多生活的____。", "a": "乐趣", "why": "Niềm vui cảm nhận được khi làm việc → 乐趣. 兴趣 là sự yêu thích hướng tới sự vật."}, {"q": "孩子对天文产生了浓厚的____，每天晚上都要拉着爸爸去阳台看星星，还自己查资料。", "a": "兴趣", "why": "Sự yêu thích đối với một lĩnh vực → 兴趣. 乐趣 là niềm vui trong khi làm."}, {"q": "这本科普书语言幽默，配有大量插图，在保证科学性的同时增加了不少____，连小学生也能读得津津有味。", "a": "趣味", "why": "Tính hấp dẫn thú vị của nội dung → 趣味. 兴趣 là cảm xúc của người đọc."}]}, {"id": "bs-108", "tip": "模式 = mô thức, khuôn mẫu cách làm, kiểu vận hành; 模型 = mô hình vật thể thu nhỏ hoặc mô hình toán, khoa học.", "table": true, "words": [{"w": "模式", "py": "móshì", "vi": "mô thức, kiểu mẫu", "use": "商业模式；思维模式"}, {"w": "模型", "py": "móxíng", "vi": "mô hình", "use": "飞机模型；数学模型"}], "quiz": [{"q": "这家公司创造了一种“线上预订、线下体验”的新商业____，在短短两年内就扩展到了二十个城市。", "a": "模式", "why": "Cách thức vận hành kinh doanh → 模式. 模型 là mô hình vật thể."}, {"q": "工程师先用塑料做出了大桥的缩小____，放进水槽中测试它在水流冲击下的稳定性。", "a": "模型", "why": "Vật thể thu nhỏ dùng để thử nghiệm → 模型. 模式 là cách thức, không phải vật."}]}, {"id": "bs-109", "tip": "评估 = ước lượng, thẩm định (giá trị, rủi ro); 评论 = bình luận, nhận xét; 评价 = đánh giá tốt xấu về người, sự vật.", "table": true, "words": [{"w": "评估", "py": "pínggū", "vi": "đánh giá, thẩm định", "use": "风险评估；评估报告"}, {"w": "评论", "py": "pínglùn", "vi": "bình luận", "use": "影视评论；发表评论"}, {"w": "评价", "py": "píngjià", "vi": "đánh giá, nhận xét tốt xấu", "use": "评价很高；客观评价"}], "quiz": [{"q": "项目开工前，专家组要对施工可能造成的环境影响进行全面____，确认没有风险之后才能批准。", "a": "评估", "why": "Thẩm định mức độ tác động/rủi ro → 评估. 评论 là bình luận ý kiến."}, {"q": "这部电影上映后，影评人纷纷撰文发表____，有的称赞导演的构思，有的批评剧本太松散。", "a": "评论", "why": "Bài viết bình luận → 评论. 评估 mang tính định lượng, thẩm định."}, {"q": "同事们对他的____很高，都认为他不仅业务能力强，而且乐于帮助新人，是难得的好领导。", "a": "评价", "why": "Nhận xét tốt xấu về một người → 评价. 评论 không đi với 很高."}]}, {"id": "bs-110", "tip": "气概 = khí khái, phẩm chất dũng cảm của con người; 气魄 = khí phách, tầm vóc và sự táo bạo của hành động, công trình; 气势 = khí thế, thế mạnh hùng vĩ bên ngoài.", "table": true, "words": [{"w": "气概", "py": "qìgài", "vi": "khí khái, phong thái anh dũng", "use": "英雄气概；男子气概"}, {"w": "气魄", "py": "qìpò", "vi": "khí phách, tầm vóc táo bạo", "use": "有气魄；气魄宏大"}, {"w": "气势", "py": "qìshì", "vi": "khí thế, thế mạnh", "use": "气势磅礴；气势汹汹"}], "quiz": [{"q": "面对洪水，战士们毫不退缩，展现出了不怕牺牲、勇于担当的英雄____，赢得了群众的敬佩。", "a": "气概", "why": "Phẩm chất dũng cảm của con người → 气概. 气势 chỉ thế mạnh bề ngoài."}, {"q": "这个工程规模之大、设计之新，体现了决策者敢想敢干的____，在当时是一项前所未有的举措。", "a": "气魄", "why": "Tầm vóc, sự táo bạo trong quyết định → 气魄. 气概 nhấn vào phẩm chất dũng cảm cá nhân."}, {"q": "瀑布从百米高的悬崖上倾泻而下，水声如雷，那磅礴的____让每个站在观景台上的游客都忍不住惊叹。", "a": "气势", "why": "Thế hùng vĩ của cảnh vật → 气势. 气概 chỉ nói về con người."}]}, {"id": "bs-111", "tip": "前景 = viễn cảnh, triển vọng phát triển; 前途 = tiền đồ, tương lai của đời người, sự nghiệp; 前提 = tiền đề, điều kiện cần có trước.", "table": true, "words": [{"w": "前景", "py": "qiánjǐng", "vi": "viễn cảnh, triển vọng", "use": "前景广阔；市场前景"}, {"w": "前途", "py": "qiántú", "vi": "tiền đồ", "use": "前途无量；个人前途"}, {"w": "前提", "py": "qiántí", "vi": "tiền đề, điều kiện tiên quyết", "use": "先决前提；在…前提下"}], "quiz": [{"q": "分析师认为，随着人们环保意识的增强，新能源汽车行业的市场____十分广阔，值得长期关注。", "a": "前景", "why": "Triển vọng của ngành, thị trường → 前景. 前途 thiên về tương lai của một người."}, {"q": "父母希望孩子好好读书，将来能有个好____，不用像他们一样每天为生计奔波劳累。", "a": "前途", "why": "Tương lai đời người → 前途. 前景 dùng cho ngành, dự án."}, {"q": "合作的____是双方互相信任，如果连最基本的诚信都做不到，再优厚的条件也谈不上长久。", "a": "前提", "why": "Điều kiện cần có trước → 前提. 前途 và 前景 không mang nghĩa này."}]}, {"id": "bs-112", "tip": "情节 = tình tiết của câu chuyện, vụ án; 情理 = lẽ thường, tình và lý; 情形 = tình hình cụ thể, cảnh huống diễn ra; 情况 = tình hình nói chung, thông tin về sự việc.", "table": true, "words": [{"w": "情节", "py": "qíngjié", "vi": "tình tiết", "use": "情节曲折；案件情节"}, {"w": "情理", "py": "qínglǐ", "vi": "tình lý, lẽ thường", "use": "合乎情理；不近情理"}, {"w": "情形", "py": "qíngxing", "vi": "tình hình, cảnh huống", "use": "当时的情形；类似情形"}, {"w": "情况", "py": "qíngkuàng", "vi": "tình hình, tình huống", "use": "了解情况；特殊情况"}], "quiz": [{"q": "这部电视剧的____曲折紧凑，每集结尾都留下悬念，让观众迫不及待地想看下一集。", "a": "情节", "why": "Diễn biến của truyện/phim → 情节. 情况 là tình hình nói chung."}, {"q": "他提出的要求听起来虽然苛刻，但仔细想想也合乎____，毕竟是公司先违反了合同条款。", "a": "情理", "why": "Hợp lẽ thường → 情理. 情形 và 情况 không đi với 合乎."}, {"q": "回想起第一次登台演讲的____，他至今仍记得自己手心冒汗、声音发抖的狼狈模样。", "a": "情形", "why": "Cảnh huống cụ thể đã diễn ra, hồi tưởng → 情形. 情况 thiên về thông tin hiện tại."}, {"q": "警方赶到现场后，立即向目击者了解事故发生的具体____，并对周围的监控录像进行了调取。", "a": "情况", "why": "Tìm hiểu thông tin, tình hình sự việc → 情况. 情节 dùng cho câu chuyện, vụ án."}]}, {"id": "bs-113", "tip": "人道 = nhân đạo, đạo lý đối xử con người; 人格 = nhân cách, phẩm giá của một người; 人性 = bản tính con người.", "table": true, "words": [{"w": "人道", "py": "réndào", "vi": "nhân đạo", "use": "人道主义；人道待遇"}, {"w": "人格", "py": "réngé", "vi": "nhân cách, phẩm giá", "use": "人格尊严；高尚的人格"}, {"w": "人性", "py": "rénxìng", "vi": "nhân tính, bản tính con người", "use": "人性的弱点；人性本善"}], "quiz": [{"q": "国际组织呼吁各方保障战俘的基本权利，给予他们符合____原则的待遇，不得施以任何形式的虐待。", "a": "人道", "why": "Nguyên tắc đối xử nhân đạo → 人道. 人性 là bản tính, không dùng làm nguyên tắc."}, {"q": "法律保护公民的____尊严，任何人都不得以侮辱、诽谤等方式损害他人的名誉。", "a": "人格", "why": "Phẩm giá cá nhân được pháp luật bảo vệ → 人格. 人性 chỉ bản tính chung."}, {"q": "这部小说深刻地剖析了____中善与恶的矛盾，让读者在故事之外对自身也有了新的思考。", "a": "人性", "why": "Bản tính chung của loài người, thiện ác → 人性. 人格 nói về từng cá nhân."}]}, {"id": "bs-114", "tip": "神情 = vẻ mặt, thần sắc biểu lộ tâm trạng; 神色 = sắc mặt, thường trong tình huống cụ thể (慌张, 自若); 神态 = thần thái, dáng vẻ chung gồm cả cử chỉ.", "table": true, "words": [{"w": "神情", "py": "shénqíng", "vi": "thần tình, vẻ mặt biểu cảm", "use": "神情专注；难以置信的神情"}, {"w": "神色", "py": "shénsè", "vi": "thần sắc, sắc mặt", "use": "神色慌张；神色自若"}, {"w": "神态", "py": "shéntài", "vi": "thần thái, dáng vẻ", "use": "神态安详；神态自然"}], "quiz": [{"q": "听到获奖的消息，她先是愣了一下，随后脸上露出了难以置信又喜出望外的____。", "a": "神情", "why": "Biểu cảm khuôn mặt thể hiện cảm xúc → 神情. 神态 thiên về dáng vẻ chung, không đi cùng 露出."}, {"q": "警察上前盘问时，他的____显得有些慌张，目光不断躲闪，说话也结结巴巴。", "a": "神色", "why": "Sắc mặt lộ ra khi gặp tình huống căng thẳng → 神色 (神色慌张). 神态 ít dùng với 慌张."}, {"q": "老人坐在藤椅上，____安详，手中的蒲扇轻轻摇着，仿佛时间在这个午后都慢了下来。", "a": "神态", "why": "Dáng vẻ tổng thể gồm cử chỉ, tư thế → 神态. 神色 thiên về sắc mặt nhất thời."}]}, {"id": "bs-115", "tip": "事迹 = sự tích, việc làm đáng nêu của một người; 事件 = sự kiện xảy ra; 事态 = tình thế, diễn biến của sự việc (hay đi với 扩大, 发展).", "table": true, "words": [{"w": "事迹", "py": "shìjì", "vi": "sự tích, việc làm tiêu biểu", "use": "英雄事迹；感人事迹"}, {"w": "事件", "py": "shìjiàn", "vi": "sự kiện", "use": "突发事件；历史事件"}, {"w": "事态", "py": "shìtài", "vi": "thế sự, diễn biến sự việc", "use": "事态严重；事态扩大"}], "quiz": [{"q": "学校邀请了几位抗震救灾的英雄来做报告，用真实感人的____激励同学们学会勇敢和担当。", "a": "事迹", "why": "Những việc làm tiêu biểu của con người → 事迹. 事件 là sự việc xảy ra."}, {"q": "这起突发____在网络上迅速发酵，相关部门随即发布通报，说明了事情的来龙去脉。", "a": "事件", "why": "Một sự việc xảy ra → 事件. 事迹 là việc làm đáng ca ngợi của người."}, {"q": "警方迅速封锁现场并疏散群众，才避免了____进一步扩大，没有造成更严重的人员伤亡。", "a": "事态", "why": "Diễn biến, tình thế có thể lan rộng → 事态. 事件 không đi với 扩大 theo nghĩa này."}]}, {"id": "bs-116", "tip": "视力 = khả năng nhìn của mắt (cận, loạn…); 视线 = đường nhìn, hướng mắt nhìn; 视野 = phạm vi nhìn thấy, nghĩa bóng là tầm hiểu biết.", "table": true, "words": [{"w": "视力", "py": "shìlì", "vi": "thị lực", "use": "视力下降；检查视力；视力不好"}, {"w": "视线", "py": "shìxiàn", "vi": "đường nhìn, tầm mắt", "use": "挡住视线；转移视线；视线模糊"}, {"w": "视野", "py": "shìyě", "vi": "tầm nhìn, tầm hiểu biết", "use": "开阔视野；进入视野；视野狭窄"}], "quiz": [{"q": "长时间盯着手机屏幕，加上经常熬夜，他的____在两年内下降了不少，不得不换上度数更高的眼镜。", "a": "视力", "why": "Nói về khả năng của mắt (cận/giảm) → 视力. 视线 chỉ hướng nhìn, 视野 là phạm vi nhìn."}, {"q": "她刚想开口解释，却发现老师的____一直落在窗外，似乎根本没有在听她说话。", "a": "视线", "why": "视线落在… = ánh mắt hướng về đâu. 视力 là năng lực mắt, 视野 là phạm vi, không \"rơi vào\" cửa sổ."}, {"q": "多出国走走、多读书，能够开阔____，让我们不再局限于眼前这一小块生活圈子。", "a": "视野", "why": "开阔视野 là cụm cố định, nghĩa bóng \"mở rộng tầm hiểu biết\"; 视力/视线 không đi với 开阔."}]}, {"id": "bs-117", "tip": "思维 = tư duy (năng lực, cách suy nghĩ); 思绪 = dòng suy nghĩ, tâm trạng miên man; 思路 = mạch suy nghĩ, hướng giải quyết vấn đề.", "table": true, "words": [{"w": "思维", "py": "sīwéi", "vi": "tư duy", "use": "逻辑思维；思维方式；思维敏捷"}, {"w": "思绪", "py": "sīxù", "vi": "dòng suy nghĩ, tâm tư", "use": "思绪万千；理清思绪；思绪纷乱"}, {"w": "思路", "py": "sīlù", "vi": "mạch suy nghĩ, hướng giải quyết", "use": "打开思路；理清思路；解题思路"}], "quiz": [{"q": "这位科学家的____非常活跃，往往能把看似毫无关系的现象联系起来，从而提出全新的研究假设。", "a": "思维", "why": "Nói năng lực/phương thức suy nghĩ → 思维. 思绪 là dòng tâm tư, 思路 là hướng giải quyết cụ thể."}, {"q": "听到那首熟悉的老歌，她的____一下子飘回了十几年前的夏天，眼眶也渐渐湿润了。", "a": "思绪", "why": "思绪飘回 = tâm tư miên man theo cảm xúc. 思路 và 思维 không \"飘\" theo hồi ức."}, {"q": "做这道数学题时，他一开始总卡在第二步，直到老师稍微提示，才理清了____，很快算出了答案。", "a": "思路", "why": "理清思路 = vạch ra hướng giải. 思维 không đi với 理清 theo nghĩa này, 思绪 thiên về cảm xúc."}]}, {"id": "bs-118", "tip": "特长 = sở trường, năng khiếu của người; 特色 = nét đặc sắc riêng của sự vật, địa phương, món ăn.", "table": true, "words": [{"w": "特长", "py": "tècháng", "vi": "sở trường, năng khiếu", "use": "发挥特长；个人特长；有一技之长"}, {"w": "特色", "py": "tèsè", "vi": "nét đặc sắc", "use": "地方特色；特色菜；独具特色"}], "quiz": [{"q": "报名表上要求填写个人____，他想了半天，最后写上了绘画和长跑两项。", "a": "特长", "why": "Chủ thể là người, chỉ năng khiếu cá nhân → 特长. 特色 dùng cho sự vật."}, {"q": "这座古镇最大的____在于家家户户门前都有一条小河，游客可以坐着小船穿过整座镇子。", "a": "特色", "why": "Nói nét riêng của địa phương → 特色. 特长 chỉ năng lực của người."}]}, {"id": "bs-119", "tip": "威望 = uy vọng (danh tiếng lớn, tầm xã hội); 威信 = uy tín khiến người khác nghe theo (trong tập thể); 尊严 = phẩm giá; 信誉 = uy tín về chữ tín; 荣誉 = vinh dự; 信念 = niềm tin kiên định; 信仰 = tín ngưỡng, lý tưởng tôn thờ.", "table": true, "words": [{"w": "威望", "py": "wēiwàng", "vi": "uy vọng, danh tiếng lớn", "use": "享有威望；威望很高；提高威望"}, {"w": "威信", "py": "wēixìn", "vi": "uy tín, sức thuyết phục", "use": "树立威信；很有威信；失去威信"}, {"w": "尊严", "py": "zūnyán", "vi": "tôn nghiêm, phẩm giá", "use": "维护尊严；人格尊严；有尊严"}, {"w": "信誉", "py": "xìnyù", "vi": "uy tín (giữ chữ tín)", "use": "信誉良好；讲信誉；信誉卡"}, {"w": "荣誉", "py": "róngyù", "vi": "vinh dự, danh dự", "use": "荣誉称号；获得荣誉；集体荣誉"}, {"w": "信念", "py": "xìnniàn", "vi": "niềm tin", "use": "坚定信念；信念动摇；必胜的信念"}, {"w": "信仰", "py": "xìnyǎng", "vi": "tín ngưỡng, đức tin", "use": "宗教信仰；信仰自由；共同的信仰"}], "quiz": [{"q": "他为国家的科技发展奉献了一生，在全国科学界享有极高的____，晚辈们都以他为学习的榜样。", "a": "威望", "why": "享有…威望: danh tiếng lớn trong cả giới. 威信 thiên về sức nặng trong một tập thể nhỏ."}, {"q": "管理者只有说话算数、处事公平，才能在员工当中树立起____，让大家心服口服地执行安排。", "a": "威信", "why": "树立威信 trong tập thể. 威望 thiên về danh tiếng bên ngoài, 信誉 là chữ tín."}, {"q": "即使生活再艰难，他也不愿意低头乞讨，因为他觉得人活着就应该保持做人的____。", "a": "尊严", "why": "Phẩm giá làm người → 尊严. 荣誉/信誉 không nói về nhân cách tự trọng."}, {"q": "这家老字号几十年来坚持诚信经营，从不以次充好，因此在顾客中积累了良好的____。", "a": "信誉", "why": "Giữ chữ tín trong kinh doanh → 信誉. 荣誉 là danh hiệu được tặng."}, {"q": "获得全国劳动模范称号，对他来说是一份巨大的____，也是对他多年默默付出的肯定。", "a": "荣誉", "why": "Danh hiệu được trao tặng → 荣誉. 威望/信誉 không phải thứ \"được nhận\" như một danh hiệu."}, {"q": "在最困难的日子里，支撑着他们走下去的只有一个____：只要不放弃，就一定能等到春天。", "a": "信念", "why": "Niềm tin cá nhân vào điều sẽ xảy ra → 信念. 信仰 là đức tin/tôn giáo, mang tính hệ thống."}, {"q": "在这个多民族聚居的村庄里，人们的语言和习俗各不相同，宗教____也有差异，但大家相处得十分和睦。", "a": "信仰", "why": "宗教信仰 là cụm cố định. 信念 là niềm tin cụ thể, không đi với 宗教."}]}, {"id": "bs-120", "tip": "眼光 = tầm nhìn, con mắt nhận định; 眼色 = cái liếc mắt để ra hiệu; 眼神 = ánh mắt, thần thái trong mắt.", "table": true, "words": [{"w": "眼光", "py": "yǎnguāng", "vi": "tầm nhìn, con mắt nhận định", "use": "眼光独到；有眼光；长远的眼光"}, {"w": "眼色", "py": "yǎnsè", "vi": "cái liếc mắt ra hiệu", "use": "使眼色；看眼色；递眼色"}, {"w": "眼神", "py": "yǎnshén", "vi": "ánh mắt, thần thái", "use": "眼神坚定；眼神迷茫；充满渴望的眼神"}], "quiz": [{"q": "这位投资人很有____，几年前就看准了这家小公司，如今它已经成了行业里的龙头企业。", "a": "眼光", "why": "Khả năng nhận định, nhìn xa → 眼光. 眼神 chỉ thần thái trong mắt, 眼色 là ra hiệu."}, {"q": "母亲在饭桌上悄悄给他使了个____，他立刻明白不该再提起哥哥考试失败的事。", "a": "眼色", "why": "使眼色 = nháy mắt ra hiệu. 眼光/眼神 không đi với 使."}, {"q": "孩子望着橱窗里的玩具，____里充满了渴望，让路过的人都忍不住停下脚步。", "a": "眼神", "why": "Thần thái, cảm xúc thể hiện trong mắt → 眼神. 眼光 là cách nhìn nhận, 眼色 là ra hiệu."}]}, {"id": "bs-121", "tip": "意识 = ý thức, sự nhận thức; 意图 = ý đồ (thường có mục đích rõ, hay tiêu cực); 意向 = ý hướng, dự định ban đầu; 意志 = ý chí, sức mạnh tinh thần.", "table": true, "words": [{"w": "意识", "py": "yìshí", "vi": "ý thức, nhận thức", "use": "环保意识；安全意识；意识到"}, {"w": "意图", "py": "yìtú", "vi": "ý đồ, dụng ý", "use": "作案意图；意图明显；暴露意图"}, {"w": "意向", "py": "yìxiàng", "vi": "ý hướng, dự định", "use": "合作意向；购买意向；初步意向"}, {"w": "意志", "py": "yìzhì", "vi": "ý chí", "use": "意志坚强；顽强的意志；意志力"}], "quiz": [{"q": "随着环保____不断增强，越来越多的市民开始自觉把垃圾分类后再投放到相应的垃圾桶里。", "a": "意识", "why": "环保意识 = nhận thức bảo vệ môi trường. 意志/意向 không kết hợp với 环保 theo nghĩa này."}, {"q": "警方通过监控录像发现，那名男子在附近徘徊了很久，显然有作案的____，于是立即展开了调查。", "a": "意图", "why": "作案意图 = ý đồ gây án. 意向 là dự định trung tính, thường dùng trong hợp tác."}, {"q": "双方经过两轮谈判，已经就合作开发新能源汽车达成了初步的____，具体条款还有待商定。", "a": "意向", "why": "达成合作意向 là cụm cố định, dự định ban đầu. 意图 mang sắc thái xấu, 意志 là sức mạnh tinh thần."}, {"q": "登山队员们凭着顽强的____，在零下三十度的暴风雪中坚持了整整三天，终于成功登顶。", "a": "意志", "why": "Sức mạnh tinh thần chịu khó → 意志. 意识/意向 không đi với 顽强."}]}, {"id": "bs-122", "tip": "语气 = ngữ khí, sắc thái khi nói; 口气 = khẩu khí, giọng điệu thể hiện thái độ (口气大 = nói khoác); 口音 = giọng địa phương.", "table": true, "words": [{"w": "语气", "py": "yǔqì", "vi": "ngữ khí, sắc thái lời nói", "use": "语气温和；语气坚决；用…的语气"}, {"w": "口气", "py": "kǒuqì", "vi": "khẩu khí, giọng điệu", "use": "口气很大；换个口气；听口气"}, {"w": "口音", "py": "kǒuyīn", "vi": "giọng địa phương", "use": "南方口音；带口音；口音很重"}], "quiz": [{"q": "同一句\"你来了\"，用不同的____说出来，可以表示欢迎，也可以表示不耐烦，意思完全不一样。", "a": "语气", "why": "Sắc thái nói (vui, bực) → 语气. 口音 chỉ giọng vùng miền."}, {"q": "他说话的____真不小，竟然声称一个人就能在一个月内完成整个团队半年的工作量。", "a": "口气", "why": "口气不小 = nói lời lớn lối, cụm cố định. 语气 không có nghĩa \"khoác lác\"."}, {"q": "他在北京生活了二十多年，可一开口，南方的____还是让人一下就听出了他的老家。", "a": "口音", "why": "Giọng vùng miền → 口音. 语气/口气 không chỉ vùng miền."}]}, {"id": "bs-123", "tip": "职能 = chức năng, vai trò của cơ quan; 职位 = vị trí (chức vị) trong tổ chức; 职务 = chức vụ, nhiệm vụ đảm nhiệm; 职业 = nghề nghiệp.", "table": true, "words": [{"w": "职能", "py": "zhínéng", "vi": "chức năng (của cơ quan)", "use": "职能部门；管理职能；履行职能"}, {"w": "职位", "py": "zhíwèi", "vi": "vị trí, chức vị", "use": "招聘职位；高级职位；职位空缺"}, {"w": "职务", "py": "zhíwù", "vi": "chức vụ", "use": "担任职务；兼任职务；撤销职务"}, {"w": "职业", "py": "zhíyè", "vi": "nghề nghiệp", "use": "职业选择；职业道德；职业病"}], "quiz": [{"q": "这个部门的主要____是协调各地分公司的生产计划，并监督各项指标的完成情况。", "a": "职能", "why": "Vai trò/chức năng của bộ phận → 职能. 职位/职务 chỉ cá nhân."}, {"q": "公司最近正在招聘市场总监，这个____待遇优厚，但对工作经验的要求也相当高。", "a": "职位", "why": "Vị trí tuyển dụng → 职位. 职能 là chức năng của bộ phận, 职业 là loại nghề."}, {"q": "他因工作出色被提拔，现在担任公司副总经理的____，主要负责对外联络和销售工作。", "a": "职务", "why": "担任…职务 = đảm nhiệm chức vụ. 职业 là nghề nói chung."}, {"q": "医生、教师、律师等____通常需要经过长期的专业训练，并且要获得相应的资格证书。", "a": "职业", "why": "Chỉ các loại nghề nói chung → 职业. 职务/职位 chỉ chức vụ trong một cơ quan."}]}, {"id": "bs-124", "tip": "按时 = đúng giờ, đúng thời hạn quy định; 及时 = kịp lúc, đúng thời điểm cần thiết.", "table": true, "words": [{"w": "按时", "py": "ànshí", "vi": "đúng giờ, đúng hạn", "use": "按时吃药；按时完成；按时上班"}, {"w": "及时", "py": "jíshí", "vi": "kịp thời", "use": "及时发现；及时赶到；及时处理"}], "quiz": [{"q": "医生反复叮嘱老人要____吃药，每天早中晚各一次，千万不能随意增减剂量。", "a": "按时", "why": "Theo giờ đã định → 按时. 及时 là kịp lúc khi có tình huống cần."}, {"q": "多亏救护车赶到得____，伤者才在最危险的时刻得到抢救，保住了性命。", "a": "及时", "why": "Đúng lúc cấp bách → 及时. 按时 chỉ đúng giờ quy định."}]}, {"id": "bs-125", "tip": "按照 = theo (tiêu chuẩn, kế hoạch), dùng rộng, khẩu ngữ lẫn văn viết; 依照 = y theo, trang trọng, hay đi với luật, quy định.", "table": true, "words": [{"w": "按照", "py": "ànzhào", "vi": "căn cứ theo", "use": "按照计划；按照要求；按照惯例"}, {"w": "依照", "py": "yīzhào", "vi": "y theo (trang trọng)", "use": "依照法律；依照规定；依照程序"}], "quiz": [{"q": "____原定的计划，我们明天上午十点出发，中午前赶到山脚下的营地，下午开始搭帐篷。", "a": "按照", "why": "Theo kế hoạch thông thường → 按照. 依照 cũng được nhưng thiên về văn bản pháp lý."}, {"q": "法院将____法律规定，对这起案件作出公正的判决，并在一周内向社会公布判决结果。", "a": "依照", "why": "Luật pháp, văn bản chính thức → 依照 tự nhiên nhất. 按照 vẫn đúng nhưng kém trang trọng."}]}, {"id": "bs-126", "tip": "本来 = vốn dĩ, lẽ ra (kế hoạch ban đầu); 根本 = hoàn toàn (đi với phủ định) / gốc rễ; 原来 = hóa ra (phát hiện) / ban đầu.", "table": true, "words": [{"w": "本来", "py": "běnlái", "vi": "vốn dĩ, lẽ ra", "use": "本来打算；本来就；本来如此"}, {"w": "根本", "py": "gēnběn", "vi": "hoàn toàn (phủ định); căn bản", "use": "根本不；根本问题；根本没有"}, {"w": "原来", "py": "yuánlái", "vi": "hóa ra; ban đầu", "use": "原来如此；原来的样子；原来是你"}], "quiz": [{"q": "他____打算今晚加班，但是临时接到母亲生病的电话，只好匆匆收拾东西赶回了老家。", "a": "本来", "why": "Dự định ban đầu bị thay đổi → 本来. 根本 phải đi với phủ định, 原来 mang nghĩa phát hiện."}, {"q": "无论我怎么解释，他都____听不进去，一直认定这件事是我故意造成的，让我十分无奈。", "a": "根本", "why": "根本 + 听不进去 = hoàn toàn không nghe. 本来/原来 không nhấn mạnh phủ định như vậy."}, {"q": "我找了整整一个下午，____钥匙一直放在我自己的外套口袋里，真是白忙了一场。", "a": "原来", "why": "Phát hiện ra sự thật → 原来. 本来 là dự định ban đầu."}]}, {"id": "bs-127", "tip": "毕竟 = dù sao (nhấn nguyên nhân khách quan); 到底 = rốt cuộc (khẩu ngữ, hỏi dồn / kết quả sau cùng); 究竟 = rốt cuộc (văn viết, hỏi sâu); 总算 = cuối cùng cũng (sau nỗ lực).", "table": true, "words": [{"w": "毕竟", "py": "bìjìng", "vi": "dù sao, suy cho cùng", "use": "毕竟是；毕竟还年轻；毕竟不同"}, {"w": "到底", "py": "dàodǐ", "vi": "rốt cuộc (khẩu ngữ)", "use": "到底是谁；坚持到底；到底怎么了"}, {"w": "究竟", "py": "jiūjìng", "vi": "rốt cuộc, thực chất", "use": "究竟如何；探个究竟；究竟是什么"}, {"w": "总算", "py": "zǒngsuàn", "vi": "cuối cùng cũng", "use": "总算完成；总算松了口气；总算赶上了"}], "quiz": [{"q": "他虽然犯了错，但____还是个刚毕业的孩子，咱们应该多给他一些改正和成长的机会。", "a": "毕竟", "why": "Nhấn lý do để thông cảm → 毕竟. 总算 là cuối cùng đạt được, 到底/究竟 là câu hỏi."}, {"q": "这件事你____打算怎么处理？别再拖了，大家都在等着你的决定，会议室里的气氛已经很紧张。", "a": "到底", "why": "Hỏi dồn, khẩu ngữ → 到底. 究竟 cũng được nhưng trang trọng hơn."}, {"q": "专家们对这种现象争论了多年，但它____是怎样形成的，至今仍然没有一个确切的答案。", "a": "究竟", "why": "Văn viết, hỏi nguyên nhân sâu → 究竟. 到底 khẩu ngữ hơn."}, {"q": "经过三个月的反复修改，这份方案____通过了领导的审核，大家终于可以松一口气了。", "a": "总算", "why": "Sau nỗ lực mới đạt kết quả mong muốn → 总算. 毕竟 không có ý \"cuối cùng cũng\"."}]}, {"id": "bs-128", "tip": "不妨 = cứ việc, không sao (gợi ý thử làm); 不如 = chẳng bằng (so sánh, hay đi với 与其…不如…).", "table": true, "words": [{"w": "不妨", "py": "bùfáng", "vi": "cứ thử, không ngại", "use": "不妨试试；不妨告诉他；不妨一看"}, {"w": "不如", "py": "bùrú", "vi": "chẳng bằng", "use": "不如去；与其…不如…；不如他"}], "quiz": [{"q": "如果你对这个项目有不同的看法，____在明天的会议上直接说出来，让大家一起讨论讨论。", "a": "不妨", "why": "Gợi ý nhẹ nhàng \"cứ thử nói\" → 不妨. 不如 mang nghĩa so sánh hơn kém."}, {"q": "与其在家里一个人闷着生气，____出去走走，看看风景，心情自然会慢慢好起来的。", "a": "不如", "why": "与其…不如… là khuôn cố định. 不妨 không đi với 与其."}]}, {"id": "bs-129", "tip": "不管 = bất kể (đi với từ nghi vấn/lựa chọn, vế sau 都/也); 尽管 = mặc dù (thừa nhận sự thật, vế sau thường có 但是/还是).", "table": true, "words": [{"w": "不管", "py": "bùguǎn", "vi": "bất kể", "use": "不管怎样；不管…都…；不管谁"}, {"w": "尽管", "py": "jǐnguǎn", "vi": "mặc dù; cứ việc", "use": "尽管如此；尽管…但是…；尽管说"}], "quiz": [{"q": "____天气多么恶劣，快递员总是准时把包裹送到客户手里，从来没有耽误过一次。", "a": "不管", "why": "\"多么恶劣\" là điều kiện bất kỳ → 不管. 尽管 thừa nhận một sự thật cụ thể."}, {"q": "____他已经连续工作了十几个小时，但看到还有病人在等着，他还是坚持完成了最后一台手术。", "a": "尽管", "why": "Thừa nhận sự thật đã xảy ra, có 但 theo sau → 尽管. 不管 cần điều kiện không xác định."}]}, {"id": "bs-130", "tip": "格外 = đặc biệt hơn bình thường (so với thường lệ); 极其 = vô cùng (mức độ cực cao, văn viết); 简直 = quả thực (nhấn mạnh phóng đại); 尤其 = đặc biệt là (nêu điểm nổi bật trong số cùng loại).", "table": true, "words": [{"w": "格外", "py": "géwài", "vi": "đặc biệt, hơn hẳn thường", "use": "格外高兴；格外小心；格外清新"}, {"w": "极其", "py": "jíqí", "vi": "vô cùng, cực kỳ", "use": "极其重要；极其危险；极其复杂"}, {"w": "简直", "py": "jiǎnzhí", "vi": "quả thực, đúng là", "use": "简直不敢相信；简直像；简直是"}, {"w": "尤其", "py": "yóuqí", "vi": "đặc biệt là", "use": "尤其是；尤其喜欢；尤其重要"}], "quiz": [{"q": "雨后的空气____清新，路边的树叶也被洗得绿油油的，让人忍不住多深呼吸几下。", "a": "格外", "why": "So với ngày thường thì khác hẳn → 格外. 尤其 cần nêu điểm nổi bật trong nhóm."}, {"q": "在没有任何防护设备的情况下进入火场是____危险的行为，消防员们绝不允许这样做。", "a": "极其", "why": "Mức độ rất cao, văn viết → 极其. 简直 mang ý phóng đại cảm thán."}, {"q": "他把房间收拾得干干净净，____像换了一个人似的，连他的父母都吃了一惊。", "a": "简直", "why": "Phóng đại so sánh \"như là\" → 简直. 格外/极其 không đi với 像."}, {"q": "我喜欢各种水果，____是夏天的西瓜，一口下去，满嘴都是清凉的甜味，特别解渴。", "a": "尤其", "why": "Chọn ra điểm nổi bật trong số các loại → 尤其. 格外 không đi với 是."}]}, {"id": "bs-131", "tip": "更加 = càng thêm (so sánh mức độ, có thể tức thì); 日益 = ngày càng (văn viết, xu hướng dài hạn); 逐渐 = dần dần (tự nhiên, không chủ ý); 逐步 = từng bước (có kế hoạch, chủ động).", "table": true, "words": [{"w": "更加", "py": "gèngjiā", "vi": "càng thêm", "use": "更加努力；更加重要；更加明显"}, {"w": "日益", "py": "rìyì", "vi": "ngày càng", "use": "日益增长；日益严重；日益增多"}, {"w": "逐渐", "py": "zhújiàn", "vi": "dần dần", "use": "逐渐变化；逐渐适应；逐渐暗下来"}, {"w": "逐步", "py": "zhúbù", "vi": "từng bước", "use": "逐步推进；逐步完善；逐步实现"}], "quiz": [{"q": "虽然已经很努力了，但看到别人的成绩，他决定在下学期____刻苦，争取赶上班里的第一名。", "a": "更加", "why": "So sánh với mức hiện tại → 更加. 日益/逐渐 nói về quá trình biến đổi theo thời gian."}, {"q": "随着生活水平的提高，人们对食品安全和营养搭配的关注____增加，健康食品的销量也不断上升。", "a": "日益", "why": "Xu hướng lâu dài, văn viết → 日益. 逐步 mang nghĩa có kế hoạch."}, {"q": "天色____暗了下来，路灯一盏接一盏地亮起，街上的行人也渐渐稀少，城市安静了许多。", "a": "逐渐", "why": "Biến đổi tự nhiên → 逐渐. 逐步 hàm ý chủ động tiến hành."}, {"q": "为了降低风险，公司决定____推进这次改革，先在两个分公司试点，成功后再推广到全国。", "a": "逐步", "why": "Có kế hoạch, có các bước → 逐步. 逐渐 chỉ biến đổi tự nhiên, không chủ ý."}]}, {"id": "bs-132", "tip": "公然 = công khai (làm điều xấu không e dè); 固然 = tuy rằng (thừa nhận rồi chuyển ngoặt); 果然 = quả nhiên (đúng như dự đoán); 居然 = không ngờ (bất ngờ); 既然 = đã…thì (tiền đề); 当然 = đương nhiên.", "table": true, "words": [{"w": "公然", "py": "gōngrán", "vi": "công khai, trắng trợn", "use": "公然违法；公然挑衅；公然撒谎"}, {"w": "固然", "py": "gùrán", "vi": "tuy rằng, đành rằng", "use": "固然重要；固然…但…；固然如此"}, {"w": "果然", "py": "guǒrán", "vi": "quả nhiên", "use": "果然如此；果然不出所料；果然来了"}, {"w": "居然", "py": "jūrán", "vi": "không ngờ", "use": "居然忘了；居然成功；居然敢"}, {"w": "既然", "py": "jìrán", "vi": "đã…thì", "use": "既然…就…；既然如此；既然来了"}, {"w": "当然", "py": "dāngrán", "vi": "đương nhiên", "use": "当然可以；理所当然；当然是"}], "quiz": [{"q": "那个司机竟然____违反交通规则，在警察的眼皮底下闯红灯，还对前来制止的人大声叫嚷。", "a": "公然", "why": "Làm điều sai trắng trợn, không e dè → 公然. 居然 chỉ sự bất ngờ, không nhấn công khai."}, {"q": "努力____重要，但如果方向不对，付出再多也可能得不到理想的结果，所以要先看清目标。", "a": "固然", "why": "固然…但/可是… thừa nhận rồi chuyển ý. 当然/果然 không có cấu trúc ngoặt này."}, {"q": "天气预报说下午会有暴雨，我们刚到家，天色就暗了下来，大雨____倾盆而下。", "a": "果然", "why": "Kết quả đúng như dự báo → 果然. 居然 là ngoài dự đoán."}, {"q": "我以为他早就忘了我的生日，没想到他____专程从外地赶回来，还带来了我最爱吃的蛋糕。", "a": "居然", "why": "没想到 → bất ngờ → 居然. 果然 là đúng như dự đoán."}, {"q": "____你已经答应了朋友，就一定要说到做到，不能因为一点小困难就轻易反悔。", "a": "既然", "why": "既然…就… = đã vậy thì. 固然/当然 không tạo tiền đề này."}, {"q": "你问我愿不愿意帮忙？____愿意！咱们是十几年的老朋友了，你有困难我怎么能不管呢？", "a": "当然", "why": "Đáp khẳng định hiển nhiên → 当然. 果然/居然 không dùng để trả lời như vậy."}]}, {"id": "bs-133", "tip": "共同 = chung (cùng sở hữu/cùng làm, hay làm định ngữ); 一起 = cùng nhau (khẩu ngữ, cùng một chỗ); 一律 = đồng loạt, tất cả như nhau; 总共 = tổng cộng.", "table": true, "words": [{"w": "共同", "py": "gòngtóng", "vi": "chung, cùng", "use": "共同努力；共同的责任；共同点"}, {"w": "一起", "py": "yìqǐ", "vi": "cùng nhau", "use": "一起去；在一起；一起吃饭"}, {"w": "一律", "py": "yīlǜ", "vi": "nhất loạt, không ngoại lệ", "use": "一律平等；一律处理；一律禁止"}, {"w": "总共", "py": "zǒnggòng", "vi": "tổng cộng", "use": "总共多少；总共五个；一共"}], "quiz": [{"q": "保护环境是全人类的____责任，不能只靠少数国家来承担，更不能把压力都推给发展中国家。", "a": "共同", "why": "Làm định ngữ trước 责任 → 共同. 一起 không đứng trước danh từ như vậy."}, {"q": "周末我约了几个老同学____去郊外爬山，晚上再找一家小馆子吃顿饭，好好聊聊近况。", "a": "一起", "why": "Cùng đi, khẩu ngữ → 一起. 共同 không đi với 去 kiểu này."}, {"q": "考场规定，所有考生进入考场后手机____关机并放入指定的袋子里，违者按作弊处理。", "a": "一律", "why": "Quy định áp dụng cho tất cả, không ngoại lệ → 一律."}, {"q": "这次会议____来了八十多位专家，分成六个小组，分别讨论了不同领域的问题。", "a": "总共", "why": "Cộng dồn số lượng → 总共. 共同/一起 không chỉ tổng số."}]}, {"id": "bs-134", "tip": "何必 = hà tất (khuyên không cần làm, câu hỏi tu từ); 何况 = huống chi (so sánh tăng tiến, \"đã thế lại càng\").", "table": true, "words": [{"w": "何必", "py": "hébì", "vi": "hà tất, cần gì phải", "use": "何必呢；何必这样；何必当初"}, {"w": "何况", "py": "hékuàng", "vi": "huống chi", "use": "何况是；更何况；何况还"}], "quiz": [{"q": "这点小事双方说清楚就行了，你____为此大动肝火，还把关系搞得这么僵呢？", "a": "何必", "why": "Khuyên không cần làm (câu hỏi tu từ) → 何必. 何况 là tăng tiến."}, {"q": "这道题连老师都觉得难，____是刚学了两个月的初学者，做错了也不奇怪，不用太自责。", "a": "何况", "why": "\"连…都…，何况…\" = đến… còn vậy, huống chi → 何况. 何必 không dùng cấu trúc này."}]}, {"id": "bs-135", "tip": "互相 = lẫn nhau (phó từ, đứng trước động từ); 相互 = qua lại (có thể làm định ngữ: 相互作用, 相互关系).", "table": true, "words": [{"w": "互相", "py": "hùxiāng", "vi": "lẫn nhau", "use": "互相帮助；互相学习；互相理解"}, {"w": "相互", "py": "xiānghù", "vi": "qua lại, tương hỗ", "use": "相互作用；相互影响；相互关系"}], "quiz": [{"q": "邻居之间应该____帮助，有困难的时候搭把手，日子才能过得和谐，社区也才更有温度。", "a": "互相", "why": "Phó từ trước động từ khẩu ngữ → 互相. 相互 cũng được; ở đây chọn 互相 vì tự nhiên."}, {"q": "这两种药物之间存在着一种____作用，如果同时服用，可能会降低各自的效果。", "a": "相互", "why": "相互作用 là danh từ cố định; 互相 không làm định ngữ trước 作用."}]}, {"id": "bs-136", "tip": "几乎 = gần như, suýt (chưa tới mức đó); 丝毫 = mảy may (đi với phủ định).", "table": true, "words": [{"w": "几乎", "py": "jīhū", "vi": "gần như, suýt", "use": "几乎没有；几乎一样；几乎要"}, {"w": "丝毫", "py": "sīháo", "vi": "mảy may, chút nào", "use": "丝毫不；丝毫没有；丝毫不差"}], "quiz": [{"q": "这次暴雨来得太突然，街上的积水____淹没了小腿，许多车辆被迫停在路边无法前进。", "a": "几乎", "why": "Mức độ gần đạt tới → 几乎. 丝毫 phải đi với phủ định."}, {"q": "面对记者接二连三的追问，他____没有慌张，每个问题都回答得清楚而有条理，现场反应很好。", "a": "丝毫", "why": "丝毫 + 没有 = không chút nào. 几乎 không nhấn mạnh phủ định tuyệt đối."}]}, {"id": "bs-137", "tip": "即将 = sắp (sự việc sắp xảy ra, văn viết); 立即 = lập tức (trang trọng, mệnh lệnh); 立刻 = ngay tức khắc (khẩu ngữ); 随即 = ngay sau đó (nối tiếp sự việc trước).", "table": true, "words": [{"w": "即将", "py": "jíjiāng", "vi": "sắp, sắp sửa", "use": "即将开始；即将到来；即将结束"}, {"w": "立即", "py": "lìjí", "vi": "lập tức", "use": "立即行动；立即报警；立即出发"}, {"w": "立刻", "py": "lìkè", "vi": "ngay tức khắc", "use": "立刻回答；立刻明白；马上"}, {"w": "随即", "py": "suíjí", "vi": "ngay sau đó", "use": "随即离开；随即响起；随即宣布"}], "quiz": [{"q": "演出____开始，观众们已经陆续入场，并安静地找到了自己的座位，剧场里只剩下轻轻的翻书声。", "a": "即将", "why": "Việc sắp xảy ra → 即将. 立即/随即 chỉ hành động ngay sau một sự việc."}, {"q": "一旦发现火情，请____拨打119，并按照指示牌迅速撤离现场，千万不要乘坐电梯。", "a": "立即", "why": "Mệnh lệnh, thông báo trang trọng → 立即. 立刻 gần nghĩa nhưng khẩu ngữ hơn."}, {"q": "听到妈妈在门口喊他的名字，孩子____放下手里的游戏机，高高兴兴地跑了过去。", "a": "立刻", "why": "Phản ứng tức thì, khẩu ngữ → 立刻. 随即 cần có sự việc trước đó dẫn tới."}, {"q": "主持人宣布比赛开始，现场的鼓声____响了起来，运动员们也像离弦的箭一样冲了出去。", "a": "随即", "why": "Nối tiếp ngay sau sự việc trước (宣布) → 随即. 即将 là chưa xảy ra."}]}, {"id": "bs-138", "tip": "即使 = cho dù (giả thiết, dùng rộng); 即便 = cho dù (văn viết hơn, sắc thái nhấn mạnh); hai từ gần như thay thế được.", "table": true, "words": [{"w": "即使", "py": "jíshǐ", "vi": "cho dù", "use": "即使…也…；即使如此；即使是"}, {"w": "即便", "py": "jíbiàn", "vi": "dẫu cho (văn viết)", "use": "即便…也…；即便如此；即便是"}], "quiz": [{"q": "____明天下大雪，我们也要按计划出发，因为这次活动已经提前三个月通知了所有参加者。", "a": "即使", "why": "Giả thiết thông thường, khẩu ngữ → 即使. 即便 cũng đúng nhưng trang trọng hơn."}, {"q": "____是最有经验的登山者，面对突如其来的暴风雪，也难免会感到不知所措，更何况是新手。", "a": "即便", "why": "Văn phong nghị luận, nhấn mạnh → 即便. 即使 vẫn đúng nhưng kém văn viết."}]}, {"id": "bs-139", "tip": "假如 = nếu như (khẩu ngữ lẫn văn viết); 假设 = giả thiết (cũng là động từ: đặt giả thiết); 假使 = giả sử (văn viết); 倘若 = nếu như (văn viết, trang trọng).", "table": true, "words": [{"w": "假如", "py": "jiǎrú", "vi": "nếu như", "use": "假如…就…；假如有一天；假如没有"}, {"w": "假设", "py": "jiǎshè", "vi": "giả thiết, giả định", "use": "假设条件；做出假设；假设…那么…"}, {"w": "假使", "py": "jiǎshǐ", "vi": "giả sử", "use": "假使…也…；假使如此；假使当年"}, {"w": "倘若", "py": "tǎngruò", "vi": "nếu như (văn viết)", "use": "倘若…则…；倘若如此；倘若不然"}], "quiz": [{"q": "____你有一次机会回到十年前，你最想对当时的自己说些什么呢？可以想一想再回答我。", "a": "假如", "why": "Đặt giả thiết phổ thông, khẩu ngữ → 假如."}, {"q": "我们先____这笔投资每年有百分之十的收益，再来计算十年之后账户里大概会有多少钱。", "a": "假设", "why": "Dùng như động từ \"giả định\" → 假设. 假如/倘若 là liên từ, không làm vị ngữ như vậy."}, {"q": "____当年他没有选择出国，而是留在家乡发展，也许今天的生活会是另一番完全不同的光景。", "a": "假使", "why": "Giả thiết ngược quá khứ, văn viết → 假使."}, {"q": "____事情真如传言所说，那么公司的管理层就必须向全体员工作出公开的解释，并承担相应责任。", "a": "倘若", "why": "Văn phong trang trọng, tin tức → 倘若. 假如 cũng được nhưng nhẹ hơn."}]}, {"id": "bs-140", "tip": "默默 = lặng lẽ (không nói ra, âm thầm cống hiến); 悄悄 = nhẹ nhàng, lén (sợ bị phát hiện, sợ làm phiền).", "table": true, "words": [{"w": "默默", "py": "mòmò", "vi": "lặng lẽ, âm thầm", "use": "默默无闻；默默奉献；默默地看着"}, {"w": "悄悄", "py": "qiāoqiāo", "vi": "khẽ khàng, lén lút", "use": "悄悄话；悄悄离开；悄悄地说"}], "quiz": [{"q": "这位老教师几十年来____地资助着山区的贫困学生，从来没有向任何人提起过这件事。", "a": "默默", "why": "Âm thầm, không phô trương → 默默. 悄悄 mang ý sợ bị biết hoặc sợ làm ồn."}, {"q": "孩子怕吵醒熟睡的妈妈，____地推开房门，踮着脚尖走进厨房，给自己倒了一杯水。", "a": "悄悄", "why": "Hành động khẽ khàng để không gây tiếng động → 悄悄."}]}, {"id": "bs-141", "tip": "哪怕 = dù cho (nhấn mạnh mức cực đoan, khẩu ngữ); 就算 = coi như, dù là (giả thiết, khẩu ngữ).", "table": true, "words": [{"w": "哪怕", "py": "nǎpà", "vi": "dù cho, cho dù", "use": "哪怕…也…；哪怕只有一次；哪怕再难"}, {"w": "就算", "py": "jiùsuàn", "vi": "cho dù, coi như", "use": "就算…也…；就算是；就算如此"}], "quiz": [{"q": "为了让山区的孩子们能读上书，他____每天只睡四个小时，也要把筹款的事情做到底。", "a": "哪怕", "why": "Nhấn mạnh mức cực đoan chấp nhận chịu → 哪怕. 就算 cũng được nhưng ít cực đoan."}, {"q": "____全世界的人都不相信你，我也相信你，因为我亲眼看到你为这件事付出了多少努力。", "a": "就算", "why": "Giả thiết phản thực \"dù cả thế giới…\" → 就算. 哪怕 cũng gần nghĩa."}]}, {"id": "bs-142", "tip": "趁 = nhân lúc, tranh thủ (giới từ chỉ thời cơ); 凭 = dựa vào, nhờ vào (giới từ chỉ căn cứ).", "table": true, "words": [{"w": "趁", "py": "chèn", "vi": "nhân lúc, tranh thủ", "use": "趁热打铁；趁机；趁早"}, {"w": "凭", "py": "píng", "vi": "dựa vào, nhờ", "use": "凭本事；凭借；凭什么"}], "quiz": [{"q": "春天正是种树的好时节，咱们____着周末天气不错，把院子里的几棵果树都栽下去吧。", "a": "趁", "why": "Tranh thủ thời cơ → 趁. 凭 chỉ căn cứ, dựa vào."}, {"q": "他没有任何背景，全____自己多年的努力和真诚的态度，赢得了客户们对他的信任。", "a": "凭", "why": "Dựa vào năng lực của mình → 凭. 趁 không chỉ căn cứ."}]}, {"id": "bs-143", "tip": "除非 = trừ phi (điều kiện duy nhất, hay đi với 否则/才); 除了 = ngoại trừ / ngoài ra (hay đi với 都/还/也).", "table": true, "words": [{"w": "除非", "py": "chúfēi", "vi": "trừ phi", "use": "除非…否则…；除非…才…；除非特殊情况"}, {"w": "除了", "py": "chúle", "vi": "ngoài…ra, ngoại trừ", "use": "除了…还…；除了…都…；除了这个"}], "quiz": [{"q": "这个项目不会失败，____资金突然中断，否则按照现在的进度，下个月就能按时完成全部工作。", "a": "除非", "why": "除非…否则… nêu điều kiện duy nhất → 除非. 除了 không có cấu trúc này."}, {"q": "____语文和数学，这学期他还报名参加了美术和乐高两个兴趣班，每天都排得满满的。", "a": "除了", "why": "除了…还… = ngoài…ra còn → 除了. 除非 là điều kiện."}]}, {"id": "bs-144", "tip": "重新 = làm lại từ đầu (làm lần nữa theo cách mới); 重复 = lặp lại y như cũ (cùng một thứ).", "table": true, "words": [{"w": "重新", "py": "chóngxīn", "vi": "làm lại, bắt đầu lại", "use": "重新开始；重新设计；重新考虑"}, {"w": "重复", "py": "chóngfù", "vi": "lặp lại", "use": "重复劳动；不断重复；重复使用"}], "quiz": [{"q": "由于第一次实验的数据出现了严重偏差，研究人员决定推倒原来的方案，____设计一套更完善的流程。", "a": "重新", "why": "Làm lại theo hướng mới → 重新. 重复 là lặp y như cũ."}, {"q": "他每天说着同样的话，做着同样的事，这种日复一日的____让他渐渐失去了对生活的热情。", "a": "重复", "why": "Lặp lại giống hệt → 重复. 重新 là làm lại có thay đổi."}]}, {"id": "bs-145", "tip": "此外 = ngoài ra (liên từ đầu vế, nối thêm ý); 以外 / 之外 = ngoài, bên ngoài (phạm vi, hay đi với 除了), hai từ này gần như thay thế nhau.", "table": true, "words": [{"w": "此外", "py": "cǐwài", "vi": "ngoài ra", "use": "此外还有；此外，…；此外没有"}, {"w": "以外", "py": "yǐwài", "vi": "ngoài, bên ngoài", "use": "…以外；除了…以外；国门以外"}, {"w": "之外", "py": "zhīwài", "vi": "ngoài, bên ngoài", "use": "…之外；除了…之外；意料之外"}], "quiz": [{"q": "这次旅行我们参观了故宫和长城，____还去了胡同里的小店品尝北京小吃，收获很大。", "a": "此外", "why": "Liên từ nối ý thêm, đứng đầu vế → 此外. 以外/之外 phải đi sau danh từ."}, {"q": "长城____是一望无际的草原，古代的人们曾把这片土地称为塞外，那里的气候和风俗都很不一样。", "a": "以外", "why": "Chỉ phạm vi bên ngoài nơi chốn → 以外 (之外 cũng được, hai từ gần như đồng nghĩa)."}, {"q": "除了工作____，他还有一个坚持了十年的爱好：每天傍晚去江边拍摄日落，从未间断过。", "a": "之外", "why": "除了…之外 là khuôn quen dùng (除了…以外 cũng đúng); 此外 không đứng sau 工作."}]}, {"id": "bs-146", "tip": "匆忙 = vội vã (tính từ/trạng từ, không có thời gian); 急忙 = vội vàng (có việc gấp); 慌忙 = cuống cuồng (hoảng hốt); 连忙 = vội vàng (hành động đáp lại ngay).", "table": true, "words": [{"w": "匆忙", "py": "cōngmáng", "vi": "vội vã, hấp tấp", "use": "匆忙离开；匆匆忙忙；匆忙之中"}, {"w": "急忙", "py": "jímáng", "vi": "vội vàng (việc gấp)", "use": "急忙赶去；急忙说；急急忙忙"}, {"w": "慌忙", "py": "huāngmáng", "vi": "cuống quýt, luống cuống", "use": "慌忙站起；慌忙躲避；慌慌张张"}, {"w": "连忙", "py": "liánmáng", "vi": "vội vàng đáp lại", "use": "连忙道歉；连忙站起；连忙说"}], "quiz": [{"q": "早上他起得太晚，____之中把课本落在了家里，直到老师开始讲课才发现自己两手空空。", "a": "匆忙", "why": "匆忙之中 = trong lúc vội vã, thiếu thời gian. 其他 từ không đi với 之中."}, {"q": "看到有人落水，他来不及脱外套，____跑到岸边，把救生圈扔了过去，同时大声呼救。", "a": "急忙", "why": "Việc cấp bách phải làm ngay → 急忙. 慌忙 mang sắc thái hoảng hốt, không hợp người chủ động cứu."}, {"q": "听见老师突然叫到自己的名字，他____站起来，结果碰翻了桌上的水杯，教室里响起一阵笑声。", "a": "慌忙", "why": "Hoảng hốt, luống cuống dẫn đến vụng về → 慌忙."}, {"q": "客人一进门，主人就____站起身来，请他们坐下，并给每个人倒了一杯热茶。", "a": "连忙", "why": "Đáp lại ngay hành động của người khác → 连忙."}]}, {"id": "bs-147", "tip": "宁可 = thà (chọn cái chấp nhận được, hay đi với 也不); 宁愿 = thà (tự nguyện, nghiêng về ý muốn); 宁肯 = thà chịu (ý chí kiên quyết).", "table": true, "words": [{"w": "宁可", "py": "nìngkě", "vi": "thà rằng", "use": "宁可…也不…；宁可多花时间；宁可得罪"}, {"w": "宁愿", "py": "nìngyuàn", "vi": "thà, tình nguyện", "use": "宁愿…也不…；宁愿放弃；宁愿受苦"}, {"w": "宁肯", "py": "nìngkěn", "vi": "thà chịu, quyết thà", "use": "宁肯…也不…；宁肯吃亏；宁肯等待"}], "quiz": [{"q": "____多花几个小时慢慢检查，我也不愿意把一份带有错误的报告交给客户，毕竟声誉比时间重要。", "a": "宁可", "why": "So sánh cân nhắc hai phương án, chọn cái nhẹ hơn → 宁可. 宁愿/宁肯 gần nghĩa, khác sắc thái nhẹ."}, {"q": "她____放弃高薪的工作，回到家乡照顾年迈的父母，也不想以后回想起来留下遗憾。", "a": "宁愿", "why": "Tự nguyện lựa chọn theo tình cảm → 宁愿."}, {"q": "这位老工匠____自己吃亏，也不肯在材料上偷工减料，所以几十年来口碑一直非常好。", "a": "宁肯", "why": "Ý chí kiên quyết thà chịu thiệt → 宁肯."}]}, {"id": "bs-148", "tip": "偶尔 = thỉnh thoảng, tần suất thấp, đi với động từ hành động; 稍微 = hơi, một chút, chỉ mức độ nhẹ, hay đi với 一点/一些/有点.", "table": true, "words": [{"w": "偶尔", "py": "ǒu'ěr", "vi": "thỉnh thoảng, lâu lâu mới", "use": "偶尔出现；偶尔去一次；偶尔才"}, {"w": "稍微", "py": "shāowēi", "vi": "hơi, một chút (mức độ nhẹ)", "use": "稍微休息一下；稍微有点；稍微大一些"}], "quiz": [{"q": "小李平时工作很忙，几乎没有时间看电影，只有在周末心情不错的时候，他才会____去一次电影院放松一下。", "a": "偶尔", "why": "Nói về tần suất hiếm hoi → 偶尔; 稍微 chỉ mức độ nhẹ, không nói được số lần."}, {"q": "这件外套的尺码对我来说偏大，请裁缝师傅把袖子和腰身____改小，不用改得太多，我穿着合身就行。", "a": "稍微", "why": "Chỉ mức độ chỉnh sửa nhẹ → 稍微; 偶尔 chỉ tần suất nên không hợp."}]}, {"id": "bs-149", "tip": "频繁 = tính từ, dày đặc/thường xuyên (往来频繁, 更换频繁), làm vị ngữ được; 屡次 = phó từ, nhiều lần lặp lại cùng một việc (thường việc đã xảy ra), đứng trước động từ.", "table": true, "words": [{"w": "频繁", "py": "pínfán", "vi": "thường xuyên, dồn dập", "use": "往来频繁；频繁更换；联系频繁"}, {"w": "屡次", "py": "lǚcì", "vi": "nhiều lần, lặp đi lặp lại", "use": "屡次三番；屡次违规；屡次失败"}], "quiz": [{"q": "近年来这座城市的人员往来十分____，每天有数万名商务人士乘坐高铁往返于两地之间，带动了当地酒店业的发展。", "a": "频繁", "why": "Cần tính từ làm vị ngữ sau 十分 → 频繁; 屡次 là phó từ, không đứng sau 十分."}, {"q": "这家公司的产品在质量检测中____不合格，监管部门发出了整改通知，最终决定暂停它的生产许可。", "a": "屡次", "why": "Nhấn mạnh lặp lại nhiều lần một việc đã xảy ra, đứng trước động từ → 屡次; 频繁 không tự nhiên đi với 不合格."}]}, {"id": "bs-150", "tip": "却 = nhưng (phó từ, đứng sau chủ ngữ, trước vị ngữ, chuyển ngược); 而 = mà (liên từ nối hai vế/ tính từ, cùng cấp hoặc tương phản); 则 = thì (đối chiếu hai vế hoặc nêu điều kiện, văn viết).", "table": true, "words": [{"w": "却", "py": "què", "vi": "nhưng, lại (chuyển ý ngược)", "use": "可是……却；他却；却又"}, {"w": "而", "py": "ér", "vi": "mà (nối tương phản/bổ sung)", "use": "既……而……；然而；因而"}, {"w": "则", "py": "zé", "vi": "thì (đối chiếu/điều kiện)", "use": "……则……；否则；反之则"}], "quiz": [{"q": "这家餐厅装修得非常豪华，价格也高得吓人，可顾客们____一点也不介意，每天晚上门口都排着长长的队伍。", "a": "却", "why": "Chuyển ý ngược với vế trước, đứng sau chủ ngữ → 却; 而 và 则 không đứng sau chủ ngữ để chuyển ngược như vậy."}, {"q": "他的这篇论文语言简练____内容丰富，既有扎实的数据支撑，又提出了不少新颖的观点，受到了评审专家的一致好评。", "a": "而", "why": "Nối hai tính chất cùng hướng giữa hai vế → 而; 却 mang nghĩa ngược, 则 dùng để đối chiếu."}, {"q": "在这次社区活动中，年长的居民负责接待和登记，年轻的志愿者____负责搬运物资和维持秩序，大家分工明确，配合默契。", "a": "则", "why": "Đối chiếu hai nhóm người, mỗi bên một việc → 则; 却 cần ý ngược, 而 thường đứng trước chủ ngữ thứ hai."}]}, {"id": "bs-151", "tip": "仍旧 = vẫn như cũ, nhấn giữ nguyên trạng thái xưa, không thay đổi; 仍然 = vẫn, dùng rộng, nhấn tiếp tục/duy trì dù hoàn cảnh thay đổi hay có trở ngại.", "table": true, "words": [{"w": "仍旧", "py": "réngjiù", "vi": "vẫn như cũ, y nguyên", "use": "仍旧如此；仍旧是老样子；依然仍旧"}, {"w": "仍然", "py": "réngrán", "vi": "vẫn, vẫn còn, tiếp tục", "use": "仍然坚持；仍然存在；仍然没有"}], "quiz": [{"q": "十年过去了，老同学们的聚会地点、点菜习惯和聊天的话题____是老样子，一点变化也没有，大家都感慨时间过得真快。", "a": "仍旧", "why": "Nhấn việc y nguyên như xưa, không đổi → 仍旧; 仍然 thiên về tiếp tục/kiên trì."}, {"q": "尽管面临资金短缺和人手不足的双重压力，团队成员们____坚持每天加班，力争按时完成这项重点工程。", "a": "仍然", "why": "Nhấn tiếp tục kiên trì bất chấp khó khăn → 仍然; 仍旧 nghiêng về giữ nguyên như cũ."}]}, {"id": "bs-152", "tip": "擅自 = tự tiện, làm không xin phép (sắc thái tiêu cực); 亲自 = đích thân (tự mình làm, thể hiện coi trọng); 各自 = riêng mỗi người/bên (ai làm việc người nấy).", "table": true, "words": [{"w": "擅自", "py": "shànzì", "vi": "tự tiện, tự ý (không xin phép)", "use": "擅自行动；擅自离岗；擅自修改"}, {"w": "亲自", "py": "qīnzì", "vi": "đích thân, tự mình", "use": "亲自出马；亲自动手；亲自接待"}, {"w": "各自", "py": "gèzì", "vi": "mỗi người/bên tự, riêng của mình", "use": "各自为政；各自回家；各自负责"}], "quiz": [{"q": "员工未经部门主管批准就____修改了客户合同中的关键条款，给公司造成了巨大的经济损失，最终被依法辞退。", "a": "擅自", "why": "Làm khi chưa được phép, hậu quả xấu → 擅自; 亲自 là đích thân, 各自 là mỗi người một."}, {"q": "为了表示对这次合作的重视，公司董事长不顾旅途劳累，____到机场迎接远道而来的外国客商，并陪同他们参观了工厂。", "a": "亲自", "why": "Chủ tịch tự mình đi đón để tỏ sự coi trọng → 亲自; 擅自 mang nghĩa tự tiện, 各自 cần nhiều chủ thể."}, {"q": "会议结束后，参加讨论的几位专家带着刚达成的共识，____返回了自己所在的城市，准备着手落实具体方案。", "a": "各自", "why": "Nhiều chuyên gia, mỗi người về thành phố của mình → 各自; 亲自 và 擅自 không có nghĩa phân chia này."}]}, {"id": "bs-153", "tip": "索性 = dứt khoát làm luôn (chỉ là phó từ, sau tình huống bất đắc dĩ); 干脆 = vừa là phó từ (như 索性) vừa là tính từ (nói/làm thẳng thắn, gọn gàng).", "table": true, "words": [{"w": "索性", "py": "suǒxìng", "vi": "dứt khoát, làm luôn cho xong", "use": "索性放弃；索性不去；索性睡了"}, {"w": "干脆", "py": "gāncuì", "vi": "dứt khoát; thẳng thắn, gọn gàng", "use": "干脆利落；回答干脆；干脆拒绝"}], "quiz": [{"q": "雨越下越大，打伞也挡不住了，几个孩子____把伞扔在一边，在雨中尽情地奔跑嬉戏起来，笑声传遍了整个院子。", "a": "索性", "why": "Phó từ chỉ quyết định làm luôn khi tình huống đã vậy → 索性 (干脆 cũng có nghĩa này, nhưng 干脆 còn là tính từ)."}, {"q": "面对对方提出的不合理要求，他回答得非常____，一句多余的话也没有，直接拒绝了，让谈判气氛一下子紧张起来。", "a": "干脆", "why": "Cần tính từ làm bổ ngữ sau 非常 (trả lời gọn gàng, thẳng thắn) → 干脆; 索性 chỉ là phó từ."}]}, {"id": "bs-154", "tip": "往 = đi về phía (địa điểm, hướng di chuyển: 运往, 开往); 朝 = quay mặt về hướng (朝南, 朝我笑); 向 = hướng tới người/phương hướng, cả nghĩa trừu tượng (向老师请教); 对 = đối với (đối tượng tác động/ quan hệ: 对健康有害).", "table": true, "words": [{"w": "往", "py": "wǎng", "vi": "đi về phía, hướng tới (địa điểm)", "use": "运往；开往；往前走"}, {"w": "朝", "py": "cháo", "vi": "quay về, hướng về (mặt/ phương)", "use": "朝南；朝着；朝我笑"}, {"w": "向", "py": "xiàng", "vi": "hướng tới, đối với (người/ hướng)", "use": "向老师请教；向前；向……学习"}, {"w": "对", "py": "duì", "vi": "đối với (đối tượng tác động)", "use": "对……有害；对……来说；对话"}], "quiz": [{"q": "这批蔬菜每天凌晨从山东产地出发，被连夜运____北京、上海等大城市的批发市场，保证居民早上就能买到新鲜菜。", "a": "往", "why": "Hướng vận chuyển hàng đến địa điểm → 运往; 对 không chỉ hướng, 朝/向 không đi sau 运 tự nhiên như vậy."}, {"q": "这排老房子的大门全都____东，每天清晨第一缕阳光都会照进院子里，主人们也习惯了早早起床，在院中喝茶看报。", "a": "朝", "why": "Cửa quay mặt về hướng đông (chỉ phương hướng của vật) → 朝; 往 không chỉ hướng quay mặt, 对 sai nghĩa."}, {"q": "年轻的工程师们虚心____老师傅请教，从最基本的焊接技术到复杂的设备维修，每一个细节都不愿意轻易放过。", "a": "向", "why": "Hành động hướng tới một người để xin học hỏi → 向; 往 và 朝 không dùng với 请教, 对 đổi nghĩa thành 'đối với'."}, {"q": "长期熬夜、饮食不规律，____身体健康会造成很大的伤害，医生建议他尽快调整作息，并适当增加运动量。", "a": "对", "why": "Chỉ đối tượng chịu tác động (sức khỏe) → 对; 往/朝/向 chỉ hướng nên không hợp."}]}, {"id": "bs-155", "tip": "往往 = thường thường (quy luật rút từ kinh nghiệm, không dùng cho tương lai); 刚刚 = vừa mới (hành động hoặc trạng thái vừa xảy ra cách đây rất ngắn).", "table": true, "words": [{"w": "往往", "py": "wǎngwǎng", "vi": "thường thường (quy luật)", "use": "往往如此；往往会；往往是"}, {"w": "刚刚", "py": "gānggāng", "vi": "vừa mới, vừa rồi", "use": "刚刚开始；刚刚还；刚刚离开"}], "quiz": [{"q": "经验丰富的老渔民____能根据海面的颜色和云层的变化，准确判断出未来几个小时的天气，从而及时避开危险的风暴。", "a": "往往", "why": "Quy luật chung rút ra từ kinh nghiệm → 往往; 刚刚 chỉ thời điểm vừa xảy ra."}, {"q": "会议室里的投影仪____还好好的，怎么才过了十几分钟就突然黑屏了，技术人员正急匆匆地赶过来检修设备。", "a": "刚刚", "why": "Chỉ mới vừa xong cách đây mười mấy phút → 刚刚; 往往 chỉ quy luật, không hợp một sự việc đơn lẻ."}]}, {"id": "bs-156", "tip": "对于 = đối với (nêu đối tượng của nhận định); 鉴于 = xét thấy/căn cứ vào (nêu lý do, văn viết, mở đầu vế sau là quyết định); 过于 = quá (đứng trước tính từ); 关于 = về (nêu đề tài, có thể làm định ngữ).", "table": true, "words": [{"w": "对于", "py": "duìyú", "vi": "đối với (nêu đối tượng)", "use": "对于……来说；对于这一问题；对于大多数人"}, {"w": "鉴于", "py": "jiànyú", "vi": "xét thấy, căn cứ vào", "use": "鉴于此；鉴于目前情况；鉴于……决定"}, {"w": "过于", "py": "guòyú", "vi": "quá (mức, thường tiêu cực)", "use": "过于谨慎；过于自信；过于简单"}, {"w": "关于", "py": "guānyú", "vi": "về (đề tài, phạm vi)", "use": "关于……的报道；关于这个问题；有关于"}], "quiz": [{"q": "____初次创业的年轻人来说，资金和经验的欠缺是最大的难题，因此他们需要提前做好充分的准备，并寻求专业人士的帮助。", "a": "对于", "why": "Nêu đối tượng đi với 来说 → 对于; 关于 không đi với 来说."}, {"q": "____近期连续出现强降雨天气，气象部门提醒市民尽量减少外出，学校也决定将原定的户外活动推迟到下周进行。", "a": "鉴于", "why": "Nêu căn cứ/lý do dẫn đến quyết định → 鉴于; 对于 và 关于 không mang nghĩa 'xét thấy'."}, {"q": "这篇报告的结论写得____武断，缺少足够的数据支持，评审专家建议作者补充实验材料后再重新提交审核。", "a": "过于", "why": "Trước tính từ 武断, chỉ mức độ quá đáng → 过于; các từ còn lại không đứng trước tính từ với nghĩa 'quá'."
